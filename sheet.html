<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sliding Cups — 造型樣張（龍）</title>
<style>
  body{margin:0;background:#2b2233;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;padding:16px 14px 40px}
  h1{font-size:18px;margin:0 0 4px} h2{font-size:14px;margin:22px 0 6px;color:#ffd9a8;font-weight:600}
  p{margin:2px 0 8px;font-size:12px;opacity:.75;line-height:1.5}
  .panel{background:#e9d3ac;border-radius:14px;padding:6px;overflow-x:auto}
  .panel.dark{background:#3b2f47}
  canvas{display:block}
  .gray{filter:grayscale(1)}
  .sil{filter:brightness(0)}
  .row{display:flex;gap:10px;flex-wrap:wrap}
</style>
</head>
<body>
<h1>Sliding Cups — 造型樣張：龍（範本）</h1>
<p>6 階棋子 × 杯子底座。標準：杯子是底座（碰撞圓），棋子站在杯口裡，粗輪廓卡通。</p>

<h2>① 放大（階級依真實相對大小）</h2>
<div class="panel"><canvas id="big"></canvas></div>

<h2>② 遊戲內實際大小（手機約此尺寸）</h2>
<div class="panel"><canvas id="game"></canvas></div>

<h2>③ 剪影測試：階級要分得出來</h2>
<div class="panel"><canvas id="sil" class="sil"></canvas></div>

<h2>④ 灰階測試：不靠顏色也要認得</h2>
<div class="panel"><canvas id="gray" class="gray"></canvas></div>

<h2>⑤ 表情（左→右）：待機 / 移動中（驚訝）/ 合併開心 / 眨眼</h2>
<div class="panel"><canvas id="faces"></canvas></div>

<h2>⑥ 並排：和遊戲中一樣的斜視角桌面</h2>
<div class="panel"><canvas id="table"></canvas></div>

<script>
/* ═══════ 造型模組 v2：杯子底座（1/4）＋ 龍的一生（3/4）═══════
   所有形狀都在「單位空間」裡畫：原點 = 杯子底部中心，單位 = 碰撞半徑 R，y 往上。 */
const TILT = 0.7;
const TIER_R = [22, 28, 36, 46, 58, 72];                 // 碰撞半徑（世界單位）
const CUP_H = [0.45, 0.6, 0.62, 0.6, 0.7, 0.78];          // 杯子高度（× R）；約佔整體高度的 1/4
const WING_K = [0, 0, 0.7, 0.78, 1.0, 1.2];
const SHIFT = 0.5;                                        // 生物底部下移到杯口前緣（像站在盤子上）               // 翅膀大小（摺起來的蝙蝠翼）

const DRAGON = {
  name: '龍',
  body: '#ff7a59', dark: '#e05a3d', light: '#ffb29b', line: '#4a1d12',
  belly: '#ffd9a8', bellyDark: '#e9b47a', horn: '#fff0c2', hornDark: '#dcbf7e',
  eye: '#ffb326', eyeDark: '#ff6a00', gold: '#ffd84a',
  wing: '#c8412a', wingIn: '#ff9d84',
  cup: '#fff1d6', cupShade: '#ecd3a8',
};

let c, K, LW;                                              // 目前的 context、種類、單位線寬
const sm = (pts) => {                                      // 圓潤封閉曲線
  const n = pts.length; c.beginPath();
  c.moveTo((pts[n - 1][0] + pts[0][0]) / 2, (pts[n - 1][1] + pts[0][1]) / 2);
  for (let i = 0; i < n; i++) {
    const p = pts[i], q = pts[(i + 1) % n];
    c.quadraticCurveTo(p[0], p[1], (p[0] + q[0]) / 2, (p[1] + q[1]) / 2);
  }
  c.closePath();
};
const sym = (half) => half.concat(half.slice(1, -1).reverse().map(p => [-p[0], p[1]]));   // 由右半邊產生左右對稱
function paint(fill, shade, x0, x1, split, noLine) {
  const g = c.createLinearGradient(x0, 0, x1, 0);
  g.addColorStop(0, fill); g.addColorStop(split, fill); g.addColorStop(split, shade); g.addColorStop(1, shade);
  c.fillStyle = g; c.fill();
  if (!noLine) { c.lineWidth = LW; c.strokeStyle = K.line; c.lineJoin = 'round'; c.lineCap = 'round'; c.stroke(); }
}
const flat = (fill) => { c.fillStyle = fill; c.fill(); c.lineWidth = LW; c.strokeStyle = K.line; c.lineJoin = 'round'; c.lineCap = 'round'; c.stroke(); };
function horn(bx, by, cx, cy, tx, ty, bw, fill) {            // 彎角：底(b)、控制點(c)、尖端(t)
  let dx = cx - bx, dy = cy - by; const m = Math.hypot(dx, dy) || 1; dx /= m; dy /= m;
  const px = -dy, py = dx;
  c.beginPath();
  c.moveTo(bx + px * bw / 2, by + py * bw / 2);
  c.quadraticCurveTo(cx + px * bw * 0.3, cy + py * bw * 0.3, tx, ty);
  c.quadraticCurveTo(cx - px * bw * 0.3, cy - py * bw * 0.3, bx - px * bw / 2, by - py * bw / 2);
  c.closePath();
  flat(fill || K.horn);
  c.beginPath(); c.moveTo(bx + (cx - bx) * 0.35 + px * bw * 0.12, by + (cy - by) * 0.35 + py * bw * 0.12);   // 角上的紋路
  c.lineTo(bx + (cx - bx) * 0.35 - px * bw * 0.12, by + (cy - by) * 0.35 - py * bw * 0.12);
  c.lineWidth = LW * 0.6; c.strokeStyle = K.hornDark; c.stroke();
}
function scales(x0, y0, x1, y1, s) {                          // 鱗片紋（目前路徑為裁切範圍）
  c.save(); c.clip();
  c.strokeStyle = 'rgba(74,29,18,.3)'; c.lineWidth = LW * 0.55; c.lineCap = 'round';
  let row = 0;
  for (let y = y0; y < y1; y += s * 0.78, row++) {
    for (let x = x0 + (row % 2 ? s / 2 : 0); x < x1; x += s) { c.beginPath(); c.arc(x, y, s * 0.42, 0.15 * Math.PI, 0.85 * Math.PI); c.stroke(); }
  }
  c.restore();
}
function eye(x, y, rx, ry, st) {
  c.beginPath(); c.ellipse(x, y, rx * 1.18, ry * 1.15, 0, 0, Math.PI * 2); c.fillStyle = '#2a120c'; c.fill();
  if (st && (st.blink || st.happy)) {                           // 眨眼 / 開心：彎月眼
    c.beginPath(); c.ellipse(x, y, rx * 1.18, ry * 1.15, 0, 0, Math.PI * 2); c.fillStyle = K.dark; c.fill();
    c.beginPath(); c.arc(x, y - ry * 0.1, rx * 0.95, 1.1 * Math.PI, 1.9 * Math.PI);
    c.lineWidth = LW * 1.3; c.strokeStyle = '#2a120c'; c.stroke(); return;
  }
  const g = c.createLinearGradient(0, y + ry, 0, y - ry);
  g.addColorStop(0, K.eyeDark); g.addColorStop(1, K.eye);
  c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); c.fillStyle = g; c.fill();
  const big = st && st.fast;
  c.beginPath(); c.ellipse(x, y, rx * (big ? 0.34 : 0.28), ry * 0.8, 0, 0, Math.PI * 2); c.fillStyle = '#2a120c'; c.fill();   // 直瞳
  c.beginPath(); c.arc(x - rx * 0.32, y + ry * 0.36, rx * 0.3, 0, Math.PI * 2); c.fillStyle = '#fff'; c.fill();                  // 高光
  c.beginPath(); c.arc(x + rx * 0.35, y - ry * 0.4, rx * 0.14, 0, Math.PI * 2); c.fillStyle = 'rgba(255,255,255,.8)'; c.fill();
}
function mouthSmile(x, y, w, st) {
  c.lineWidth = LW * 0.9; c.strokeStyle = '#4a1d12'; c.lineCap = 'round';
  if (st && st.fast) { c.beginPath(); c.ellipse(x, y - w * 0.1, w * 0.16, w * 0.22, 0, 0, Math.PI * 2); c.fillStyle = '#5b1b16'; c.fill(); c.stroke(); return; }
  if (st && st.happy) { c.beginPath(); c.arc(x, y + w * 0.05, w * 0.5, 1.1 * Math.PI, 1.9 * Math.PI, true); c.lineTo(x - w * 0.43, y + w * 0.05); c.closePath(); c.fillStyle = '#5b1b16'; c.fill(); c.stroke(); return; }
  c.beginPath(); c.arc(x, y + w * 0.2, w * 0.4, 1.18 * Math.PI, 1.82 * Math.PI); c.stroke();
}

/* ── 摺起來的蝙蝠翼（背在肩後，翼尖朝上）── */
function wing(side, k) {
  c.save(); c.scale(side, 1);
  const S = [0.55, 0.4], pt = (x, y) => [S[0] + (x - S[0]) * k, S[1] + (y - S[1]) * k];
  const Wr = pt(0.98, 1.12), T = pt(0.8, 1.85), M = pt(1.42, 1.3), Lo = pt(1.4, 0.6), B = pt(0.55, 0.12);
  const scal = (a, b) => { const m = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2]; return [m[0] + (Wr[0] - m[0]) * 0.2, m[1] + (Wr[1] - m[1]) * 0.2]; };
  c.beginPath(); c.moveTo(S[0], S[1]);
  c.quadraticCurveTo(...pt(0.68, 0.9), ...Wr);
  c.quadraticCurveTo(...pt(0.99, 1.6), ...T);
  c.quadraticCurveTo(...scal(T, M), ...M);
  c.quadraticCurveTo(...scal(M, Lo), ...Lo);
  c.quadraticCurveTo(...scal(Lo, B), ...B);
  c.closePath();
  c.fillStyle = K.wing; c.fill(); c.lineWidth = LW; c.strokeStyle = K.line; c.lineJoin = 'round'; c.stroke();
  c.lineWidth = LW * 0.9; c.strokeStyle = K.wingIn; c.lineCap = 'round';        // 翼指（亮線）
  for (const e of [M, Lo]) { c.beginPath(); c.moveTo(Wr[0], Wr[1]); c.lineTo(Wr[0] + (e[0] - Wr[0]) * 0.93, Wr[1] + (e[1] - Wr[1]) * 0.93); c.stroke(); }
  c.beginPath(); c.moveTo(Wr[0], Wr[1]); c.lineTo(Wr[0] + (B[0] - Wr[0]) * 0.8, Wr[1] + (B[1] - Wr[1]) * 0.8); c.stroke();
  c.beginPath(); c.moveTo(...pt(0.58, 0.45)); c.quadraticCurveTo(...pt(0.68, 0.9), ...Wr); c.quadraticCurveTo(...pt(0.99, 1.6), ...T);   // 主骨
  c.lineWidth = LW * 2.2; c.strokeStyle = K.line; c.stroke();
  c.lineWidth = LW * 1.2; c.strokeStyle = K.dark; c.stroke();
  const cl = [Wr[0] + 0.08 * k, Wr[1] + 0.14 * k];                               // 翼爪
  c.beginPath(); c.moveTo(Wr[0] - 0.05 * k, Wr[1] + 0.02); c.lineTo(cl[0] + 0.05 * k, cl[1] + 0.12 * k); c.lineTo(Wr[0] + 0.06 * k, Wr[1] - 0.02); c.closePath(); flat(K.horn);
  c.restore();
}

/* ── 身體（胸、頸）── */
function chest(opts) {
  const half = [[0, -0.16], [0.62, -0.11], [0.92, 0.06], [1.0, 0.32], [0.8, 0.54], [0.44, 0.7], [0, 0.76]];
  sm(sym(half)); paint(K.body, K.dark, -1.0, 1.0, 0.66);
  scales(-1.0, 0.05, 1.0, 0.76, 0.2);
  const belly = [[0, -0.14], [0.3, -0.1], [0.42, 0.28], [0.32, 0.62], [0, 0.7]];
  sm(sym(belly)); c.fillStyle = K.belly; c.fill(); c.lineWidth = LW * 0.8; c.strokeStyle = K.line; c.stroke();
  c.save(); sm(sym(belly)); c.clip();
  c.strokeStyle = K.bellyDark; c.lineWidth = LW * 0.7;
  for (let y = 0.12; y < 0.7; y += 0.12) { c.beginPath(); c.moveTo(-0.5, y); c.quadraticCurveTo(0, y - 0.07, 0.5, y); c.stroke(); }
  c.restore();
  if (opts && opts.armor) {                                    // 盔甲：肩甲＋頸甲
    for (const s of [-1, 1]) {
      c.beginPath(); c.ellipse(s * 0.78, 0.5, 0.26, 0.21, 0, 0, Math.PI * 2); paint(K.dark, K.wing, -1.0, 1.0, s < 0 ? 0.42 : 0.55);
      c.beginPath(); c.moveTo(s * 0.6, 0.5); c.quadraticCurveTo(s * 0.78, 0.62, s * 0.96, 0.5); c.lineWidth = LW * 0.8; c.strokeStyle = K.line; c.stroke();
      c.beginPath(); c.arc(s * 0.78, 0.42, LW * 0.9, 0, Math.PI * 2); c.fillStyle = K.horn; c.fill();
    }
    sm(sym([[0, 0.58], [0.5, 0.58], [0.4, 0.8], [0, 0.84]])); paint(K.hornDark, '#b99c5e', -0.5, 0.5, 0.64);
    for (const x of [-0.3, 0, 0.3]) { c.beginPath(); c.arc(x, 0.66, LW * 0.8, 0, Math.PI * 2); c.fillStyle = K.horn; c.fill(); }
  }
  if (opts && opts.medal) {                                    // 國王的胸章
    c.beginPath(); c.arc(0, 0.38, 0.15, 0, Math.PI * 2); flat(K.gold);
    c.beginPath(); c.arc(0, 0.38, 0.065, 0, Math.PI * 2); c.fillStyle = '#d6263b'; c.fill();
  }
}
function neck(top) {
  sm(sym([[0, 0.55], [0.5, 0.55], [0.38, top], [0, top + 0.05]]));
  paint(K.body, K.dark, -0.5, 0.5, 0.62);
  scales(-0.5, 0.55, 0.5, top, 0.17);
  c.save(); sm(sym([[0, 0.55], [0.2, 0.55], [0.16, top], [0, top]])); c.fillStyle = K.belly; c.globalAlpha = 0.9; c.fill(); c.restore();
}

/* ── 正面龍頭：y0 = 頸頂，w = 半寬，h = 高；mode 決定頭頂形狀 ── */
function headFront(y0, w, h, mode, st) {
  c.save(); c.translate(0, y0);
  const half = mode === 'mitre'
    ? [[0, -0.04 * h], [0.3 * w, -0.02 * h], [0.66 * w, 0.08 * h], [0.92 * w, 0.3 * h], [w, 0.55 * h], [0.78 * w, 0.84 * h], [0.32 * w, 1.1 * h], [0, 1.3 * h]]
    : mode === 'flat'
    ? [[0, -0.04 * h], [0.3 * w, -0.02 * h], [0.68 * w, 0.08 * h], [0.94 * w, 0.3 * h], [w, 0.6 * h], [0.92 * w, 0.9 * h], [0.5 * w, 0.97 * h], [0, 0.95 * h]]
    : [[0, -0.04 * h], [0.3 * w, -0.02 * h], [0.68 * w, 0.08 * h], [0.94 * w, 0.3 * h], [w, 0.62 * h], [0.72 * w, 0.92 * h], [0.34 * w, 1.0 * h], [0, 1.02 * h]];
  sm(sym(half)); paint(K.body, K.dark, -w, w, 0.64);
  scales(-w, 0.45 * h, w, 1.0 * h, 0.16);
  // 吻部：同色、微亮，中央一條脊線，細長鼻孔
  sm(sym([[0, -0.03 * h], [0.3 * w, 0], [0.52 * w, 0.12 * h], [0.54 * w, 0.3 * h], [0.34 * w, 0.46 * h], [0, 0.5 * h]]));
  paint(K.body, K.dark, -0.54 * w, 0.54 * w, 0.66);
  c.beginPath(); c.moveTo(-0.22 * w, 0.4 * h); c.quadraticCurveTo(0, 0.52 * h, 0.22 * w, 0.4 * h);
  c.lineWidth = LW * 1.4; c.strokeStyle = 'rgba(255,255,255,.35)'; c.stroke();
  for (const s2 of [-1, 1]) { c.save(); c.translate(s2 * 0.13 * w, 0.36 * h); c.rotate(s2 * 0.5); c.beginPath(); c.ellipse(0, 0, 0.03 * w, 0.055 * h, 0, 0, Math.PI * 2); c.fillStyle = '#4a1d12'; c.fill(); c.restore(); }   // 鼻孔
  mouthSmile(0, 0.1 * h, 0.5 * w, st);
  for (const s2 of [-1, 1]) {                                  // 小尖牙
    c.beginPath(); c.moveTo(s2 * 0.3 * w, 0.13 * h); c.lineTo(s2 * 0.24 * w, 0.02 * h); c.lineTo(s2 * 0.17 * w, 0.12 * h); c.closePath();
    c.fillStyle = '#fff'; c.fill(); c.lineWidth = LW * 0.5; c.strokeStyle = K.line; c.stroke();
  }
  // 眼睛 + 眉
  for (const s of [-1, 1]) {
    c.beginPath(); c.moveTo(s * 0.18 * w, 0.84 * h); c.quadraticCurveTo(s * 0.5 * w, 0.92 * h, s * 0.82 * w, 0.76 * h);
    c.lineWidth = LW * 1.6; c.strokeStyle = K.dark; c.lineCap = 'round'; c.stroke();
    eye(s * 0.5 * w, 0.6 * h, 0.17 * w, 0.2 * h, st);
  }
  // 腮紅
  c.fillStyle = 'rgba(255,90,120,.32)';
  for (const s of [-1, 1]) { c.beginPath(); c.ellipse(s * 0.78 * w, 0.3 * h, 0.12 * w, 0.07 * h, 0, 0, Math.PI * 2); c.fill(); }
  // 頭部高光
  c.beginPath(); c.moveTo(-0.55 * w, 0.88 * h); c.quadraticCurveTo(-0.2 * w, 1.0 * h, 0.15 * w, 0.99 * h);
  c.lineWidth = LW * 1.3; c.strokeStyle = 'rgba(255,255,255,.4)'; c.stroke();
  c.restore();
}
function earFins(y0, w, h) {                                   // 耳鰭
  c.save(); c.translate(0, y0);
  for (const s of [-1, 1]) {
    c.beginPath(); c.moveTo(s * 0.9 * w, 0.62 * h);
    c.lineTo(s * 1.4 * w, 0.78 * h); c.lineTo(s * 1.18 * w, 0.58 * h); c.lineTo(s * 1.38 * w, 0.42 * h); c.lineTo(s * 1.1 * w, 0.36 * h); c.lineTo(s * 0.92 * w, 0.3 * h);
    c.closePath(); flat(K.wingIn);
  }
  c.restore();
}
function circlet(y0, w, h, nSpikes, tallK, skipCenter) {                  // 皇冠：金環＋彎曲尖刺
  c.save(); c.translate(0, y0);
  const xs = nSpikes === 5 ? [-0.74, -0.38, 0, 0.38, 0.74] : [-0.6, 0, 0.6];
  const base = (x) => 0.9 * h - 0.1 * h * (1 - Math.abs(x)) * 0 - 0.1 * h * (1 - x * x / 0.6);
  xs.forEach((x) => {
    if (skipCenter && x === 0) return;
    const t = 1 - Math.abs(x) * 0.35;
    const bx = x * w, by = base(x) * 1 + 0.03, hh = tallK * t * (nSpikes === 5 ? 1 : 1.05);
    horn(bx, by, bx + x * 0.12, by + hh * 0.55, bx + x * 0.34, by + hh, 0.2, K.gold);
  });
  c.beginPath();
  c.moveTo(-0.97 * w, 0.78 * h); c.quadraticCurveTo(0, 0.6 * h, 0.97 * w, 0.78 * h);
  c.lineTo(0.9 * w, 0.95 * h); c.quadraticCurveTo(0, 0.78 * h, -0.9 * w, 0.95 * h); c.closePath();
  flat(K.gold);
  c.beginPath(); c.arc(0, 0.76 * h, 0.07, 0, Math.PI * 2); c.fillStyle = '#d6263b'; c.fill(); c.lineWidth = LW * 0.7; c.strokeStyle = K.line; c.stroke();
  c.restore();
}

/* ═══ 各階級 ═══ */
function tierPawn(st) {                                       // 兵：剛出生的小龍，下半身還在蛋殼裡
  // 小龍頭
  c.save(); c.translate(0, 0.78);
  for (const s of [-1, 1]) horn(s * 0.22, 0.52, s * 0.25, 0.68, s * 0.3, 0.8, 0.14);
  c.beginPath(); c.ellipse(0, 0.32, 0.56, 0.5, 0, 0, Math.PI * 2); paint(K.body, K.dark, -0.56, 0.56, 0.64);
  c.beginPath(); c.ellipse(0, 0.14, 0.3, 0.19, 0, 0, Math.PI * 2); paint(K.belly, K.bellyDark, -0.3, 0.3, 0.7);
  for (const s of [-1, 1]) { c.beginPath(); c.ellipse(s * 0.1, 0.2, 0.03, 0.025, 0, 0, Math.PI * 2); c.fillStyle = '#4a1d12'; c.fill(); }
  mouthSmile(0, 0.08, 0.34, st);
  for (const s of [-1, 1]) {
    eye(s * 0.26, 0.38, 0.14, 0.17, st);
    c.fillStyle = 'rgba(255,90,120,.32)'; c.beginPath(); c.ellipse(s * 0.42, 0.14, 0.08, 0.05, 0, 0, Math.PI * 2); c.fill();
  }
  c.beginPath(); c.moveTo(-0.34, 0.66); c.quadraticCurveTo(-0.1, 0.78, 0.12, 0.76);
  c.lineWidth = LW * 1.3; c.strokeStyle = 'rgba(255,255,255,.4)'; c.stroke();
  c.restore();
  // 蛋殼
  c.beginPath(); c.moveTo(-0.66, 0.0);
  c.quadraticCurveTo(-0.96, 0.3, -0.74, 0.58);
  const z = [[-0.62, 0.74], [-0.46, 0.54], [-0.32, 0.74], [-0.16, 0.56], [0, 0.76], [0.16, 0.56], [0.32, 0.74], [0.46, 0.54], [0.62, 0.74], [0.74, 0.58]];
  z.forEach(p => c.lineTo(p[0], p[1]));
  c.quadraticCurveTo(0.96, 0.3, 0.66, 0.0); c.quadraticCurveTo(0, -0.22, -0.66, 0.0); c.closePath();
  paint('#fff3dc', '#e8cfa4', -0.95, 0.95, 0.62);
  c.save(); c.clip();
  c.fillStyle = 'rgba(224,90,61,.45)';
  for (const [x, y, r] of [[-0.5, 0.25, 0.07], [-0.2, 0.12, 0.05], [0.25, 0.3, 0.08], [0.55, 0.16, 0.05], [-0.62, 0.5, 0.05], [0.08, 0.42, 0.045]]) { c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill(); }
  c.restore();
  for (const s of [-1, 1]) {                                    // 小爪扒在殼邊
    c.beginPath(); c.ellipse(s * 0.5, 0.7, 0.13, 0.09, 0, 0, Math.PI * 2); flat(K.body);
    for (const d of [-0.07, 0, 0.07]) { c.beginPath(); c.arc(s * 0.5 + d, 0.79, 0.032, 0, Math.PI * 2); c.fillStyle = K.horn; c.fill(); c.lineWidth = LW * 0.5; c.stroke(); }
  }
}

function tierKnight(st) {                                     // 馬：馬頭輪廓的龍（側面朝左）
  chest({});
  const P = [[0.7, 0.5], [0.7, 0.5], [0.66, 1.0], [0.54, 1.5], [0.4, 1.95], [0.16, 2.15], [-0.12, 2.12], [-0.42, 1.95], [-0.78, 1.62],
    [-1.05, 1.4], [-1.18, 1.24], [-1.1, 1.08], [-0.86, 1.0], [-0.58, 1.02], [-0.4, 1.1], [-0.34, 0.92], [-0.5, 0.7], [-0.72, 0.5], [-0.72, 0.5]];
  for (const [x, y, l] of [[0.66, 0.82, 0.3], [0.6, 1.18, 0.32], [0.48, 1.55, 0.32], [0.34, 1.9, 0.28]]) {      // 背脊（在身後）
    c.beginPath(); c.moveTo(x - 0.06, y - 0.14); c.quadraticCurveTo(x + l * 0.5, y - 0.02, x + l, y + 0.12); c.quadraticCurveTo(x + l * 0.4, y + 0.16, x - 0.06, y + 0.2); c.closePath(); flat(K.horn);
  }
  horn(0.06, 2.06, 0.2, 2.3, 0.36, 2.62, 0.24);                // 頭角
  sm(P); paint(K.body, K.dark, -1.2, 0.7, 0.72);
  scales(-0.3, 0.6, 0.7, 2.1, 0.17);
  c.save(); sm(P); c.clip();                                   // 下顎／喉部亮面
  c.beginPath(); c.moveTo(-1.25, 1.06); c.quadraticCurveTo(-0.7, 1.0, -0.4, 1.14); c.lineTo(-0.3, 0.5); c.lineTo(-0.8, 0.5); c.quadraticCurveTo(-0.4, 0.8, -0.6, 1.0); c.closePath();
  c.fillStyle = K.belly; c.fill(); c.restore();
  sm(P); c.lineWidth = LW; c.strokeStyle = K.line; c.lineJoin = 'round'; c.stroke();
  c.beginPath(); c.ellipse(-1.08, 1.24, 0.04, 0.055, 0, 0, Math.PI * 2); c.fillStyle = '#4a1d12'; c.fill();   // 鼻孔
  c.beginPath(); c.moveTo(-1.06, 1.12); c.quadraticCurveTo(-0.84, 1.1, -0.6, 1.15); c.quadraticCurveTo(-0.52, 1.22, -0.44, 1.2);
  c.lineWidth = LW * 0.9; c.strokeStyle = '#4a1d12'; c.stroke();                                              // 嘴線
  c.beginPath(); c.moveTo(-0.8, 1.11); c.lineTo(-0.76, 1.03); c.lineTo(-0.7, 1.12); c.closePath(); c.fillStyle = '#fff'; c.fill(); c.lineWidth = LW * 0.5; c.stroke();   // 尖牙
  c.beginPath(); c.moveTo(-0.7, 1.86); c.quadraticCurveTo(-0.5, 1.96, -0.26, 1.9); c.lineWidth = LW * 1.6; c.strokeStyle = K.dark; c.stroke();   // 眉
  eye(-0.56, 1.66, 0.16, 0.19, st);
  c.fillStyle = 'rgba(255,90,120,.32)'; c.beginPath(); c.ellipse(-0.5, 1.36, 0.11, 0.065, 0, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.moveTo(-0.1, 2.06); c.quadraticCurveTo(0.14, 2.12, 0.32, 1.98);                              // 頭頂高光
  c.lineWidth = LW * 1.3; c.strokeStyle = 'rgba(255,255,255,.4)'; c.stroke();
}
function tierBishop(st) {                                     // 象：主教帽形的頭、側角、小翅膀
  const y0 = 0.9, w = 0.62, h = 1.0;
  for (const s of [-1, 1]) horn(s * 0.55, y0 + 0.6, s * 0.88, y0 + 0.8, s * 1.02, y0 + 1.22, 0.24);
  earFins(y0, w, h);
  chest({}); neck(y0 + 0.05);
  headFront(y0, w, h, 'mitre', st);
  c.beginPath(); c.moveTo(-0.12, y0 + 1.02); c.quadraticCurveTo(0.12, y0 + 1.1, 0.26, y0 + 1.0);      // 主教的斜縫
  c.lineWidth = LW * 1.3; c.strokeStyle = K.line; c.lineCap = 'round'; c.stroke();
  c.beginPath(); c.arc(0, y0 + h * 1.34, 0.07, 0, Math.PI * 2); flat(K.gold);
}
function tierRook(st) {                                       // 城堡：盔甲鱗片、方塊角、小翅膀
  const y0 = 0.86, w = 0.66, h = 0.86;
  chest({ armor: true }); neck(y0 + 0.05);
  for (const s of [-1, 1]) {                                   // 方塊角（城垛）
    const x = s * 0.44;
    c.beginPath(); c.rect(x - 0.16, y0 + 0.62 * h, 0.32, 0.46); flat(K.horn);
    c.beginPath(); c.rect(x - 0.16, y0 + 0.62 * h + 0.46, 0.12, 0.13); flat(K.horn);
    c.beginPath(); c.rect(x + 0.04, y0 + 0.62 * h + 0.46, 0.12, 0.13); flat(K.horn);
  }
  headFront(y0, w, h, 'flat', st);
  c.save(); c.translate(0, y0);                                // 額頭甲片
  c.beginPath(); c.moveTo(-0.7 * w, 0.9 * h); c.lineTo(0.7 * w, 0.9 * h); c.lineTo(0.55 * w, 1.0 * h); c.lineTo(-0.55 * w, 1.0 * h); c.closePath(); flat(K.dark);
  c.restore();
}
function tierQueen(st) {                                      // 皇后：彎曲冠刺＋大翅膀
  const y0 = 0.98, w = 0.6, h = 0.95;
  earFins(y0, w, h);
  chest({}); neck(y0 + 0.05);
  circlet(y0, w, h, 5, 0.62);
  headFront(y0, w, h, 'round', st);
  circletBand(y0, w, h);
}
function tierKing(st) {                                       // 國王：十字王冠＋最大翅膀
  const y0 = 1.04, w = 0.64, h = 1.0;
  earFins(y0, w, h);
  chest({ medal: true }); neck(y0 + 0.05);
  circlet(y0, w, h, 3, 0.5, true);
  c.save(); c.translate(0, y0 + 0.8 * h);                      // 十字（直接立在金環中央）
  c.beginPath(); c.rect(-0.08, 0.0, 0.16, 0.62); flat(K.gold);
  c.beginPath(); c.rect(-0.24, 0.34, 0.48, 0.15); flat(K.gold);
  c.restore();
  headFront(y0, w, h, 'round', st);
  circletBand(y0, w, h);
}
function circletBand(y0, w, h) {                               // 金環畫在頭上面
  c.save(); c.translate(0, y0);
  c.beginPath();
  c.moveTo(-0.95 * w, 0.76 * h); c.quadraticCurveTo(0, 0.62 * h, 0.95 * w, 0.76 * h);
  c.lineTo(0.9 * w, 0.92 * h); c.quadraticCurveTo(0, 0.78 * h, -0.9 * w, 0.92 * h); c.closePath();
  flat(K.gold);
  c.beginPath(); c.arc(0, 0.74 * h, 0.07, 0, Math.PI * 2); c.fillStyle = '#d6263b'; c.fill(); c.lineWidth = LW * 0.7; c.strokeStyle = K.line; c.stroke();
  c.restore();
}

/* ── 主函式：(sx, sy) = 杯子底部中心（像素），R = 碰撞半徑（像素）── */
function drawCupPiece(ctx, skin, tier, sx, sy, R, st) {
  st = st || {}; K = skin;
  const hcup = CUP_H[tier];                                   // 杯子高度（單位 R）
  const ctxPx = ctx;
  if (!st.noShadow) {
    ctxPx.fillStyle = 'rgba(0,0,0,.2)';
    ctxPx.beginPath(); ctxPx.ellipse(sx + R * 0.05, sy + R * TILT * 0.1, R * 1.06, R * TILT * 1.0, 0, 0, Math.PI * 2); ctxPx.fill();
  }
  if (st.glow) {
    ctxPx.strokeStyle = 'rgba(255,255,255,.6)'; ctxPx.lineWidth = 3;
    ctxPx.beginPath(); ctxPx.ellipse(sx, sy, R * 1.15, R * TILT * 1.15, 0, 0, Math.PI * 2); ctxPx.stroke();
  }
  c = ctx; c.save(); c.translate(sx, sy); c.scale(R, -R);
  LW = Math.max(0.06, 1.5 / R);
  c.translate(0, hcup);                                       // 原點移到杯口中心
  if (WING_K[tier]) { c.save(); c.translate(0, -SHIFT); wing(-1, WING_K[tier]); wing(1, WING_K[tier]); c.restore(); }
  // 杯子（底座）
  c.save(); c.translate(0, -hcup);
  c.beginPath(); c.moveTo(-0.8, 0); c.ellipse(0, 0, 0.8, 0.8 * TILT, 0, Math.PI, 2 * Math.PI, false);
  c.lineTo(1, hcup); c.ellipse(0, hcup, 1, TILT, 0, 0, Math.PI, false); c.closePath();
  paint(skin.cup, skin.cupShade, -1, 1, 0.64);
  const rAt = y => 0.8 + 0.2 * (y / hcup), b0 = hcup * 0.2, b1 = hcup * 0.5;            // 種類色帶
  c.beginPath(); c.moveTo(-rAt(b0), b0); c.ellipse(0, b0, rAt(b0), rAt(b0) * TILT, 0, Math.PI, 2 * Math.PI, false);
  c.lineTo(rAt(b1), b1); c.ellipse(0, b1, rAt(b1), rAt(b1) * TILT, 0, 0, Math.PI, false); c.closePath();
  paint(skin.body, skin.dark, -1, 1, 0.64);
  c.beginPath(); c.ellipse(0, hcup, 1, TILT, 0, 0, Math.PI * 2); flat(skin.horn);                // 盤面
  c.beginPath(); c.ellipse(0, hcup, 0.86, TILT * 0.8, 0, 0, Math.PI * 2); c.fillStyle = skin.cup; c.fill();
  c.restore();
  // 生物（站在杯子的盤面上）
  c.save(); c.translate(0, -SHIFT);
  [tierPawn, tierKnight, tierBishop, tierRook, tierQueen, tierKing][tier](st);
  c.restore();
  c.restore();
}


/* ═══════ 樣張頁面 ═══════ */
function setup(id, w, h) {
  const cv = document.getElementById(id), d = window.devicePixelRatio || 1;
  cv.width = w * d; cv.height = h * d; cv.style.width = w + 'px'; cv.style.height = h + 'px';
  const x = cv.getContext('2d'); x.setTransform(d, 0, 0, d, 0, 0); return x;
}
function rowOf(id, scale, opts) {
  opts = opts || {};
  const pad = 14, gap = 16, hMax = TIER_R[5] * scale * 4.6;
  let w = pad; const xs = [];
  for (let t = 0; t < 6; t++) { const R = TIER_R[t] * scale; xs.push(w + R * 1.4); w += R * 2.8 + gap; }
  const ctx = setup(id, w + pad, hMax + 60);
  for (let t = 0; t < 6; t++) {
    const R = TIER_R[t] * scale;
    drawCupPiece(ctx, DRAGON, t, xs[t], hMax + 18, R, opts.st || {});
    if (opts.labels) { ctx.fillStyle = '#5a3f22'; ctx.font = '11px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(['兵', '馬', '象', '城堡', '皇后', '國王'][t], xs[t], hMax + 54); }
  }
}
rowOf('big', 1.75, { labels: true });
rowOf('game', 0.64, { labels: true });
rowOf('sil', 1.1);
rowOf('gray', 1.1);
(function faces() {
  const states = [{}, { fast: true }, { happy: true }, { blink: true }], col = 300;
  const ctx = setup('faces', 14 + states.length * col, 800);
  states.forEach((st, i) => {
    drawCupPiece(ctx, DRAGON, 0, 150 + i * col, 215, 62, st);
    drawCupPiece(ctx, DRAGON, 5, 150 + i * col, 780, 70, st);
  });
})();
(function table() {   // 桌面上的樣子（單一種類，玩一陣子之後的畫面）
  const W = 340, H = 420, ctx = setup('table', W, H), f = 0.5;
  ctx.fillStyle = '#e8cb9c'; ctx.fillRect(0, 0, W, H);
  const cups = [[0, 70, 90], [1, 190, 80], [0, 260, 130], [2, 110, 175], [4, 250, 250], [0, 60, 250], [1, 160, 300], [3, 90, 340], [5, 230, 390], [0, 310, 330]];
  cups.sort((a, b) => a[2] - b[2]).forEach(([t, x, y]) => drawCupPiece(ctx, DRAGON, t, x, y, TIER_R[t] * 0.62, {}));
})();
