<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Sliding Cups</title>
<style>
  html,body{margin:0;height:100%;background:#2b2233;overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;color:#fff}
  #app{position:fixed;inset:0;display:flex;flex-direction:column}
  #hud{flex:none;display:flex;justify-content:space-between;align-items:flex-end;
    padding:calc(env(safe-area-inset-top) + 8px) 14px 4px;font-size:13px;opacity:.95}
  #hud b{font-size:22px;font-variant-numeric:tabular-nums}
  #hud .r{text-align:right}
  #stage{flex:1;min-height:0;position:relative}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #bar{flex:none;display:flex;gap:8px;justify-content:center;
    padding:6px 12px calc(8px + env(safe-area-inset-bottom))}
  button{font:inherit;font-size:13px;color:#fff;background:#4a3b5c;border:0;border-radius:10px;
    padding:8px 12px;min-width:84px}
  button:active{background:#6b5585}
  #ov{position:fixed;inset:0;z-index:5;display:none;align-items:center;justify-content:center;background:rgba(30,15,40,.78)}
  #ov.on{display:flex}
  #ov.result{background:rgba(30,15,40,0);animation:ovin .5s .9s forwards}
  @keyframes ovin{to{background:rgba(30,15,40,.78)}}
  #ov.result .card{opacity:0;animation:cin .4s .9s forwards}
  @keyframes cin{to{opacity:1}}
  .card{width:min(86vw,360px);display:flex;flex-direction:column;gap:10px;text-align:center}
  .card h1{margin:0;font-size:40px}.card h2{margin:0;font-size:30px}
  .card .sub{margin:0 0 8px;opacity:.7}.card .big{font-size:44px;font-weight:700;margin:0}
  .card .best{margin:6px 0 0;opacity:.8;font-size:14px}
  .card button{font-size:17px;padding:14px;border-radius:14px}
  .card button small{display:block;font-size:12px;opacity:.7;margin-top:3px}
  .card button.main{background:#ff7a59}.card button:disabled{opacity:.35}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div>分數<br><b id="score">0</b></div>
    <div class="r">最高<br><b id="best">0</b></div>
  </div>
  <div id="stage"><canvas id="c"></canvas></div>
  <div id="ov"></div>
  <div id="bar">
    <button id="bPause">暫停</button>
    <button id="bAssist"></button>
  </div>
</div>

<script>
/* ════════════════════════════════════════════════════════════════════
   Sliding Cups — 單檔架構
   ┌ CORE（不碰 DOM，可在 Node 測試）
   │   CONFIG   所有資料與手感參數
   │   RNG      有種子的亂數
   │   Physics  純物理：移動、摩擦、碰撞、合併；只產生「事件」
   │   Modes    模式物件：出什麼杯、怎樣算輸、是否強制輔助線
   │   Game     規則與狀態機：出杯、發射（冰壺式）、計分、勝負
   └ APP（瀏覽器）
       Storage / Renderer / FX / Input / UI / main
   ════════════════════════════════════════════════════════════════════ */

/*#core-start*/
const SC = (() => {
'use strict';

/* ───────── CONFIG ───────── */
const CONFIG = {
  world: { W: 600, H: 945, LINE_Y: 720, SPAWN: { x: 300, y: 845 } },   // 俯視平面；y=0 遠端，y=H 靠近玩家
  phys: {
    STEP: 1 / 120,  // 固定時間步長
    A: 560,         // 滑動摩擦（固定減速）
    K: 0.7,         // 速度阻尼
    VMAX: 3600,     // 發射速度上限
    VMIN: 630,      // 越線時低於此速度 → 退回
    GAIN: 0.9,      // 手指速度（低於 KNEE）→ 杯子速度
    KNEE: 700,      // 超過此手指速度，超出的部分改用 GAIN_HI
    GAIN_HI: 1.7,
    E: 0.6,         // 杯子互撞彈性
    EW: 0.35,       // 撞牆彈性
    STOP: 8,        // 低於此速度視為停下
    HIST_MS: 100,   // 計算發射速度的時間窗
  },
  rules: { DANGER_T: 3, SETTLE_T: 0.25, FADE_T: 1.2, RETURN_RATE: 14, GRAB_MARGIN: 40, GRAB_OFFSET_MAX: 120 },
  scoring: { base: 10, checkmate: 2000 },
  nextTierCum: [0.5, 0.8, 0.95],                 // 出杯階級的累積機率：兵 50%、馬 30%、象 15%、城堡 5%
  view: { TILT: 0.7, S_FAR: 0.78 },
  // massK 質量倍率、fric 摩擦倍率、bounce 彈性倍率：越大的杯子越重、停得越快、彈得越少
  tiers: [
    { r: 22, glyph: '♟', name: '兵',   massK: 1.0, fric: 1.00, bounce: 1.00 },
    { r: 28, glyph: '♞', name: '馬',   massK: 1.1, fric: 1.08, bounce: 0.95 },
    { r: 36, glyph: '♝', name: '象',   massK: 1.2, fric: 1.16, bounce: 0.90 },
    { r: 46, glyph: '♜', name: '城堡', massK: 1.3, fric: 1.24, bounce: 0.85 },
    { r: 58, glyph: '♛', name: '皇后', massK: 1.4, fric: 1.32, bounce: 0.80 },
    { r: 72, glyph: '♚', name: '國王', massK: 1.5, fric: 1.40, bounce: 0.75 },
  ],
  kinds: [
    { id: 'dragon',      name: '龍',     body: '#ff7a59', dark: '#c9482a', rim: '#ffc9b8' },
    { id: 'unicorn',     name: '獨角獸', body: '#b98cff', dark: '#7d4fd1', rim: '#e6d6ff' },
    { id: 'hydra',       name: '九頭蛇', body: '#5fd08a', dark: '#2f9a58', rim: '#c9f2d8' },
    { id: 'phoenix',     name: '鳳凰',   body: '#ffc23d', dark: '#d18f00', rim: '#ffe7a8' },
    { id: 'basilisk',    name: '蛇怪',   body: '#3cc7c2', dark: '#1d8f8b', rim: '#bff0ee' },
    { id: 'griffin',     name: '獅鷲',   body: '#c58a5a', dark: '#8a5832', rim: '#ecd0b6' },
    { id: 'aqrabuamelu', name: '蠍尾人', body: '#e8b86a', dark: '#b27d2c', rim: '#f8e3bd' },
  ],
};
const TOP = CONFIG.tiers.length - 1;

/* ───────── RNG（mulberry32，有種子 → 可重播、每日挑戰、自動測試）───────── */
function makeRng(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ───────── PHYSICS（純函式，只改 world，不認識分數與規則）───────── */
const Physics = (() => {
  const P = CONFIG.phys, Wd = CONFIG.world;
  function createWorld() { return { cups: [], events: [], nextId: 0, acc: 0 }; }
  function makeCup(world, kind, tier, x, y) {
    const T = CONFIG.tiers[tier], r = T.r;
    return { id: ++world.nextId, kind, tier, x, y, vx: 0, vy: 0, r, m: r * r * T.massK,
             fric: T.fric, bounce: T.bounce, held: false, pop: 0, dead: false };
  }
  function integrate(world, dt) {
    const W = Wd.W, H = Wd.H;
    for (const c of world.cups) {
      if (c.held || c.dead) continue;
      const sp = Math.hypot(c.vx, c.vy);
      if (sp > 0) {
        const sp2 = Math.max(0, sp - (P.A + P.K * sp) * c.fric * dt);
        if (sp2 < P.STOP) { c.vx = c.vy = 0; }
        else { const f = sp2 / sp; c.vx *= f; c.vy *= f; }
      }
      c.x += c.vx * dt; c.y += c.vy * dt;
      if (c.x < c.r)     { c.x = c.r;     if (c.vx < 0) c.vx = -c.vx * P.EW * c.bounce; }
      if (c.x > W - c.r) { c.x = W - c.r; if (c.vx > 0) c.vx = -c.vx * P.EW * c.bounce; }
      if (c.y < c.r)     { c.y = c.r;     if (c.vy < 0) c.vy = -c.vy * P.EW * c.bounce; }
      if (c.y > H - c.r) { c.y = H - c.r; if (c.vy > 0) c.vy = -c.vy * P.EW * c.bounce; }
    }
  }
  function merge(world, a, b) {
    a.dead = b.dead = true;
    const x = (a.x * a.m + b.x * b.m) / (a.m + b.m);
    const y = (a.y * a.m + b.y * b.m) / (a.m + b.m);
    if (a.tier === TOP) { world.events.push({ type: 'checkmate', kind: a.kind, x, y }); return; }
    const nc = makeCup(world, a.kind, a.tier + 1, x, y);
    nc.vx = (a.vx * a.m + b.vx * b.m) / (a.m + b.m);
    nc.vy = (a.vy * a.m + b.vy * b.m) / (a.m + b.m);
    nc.pop = 1;
    world.cups.push(nc);
    world.events.push({ type: 'merge', kind: a.kind, tier: nc.tier, x, y });
  }
  function collide(world) {
    const cups = world.cups;
    for (let i = 0; i < cups.length; i++) {
      const a = cups[i];
      if (a.dead || a.held) continue;
      for (let j = i + 1; j < cups.length; j++) {
        const b = cups[j];
        if (b.dead || b.held) continue;
        const dx = b.x - a.x, dy = b.y - a.y, rr = a.r + b.r;
        const d2 = dx * dx + dy * dy;
        if (d2 >= rr * rr) continue;
        if (a.kind === b.kind && a.tier === b.tier) { merge(world, a, b); break; }
        const d = Math.sqrt(d2) || 0.0001;
        const nx = dx / d, ny = dy / d;
        const ia = 1 / a.m, ib = 1 / b.m;
        const corr = (rr - d) / (ia + ib) * 0.8;
        a.x -= nx * corr * ia; a.y -= ny * corr * ia;
        b.x += nx * corr * ib; b.y += ny * corr * ib;
        const rvn = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
        if (rvn < 0) {
          const e = P.E * (a.bounce + b.bounce) / 2;
          const j2 = -(1 + e) * rvn / (ia + ib);
          a.vx -= j2 * nx * ia; a.vy -= j2 * ny * ia;
          b.vx += j2 * nx * ib; b.vy += j2 * ny * ib;
        }
      }
    }
  }
  function substep(world, dt) { integrate(world, dt); collide(world); }
  // 以固定步長推進；回傳前清掉已死亡的杯子
  function advance(world, dt) {
    world.acc += dt;
    while (world.acc >= P.STEP) { substep(world, P.STEP); world.acc -= P.STEP; }
    world.cups = world.cups.filter(c => !c.dead);
  }
  const isMoving = (world) => world.cups.some(c => !c.held && (c.vx || c.vy));
  const isSettled = (c) => !c.held && !c.vx && !c.vy;
  // 預測路徑（只算摩擦與撞牆，不含其他杯子）
  function predictPath(c, v) {
    const W = Wd.W, H = Wd.H, pts = [], pos = { x: c.x, y: c.y }, vel = { x: v.vx, y: v.vy }, dt = 1 / 60;
    for (let i = 0; i < 480; i++) {
      const sp = Math.hypot(vel.x, vel.y);
      const sp2 = Math.max(0, sp - (P.A + P.K * sp) * c.fric * dt);
      if (sp2 < P.STOP) break;
      const f = sp2 / sp; vel.x *= f; vel.y *= f;
      pos.x += vel.x * dt; pos.y += vel.y * dt;
      if (pos.x < c.r)     { pos.x = c.r;     vel.x = Math.abs(vel.x) * P.EW * c.bounce; }
      if (pos.x > W - c.r) { pos.x = W - c.r; vel.x = -Math.abs(vel.x) * P.EW * c.bounce; }
      if (pos.y < c.r)     { pos.y = c.r;     vel.y = Math.abs(vel.y) * P.EW * c.bounce; }
      if (pos.y > H - c.r) { pos.y = H - c.r; vel.y = -Math.abs(vel.y) * P.EW * c.bounce; }
      if (i % 3 === 0) pts.push({ x: pos.x, y: pos.y });
    }
    pts.push({ x: pos.x, y: pos.y });
    return pts;
  }
  return { createWorld, makeCup, advance, substep, isMoving, isSettled, predictPath };
})();

/* ───────── MODES（模式物件：只回答「出什麼杯」「怎樣算輸」）───────── */
const Modes = {
  classic: {
    id: 'classic', label: '經典',
    danger: 'lose',            // 杯子停在線內太久 → 輸
    assistForced: false,
    tracksBest: true,
    pickNext(g) {              // 與原型相同的擲骰順序：先階級、再種類
      const t = g.rng(), cum = CONFIG.nextTierCum;
      let tier = cum.length; for (let i = 0; i < cum.length; i++) if (t < cum[i]) { tier = i; break; }
      return { kind: Math.floor(g.rng() * g.nKinds), tier };
    },
  },
  practice: {
    id: 'practice', label: '練習',
    danger: 'fade',            // 越線的杯子淡出消失，不會輸
    assistForced: true,
    tracksBest: false,
    pickNext(g) { return Modes.classic.pickNext(g); },
  },
};

/* ───────── GAME（規則與狀態機；不碰 DOM）───────── */
const Game = (() => {
  const P = CONFIG.phys, R = CONFIG.rules, Wd = CONFIG.world;

  function create(opts) {
    opts = opts || {};
    const seed = opts.seed != null ? opts.seed >>> 0 : (Math.random() * 4294967296) >>> 0;
    const g = {
      seed, rng: makeRng(seed), nKinds: Math.max(1, Math.min(CONFIG.kinds.length, opts.nKinds || 1)),
      mode: Modes[opts.mode || 'classic'], world: Physics.createWorld(),
      phase: 'ready',           // ready（等玩家發射）| flying（杯子在滑）| over
      score: 0, shotMerges: 0, dangerT: 0, settleT: 0,
      held: null, next: null, drag: null, assist: false,
    };
    restart(g);
    return g;
  }
  function restart(g, seed) {
    if (seed != null) { g.seed = seed >>> 0; g.rng = makeRng(g.seed); }
    g.world = Physics.createWorld();
    g.held = null; g.drag = null; g.score = 0; g.shotMerges = 0; g.dangerT = 0; g.settleT = 0;
    g.next = g.mode.pickNext(g);
    spawn(g);
  }
  function spawn(g) {
    const c = Physics.makeCup(g.world, g.next.kind, g.next.tier, Wd.SPAWN.x, Wd.SPAWN.y);
    c.held = true; g.world.cups.push(c); g.held = c;
    g.next = g.mode.pickNext(g);
    g.phase = 'ready';
  }
  function setMode(g, id) { g.mode = Modes[id]; restart(g); }
  const assistOn = (g) => g.assist || g.mode.assistForced;

  /* ── 發射：手指速度 → 杯子速度（含用力時放大的曲線）── */
  function estimateV(g) {
    const d = g.drag;
    if (!d || d.hist.length < 2) return { vx: 0, vy: 0 };
    const a = d.hist[0], b = d.hist[d.hist.length - 1];
    const dt = Math.max((b.t - a.t) / 1000, 0.02);
    const fx = (b.x - a.x) / dt, fy = (b.y - a.y) / dt, sp = Math.hypot(fx, fy);
    if (sp < 1e-6) return { vx: 0, vy: 0 };
    const out = sp <= P.KNEE ? sp * P.GAIN : P.KNEE * P.GAIN + (sp - P.KNEE) * P.GAIN_HI;
    return { vx: fx / sp * out, vy: fy / sp * out };
  }
  function clampV(v) {
    const sp = Math.hypot(v.vx, v.vy);
    if (sp > P.VMAX) { const f = P.VMAX / sp; return { vx: v.vx * f, vy: v.vy * f }; }
    return v;
  }
  const launchV = (g) => clampV(estimateV(g));

  function beginDrag(g, wx, wy, pid, t) {
    if (g.phase !== 'ready' || !g.held || g.drag) return false;
    if (wy < Wd.LINE_Y - R.GRAB_MARGIN) return false;
    let ox = g.held.x - wx, oy = g.held.y - wy;
    const m = Math.hypot(ox, oy);
    if (m > R.GRAB_OFFSET_MAX) { ox *= R.GRAB_OFFSET_MAX / m; oy *= R.GRAB_OFFSET_MAX / m; }
    g.drag = { id: pid, ox, oy, hist: [{ t, x: g.held.x, y: g.held.y }] };
    return true;
  }
  // 回傳 'launched' | 'returned' | null
  function dragTo(g, wx, wy, pid, t) {
    const d = g.drag;
    if (!d || pid !== d.id || !g.held) return null;
    const h = g.held;
    const x = Math.max(h.r, Math.min(Wd.W - h.r, wx + d.ox));
    const y = Math.min(Wd.H - h.r, wy + d.oy);
    h.x = x; h.y = y;
    d.hist.push({ t, x, y });
    while (d.hist.length > 2 && t - d.hist[0].t > P.HIST_MS) d.hist.shift();
    if (y < Wd.LINE_Y) {                         // 越過線：決定是否發射
      const v = launchV(g);
      if (Math.hypot(v.vx, v.vy) < P.VMIN) { h.y = Wd.LINE_Y + 10; g.drag = null; return 'returned'; }
      h.vx = v.vx; h.vy = v.vy; h.held = false;
      g.held = null; g.drag = null; g.phase = 'flying'; g.shotMerges = 0; g.settleT = 0;
      return 'launched';
    }
    return null;
  }
  function endDrag(g, pid) { if (g.drag && g.drag.id === pid) g.drag = null; }

  /* ── 每幀更新。回傳這一幀發生的事件（給特效、音效、UI 用）── */
  function update(g, dt) {
    const out = [];
    if (g.phase === 'over') return out;
    const w = g.world;
    Physics.advance(w, dt);
    if (g.held && !w.cups.includes(g.held)) g.held = null;
    for (const c of w.cups) if (c.pop > 0) c.pop = Math.max(0, c.pop - dt / 0.35);

    if (g.held && !g.drag) {                      // 放開手指 → 退回中間
      const k = Math.min(1, dt * R.RETURN_RATE);
      g.held.x += (Wd.SPAWN.x - g.held.x) * k; g.held.y += (Wd.SPAWN.y - g.held.y) * k;
    }

    for (const ev of w.events) {                  // 物理事件 → 計分
      if (ev.type === 'merge') {
        g.shotMerges++;
        ev.combo = g.shotMerges;
        ev.gain = Math.round(CONFIG.scoring.base * Math.pow(2, ev.tier) * g.shotMerges);
        g.score += ev.gain;
      } else if (ev.type === 'checkmate') {
        ev.gain = CONFIG.scoring.checkmate; g.score += ev.gain;
      }
      out.push(ev);
    }
    w.events.length = 0;

    if (g.phase === 'flying') {                   // 全部停下後，出下一個杯子
      if (!Physics.isMoving(w)) {
        g.settleT += dt;
        if (g.settleT > R.SETTLE_T) { g.settleT = 0; spawn(g); out.push({ type: 'spawn' }); }
      } else g.settleT = 0;
    }

    const danger = w.cups.some(c => Physics.isSettled(c) && c.y > Wd.LINE_Y);   // 停在線內的杯子
    if (danger) g.dangerT += dt; else g.dangerT = Math.max(0, g.dangerT - dt * 2);
    if (g.mode.danger === 'lose') {
      if (g.dangerT >= R.DANGER_T) { g.phase = 'over'; out.push({ type: 'gameover', score: g.score }); }
    } else if (g.dangerT > R.FADE_T) {            // 練習模式：越線的杯子淡出消失，不扣分
      for (const c of w.cups) if (Physics.isSettled(c) && c.y > Wd.LINE_Y) { c.dead = true; out.push({ type: 'fade', x: c.x, y: c.y }); }
      w.cups = w.cups.filter(c => !c.dead);
      g.dangerT = 0;
    }
    return out;
  }

  return { create, restart, setMode, update, beginDrag, dragTo, endDrag, estimateV, launchV, assistOn };
})();

/* ───────── FLOW（畫面層級狀態機；轉換表即規格）───────── */
const Flow = (() => {
  const T = {
    menu:    { start: 'playing' },
    playing: { pause: 'paused', gameover: 'result', menu: 'menu' },
    paused:  { resume: 'playing', restart: 'playing', menu: 'menu' },
    result:  { restart: 'playing', menu: 'menu' },
  };
  const create = () => ({ state: 'menu' });
  function send(f, ev) { const n = T[f.state][ev]; if (!n) return false; f.state = n; return true; }
  return { create, send };
})();

return { CONFIG, makeRng, Physics, Modes, Game, Flow };
})();
/*#core-end*/

/* ════════════════════════ APP（只在瀏覽器執行）════════════════════════ */
(() => {
'use strict';
const { CONFIG, Physics, Modes, Game, Flow } = SC;
const { W, H, LINE_Y } = CONFIG.world;
const TILT = CONFIG.view.TILT, S_FAR = CONFIG.view.S_FAR;
const TIERS = CONFIG.tiers, KINDS = CONFIG.kinds;

/* ───────── Storage（有版本號的存檔）───────── */
const Storage = {
  KEY: 'slidingcups.save', VERSION: 1,
  load() {
    try {
      const s = JSON.parse(localStorage.getItem(this.KEY));
      if (s && s.v === this.VERSION) return s;
    } catch (e) {}
    let legacy = 0;
    try { legacy = +localStorage.getItem('slidingcups.best') || 0; } catch (e) {}   // 舊版原型的最高分
    return { v: this.VERSION, best: { classic: legacy } };
  },
  save(d) { try { localStorage.setItem(this.KEY, JSON.stringify(d)); } catch (e) {} },
};
const save = Storage.load();

/* ───────── 啟動參數 ───────── */
const params = new URLSearchParams(location.search);
const nKinds = Math.max(1, Math.min(KINDS.length, parseInt(params.get('kinds')) || 1));   // 預設 1 種（龍）
const seedParam = params.get('seed');
const game = Game.create({ nKinds, mode: 'classic', seed: seedParam != null ? parseInt(seedParam) : undefined });

/* ───────── Renderer（斜上方 2.5D；之後可換成貼圖）───────── */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let L = { cw: 0, ch: 0, dpr: 1, cx: 0, top: 0, f: 1, k: 1 };
let tilt = TILT;
function layout() {
  const r = canvas.getBoundingClientRect();
  L.cw = r.width; L.ch = r.height; L.dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(L.cw * L.dpr);
  canvas.height = Math.round(L.ch * L.dpr);
  const pad = 8, headroom = 58;
  const sAvg = (S_FAR + 1) / 2;
  let f = (L.cw - pad * 2) / W;
  const avail = L.ch - pad - headroom;
  tilt = Math.max(0.7, Math.min(0.88, avail / (f * sAvg * H)));
  let k = tilt * f * sAvg;
  if (k * H > avail) { k = avail / H; f = k / (tilt * sAvg); }
  L.f = f; L.k = k; L.cx = L.cw / 2; L.top = L.ch - pad - k * H;
}
function project(x, y) {
  const s = S_FAR + (1 - S_FAR) * (y / H);
  return { sx: L.cx + (x - W / 2) * L.f * s, sy: L.top + y * L.k, s: L.f * s };
}
function toWorld(e) {
  const r = canvas.getBoundingClientRect();
  const sx = e.clientX - r.left, sy = e.clientY - r.top;
  const y = (sy - L.top) / L.k;
  const s = S_FAR + (1 - S_FAR) * (y / H);
  return { x: W / 2 + (sx - L.cx) / (L.f * s), y };
}
function rr(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function drawCupAt(sx, sy, R, kind, tier, st) {          // ← 之後換貼圖就改這個函式
  st = st || {};
  const K = KINDS[kind];
  const ry = R * tilt, hgt = R * 0.95, topY = sy - hgt, rb = R * 0.8, ryb = ry * 0.8;
  if (!st.noShadow) {
    ctx.fillStyle = 'rgba(0,0,0,.22)';
    ctx.beginPath(); ctx.ellipse(sx + R * 0.06, sy + ry * 0.12, R * 1.04, ry * 1.0, 0, 0, Math.PI * 2); ctx.fill();
  }
  if (st.glow) {
    ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(sx, sy, R * 1.15, ry * 1.15, 0, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.beginPath();
  ctx.moveTo(sx - R, topY); ctx.lineTo(sx - rb, sy);
  ctx.ellipse(sx, sy, rb, ryb, 0, Math.PI, 0, true);
  ctx.lineTo(sx + R, topY);
  ctx.ellipse(sx, topY, R, ry, 0, 0, Math.PI, false);
  ctx.closePath();
  const g = ctx.createLinearGradient(sx - R, 0, sx + R, 0);
  g.addColorStop(0, K.dark); g.addColorStop(0.35, K.body); g.addColorStop(0.7, K.body); g.addColorStop(1, K.dark);
  ctx.fillStyle = g; ctx.fill();
  ctx.fillStyle = K.rim;
  ctx.beginPath(); ctx.ellipse(sx, topY, R, ry, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = K.dark;
  ctx.beginPath(); ctx.ellipse(sx, topY + ry * 0.06, R * 0.82, ry * 0.8, 0, 0, Math.PI * 2); ctx.fill();
  ctx.save();
  ctx.font = 'bold ' + Math.max(8, R * 1.15) + 'px "Segoe UI Symbol","Apple Symbols","Noto Sans Symbols 2",serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.lineWidth = Math.max(1, R * 0.07); ctx.strokeStyle = 'rgba(0,0,0,.45)'; ctx.fillStyle = '#fff';
  const gl = TIERS[tier].glyph + '︎', gy = topY + ry * 0.55;
  ctx.strokeText(gl, sx, gy); ctx.fillText(gl, sx, gy);
  ctx.restore();
  ctx.strokeStyle = K.rim; ctx.lineWidth = Math.max(1.5, R * 0.1);
  ctx.beginPath(); ctx.ellipse(sx, topY, R, ry, 0, 0, Math.PI); ctx.stroke();
  const fy = topY + hgt * 0.62, ex = R * 0.34, er = Math.max(1.4, R * 0.085);
  ctx.fillStyle = '#3a2a2a'; ctx.strokeStyle = '#3a2a2a'; ctx.lineWidth = Math.max(1.2, R * 0.06);
  if (st.happy) { for (const s of [-1, 1]) { ctx.beginPath(); ctx.arc(sx + s * ex, fy, er * 1.5, Math.PI, 0); ctx.stroke(); } }
  else { for (const s of [-1, 1]) { ctx.beginPath(); ctx.arc(sx + s * ex, fy, er, 0, Math.PI * 2); ctx.fill(); } }
  ctx.fillStyle = 'rgba(255,120,150,.45)';
  for (const s of [-1, 1]) { ctx.beginPath(); ctx.ellipse(sx + s * ex * 1.55, fy + er * 2.2, er * 1.6, er, 0, 0, Math.PI * 2); ctx.fill(); }
  ctx.strokeStyle = '#3a2a2a'; ctx.fillStyle = '#3a2a2a';
  if (st.fast) { ctx.beginPath(); ctx.ellipse(sx, fy + er * 3.2, er * 1.1, er * 1.4, 0, 0, Math.PI * 2); ctx.fill(); }
  else { ctx.beginPath(); ctx.arc(sx, fy + er * 1.8, er * 1.5, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke(); }
}
function drawCup(c) {
  const p = project(c.x, c.y);
  const scale = 1 + 0.3 * Math.sin((1 - c.pop) * Math.PI) * (c.pop > 0 ? 1 : 0);
  drawCupAt(p.sx, p.sy, c.r * p.s * scale, c.kind, c.tier, { happy: c.pop > 0, fast: Math.hypot(c.vx, c.vy) > 300, glow: c.held });
}
function drawTable() {
  const a = project(0, 0), b = project(W, 0), c = project(W, H), d = project(0, H);
  const g = ctx.createLinearGradient(0, a.sy, 0, d.sy);
  g.addColorStop(0, '#e7c99a'); g.addColorStop(1, '#f3dcb4');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.moveTo(a.sx, a.sy); ctx.lineTo(b.sx, b.sy); ctx.lineTo(c.sx, c.sy); ctx.lineTo(d.sx, d.sy); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(160,110,60,.12)'; ctx.lineWidth = 1;
  for (let i = 1; i < 12; i++) {
    const y = H * i / 12, l = project(0, y), r = project(W, y);
    ctx.beginPath(); ctx.moveTo(l.sx, l.sy); ctx.lineTo(r.sx, r.sy); ctx.stroke();
  }
  const l1 = project(0, LINE_Y), r1 = project(W, LINE_Y);
  ctx.fillStyle = 'rgba(255,255,255,.28)';
  ctx.beginPath(); ctx.moveTo(l1.sx, l1.sy); ctx.lineTo(r1.sx, r1.sy); ctx.lineTo(c.sx, c.sy); ctx.lineTo(d.sx, d.sy); ctx.closePath(); ctx.fill();
  const danger = game.dangerT > 0 && game.mode.danger === 'lose';
  const pulse = danger ? 0.5 + 0.5 * Math.sin(performance.now() / 90) : 0;
  ctx.setLineDash([10, 8]);
  ctx.strokeStyle = danger ? `rgba(230,40,60,${0.6 + 0.4 * pulse})` : 'rgba(120,80,40,.6)';
  ctx.lineWidth = danger ? 4 : 2.5;
  ctx.beginPath(); ctx.moveTo(l1.sx, l1.sy); ctx.lineTo(r1.sx, r1.sy); ctx.stroke();
  ctx.setLineDash([]);
  if (danger) {
    const frac = Math.min(1, game.dangerT / CONFIG.rules.DANGER_T);
    ctx.fillStyle = 'rgba(230,40,60,.9)';
    ctx.fillRect(l1.sx, l1.sy - 6, (r1.sx - l1.sx) * frac, 6);
  }
  ctx.strokeStyle = '#8a5a34'; ctx.lineWidth = 6; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(d.sx, d.sy); ctx.lineTo(a.sx, a.sy); ctx.lineTo(b.sx, b.sy); ctx.lineTo(c.sx, c.sy); ctx.stroke();
}
function drawAssist() {
  if (!Game.assistOn(game) || !game.drag || !game.held) return;
  const v = Game.launchV(game);
  if (Math.hypot(v.vx, v.vy) < CONFIG.phys.VMIN * 0.6) return;
  const pts = Physics.predictPath(game.held, v);
  ctx.save();
  ctx.setLineDash([2, 8]); ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 4;
  ctx.beginPath();
  pts.forEach((q, i) => { const p = project(q.x, q.y); if (i) ctx.lineTo(p.sx, p.sy); else ctx.moveTo(p.sx, p.sy); });
  ctx.stroke();
  ctx.setLineDash([]);
  const e = pts[pts.length - 1], pe = project(e.x, e.y);
  ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.ellipse(pe.sx, pe.sy, game.held.r * pe.s, game.held.r * pe.s * tilt, 0, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
}

/* ───────── FX（粒子與浮動文字；由遊戲事件觸發）───────── */
let particles = [], popups = [];
function burst(sx, sy, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 80 + Math.random() * 220;
    particles.push({ x: sx, y: sy, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 120, life: 0.5 + Math.random() * 0.4, color, size: 2 + Math.random() * 3 });
  }
}
function popup(text, sx, sy) { popups.push({ text, x: sx, y: sy, life: 1.1 }); }
function handleEvents(events) {
  for (const ev of events) {
    if (ev.type === 'merge') {
      const p = project(ev.x, ev.y);
      burst(p.sx, p.sy, KINDS[ev.kind].rim, 10 + ev.tier * 3);
      popup((ev.combo > 1 ? '連鎖 ×' + ev.combo + '  ' : '') + '+' + ev.gain, p.sx, p.sy - 20);
    } else if (ev.type === 'checkmate') {
      const p = project(ev.x, ev.y);
      burst(p.sx, p.sy, KINDS[ev.kind].body, 36);
      popup('將死！ +' + ev.gain, p.sx, p.sy - 30);
    } else if (ev.type === 'fade') {
      const p = project(ev.x, ev.y); burst(p.sx, p.sy, '#ffffff', 8);
    } else if (ev.type === 'gameover') {
      newBest = game.mode.tracksBest && game.score > (save.best[game.mode.id] || 0);
      if (newBest) { save.best[game.mode.id] = game.score; Storage.save(save); }
      go('gameover');
    }
  }
}
function updateFx(dt) {
  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 500 * dt; p.life -= dt; }
  particles = particles.filter(p => p.life > 0);
  for (const p of popups) { p.y -= 28 * dt; p.life -= dt; }
  popups = popups.filter(p => p.life > 0);
}

function render() {
  ctx.setTransform(L.dpr, 0, 0, L.dpr, 0, 0);
  ctx.clearRect(0, 0, L.cw, L.ch);
  drawTable();
  drawAssist();
  const list = game.world.cups.slice().sort((a, b) => a.y - b.y);
  for (const c of list) drawCup(c);

  ctx.fillStyle = 'rgba(0,0,0,.28)'; rr(10, 6, 96, 46, 12); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = '12px sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText('下一個', 18, 29);
  if (game.next) drawCupAt(80, 40, 16, game.next.kind, game.next.tier, { noShadow: true });

  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 2));
    ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.size, p.size);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = 'bold 18px sans-serif';
  for (const p of popups) {
    ctx.globalAlpha = Math.min(1, p.life * 1.5);
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(60,30,60,.8)'; ctx.strokeText(p.text, p.x, p.y);
    ctx.fillStyle = '#fff'; ctx.fillText(p.text, p.x, p.y);
  }
  ctx.globalAlpha = 1;
  if (game.mode.id === 'practice') {
    ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.font = '12px sans-serif'; ctx.textAlign = 'right';
    ctx.fillText('練習模式（不會輸）', L.cw - 12, 20);
  }
}

/* ───────── Input（只把手指事件轉成 Game 的呼叫）───────── */
canvas.addEventListener('pointerdown', e => {
  if (flow.state !== 'playing') return;
  const w = toWorld(e);
  if (Game.beginDrag(game, w.x, w.y, e.pointerId, e.timeStamp)) { try { canvas.setPointerCapture(e.pointerId); } catch (err) {} }
});
canvas.addEventListener('pointermove', e => {
  if (!game.drag) return;
  const w = toWorld(e);
  Game.dragTo(game, w.x, w.y, e.pointerId, e.timeStamp);
});
const endDrag = e => Game.endDrag(game, e.pointerId);
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

/* ───────── UI（HUD、按鈕、選單 / 暫停 / 結算覆蓋層）───────── */
const flow = Flow.create();
let newBest = false;
const elScore = document.getElementById('score'), elBest = document.getElementById('best');
const bPause = document.getElementById('bPause'), bAssist = document.getElementById('bAssist'), ov = document.getElementById('ov');
function refreshButtons() {
  bAssist.textContent = '輔助線：' + (game.mode.assistForced ? '開（練習）' : game.assist ? '開' : '關');
  bPause.disabled = flow.state !== 'playing';
}
function refreshHud() {
  elScore.textContent = game.score;
  elBest.textContent = game.mode.tracksBest ? Math.max(save.best[game.mode.id] || 0, game.score) : '—';
}
function showScreen() {
  const s = flow.state;
  ov.className = s === 'playing' ? '' : 'on ' + s;
  const b = (act, label, cls, sub) => `<button data-act="${act}" class="${cls || ''}">${label}${sub ? '<small>' + sub + '</small>' : ''}</button>`;
  if (s === 'menu') ov.innerHTML = `<div class="card"><h1>滑杯子</h1><p class="sub">Sliding Cups</p>
    ${b('start:classic', '經典', 'main', '無盡模式，杯子停在線內太久就輸')}
    ${b('start:practice', '練習', '', '不會輸，有輔助線')}
    <button disabled>關卡<small>即將推出</small></button>
    <p class="best">經典最高分 ${save.best.classic || 0}</p></div>`;
  else if (s === 'paused') ov.innerHTML = `<div class="card"><h2>暫停</h2>
    ${b('resume', '繼續', 'main')}${b('restart', '重新開始')}${b('menu', '回選單')}</div>`;
  else if (s === 'result') ov.innerHTML = `<div class="card"><h2>${game.mode.id === 'classic' ? 'Game Over' : '結束'}</h2>
    <p class="big">${game.score}</p><p class="best">${newBest ? '🎉 新紀錄！' : '最高分 ' + (save.best[game.mode.id] || 0)}</p>
    ${b('restart', '再玩一次', 'main')}${b('menu', '回選單')}</div>`;
  else ov.innerHTML = '';
  refreshButtons();
}
function go(ev) { if (Flow.send(flow, ev)) showScreen(); }
function act(a) {
  if (a.startsWith('start:')) { Game.setMode(game, a.slice(6)); go('start'); }
  else if (a === 'restart') { Game.restart(game); go('restart'); }
  else go(a);
}
ov.addEventListener('click', e => { const t = e.target.closest('[data-act]'); if (t) act(t.dataset.act); });
bPause.onclick = () => { if (game.drag) Game.endDrag(game, game.drag.id); go('pause'); };
bAssist.onclick = () => { game.assist = !game.assist; refreshButtons(); };
document.addEventListener('visibilitychange', () => { if (document.hidden && flow.state === 'playing') bPause.onclick(); });

/* ───────── 主迴圈 ───────── */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (flow.state === 'playing') handleEvents(Game.update(game, dt));
  updateFx(dt);
  refreshHud();
  render();
  requestAnimationFrame(frame);
}
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', () => setTimeout(layout, 100));
layout(); showScreen();
requestAnimationFrame(frame);

window.SC = SC; window.__game = game; window.__flow = flow; window.__act = act; window.__project = project;   // 除錯與自動測試用
})();
</script>
</body>
</html>
