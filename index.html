<style>
  html,body{margin:0;height:100%;overscroll-behavior:none;background:#2b2233;overflow:hidden;touch-action:none;

  #app{position:fixed;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column}

<script>
/* Diagnostics: any error shows at the bottom of the screen (tap to close) so it can be screenshotted on an iPhone */
const APP_VERSION = 'v10.6.0';
function reportError(e) {
  try { const el = document.getElementById('err'); el.textContent = '[' + APP_VERSION + '] ' + (e && e.message ? e.message : e) + (e && e.stack ? ' @ ' + String(e.stack).split('\n')[0] : ''); el.style.display = 'block'; } catch (x) {}
}
window.__ext = [];   // sanitized 'Script error.' from the browser / extensions (e.g. the share sheet): no details and not our bug — logged in the debug panel, no red bar
window.addEventListener('error', e => {
  if (!e.error && (!e.filename || e.message === 'Script error.')) { window.__ext.push(String(e.message)); return; }
  reportError(e.error || e.message);
});
window.addEventListener('unhandledrejection', e => reportError(e.reason));
</script>
<script>
/* ════════════════════════════════════════════════════════════════════
   Sliding Cups — single-file architecture
   ┌ CORE (no DOM, testable in Node)
   │   CONFIG   all data and feel parameters
   │   RNG      seeded random numbers
   │   Physics  pure physics: motion, friction, collisions, merges; only emits events
   │   Modes    mode objects with rule hooks (spawning, losing, aim line, items…)
   │   Game     rules + state machine: spawning, curling-style launch, scoring, win/lose
   └ APP (browser)
       Storage / Renderer / FX / Input / UI / main
   ════════════════════════════════════════════════════════════════════ */

/*#core-start*/
const SC = (() => {
'use strict';

/* ───────── CONFIG ───────── */
const CONFIG = {
  world: { W: 600, H: 945, LINE_Y: 720, SPAWN: { x: 300, y: 845 } },   // top-down plane; y=0 far end, y=H near the player
  phys: {
    STEP: 1 / 120,  // fixed time step
    A: 560,         // sliding friction (constant deceleration)
    K: 0.7,         // speed damping
    VMAX: 3600,     // max launch speed
    VMIN: 630,      // slower than this when crossing the line → returns
    GAIN: 0.9,      // finger speed (below KNEE) → cup speed
    KNEE: 700,      // finger speed above this uses GAIN_HI for the excess
    GAIN_HI: 1.7,
    E: 0.6,         // cup–cup restitution
    EW: 0.35,       // wall restitution
    STOP: 8,        // below this speed a cup counts as stopped
    HIST_MS: 100,   // time window for measuring launch speed
  },
  rules: { DANGER_T: 3, SETTLE_T: 0.25, FADE_T: 1.2, RETURN_RATE: 14, GRAB_MARGIN: 40, GRAB_OFFSET_MAX: 120 },
  scoring: { base: 10, checkmate: 2000 },
  // VP: 1 per perScore points; +kingBonus per king made; unlockCost[i] = VP to unlock creature i (in order)
  vp: { perScore: 500, kingBonus: 10, unlockCost: [0, 0, 100, 200, 350, 550, 800] },
  nextTierCum: [0.5, 0.8, 0.95],                 // cumulative spawn-tier odds: pawn 50%, knight 30%, bishop 15%, rook 5%
  // Difficulty ramp (modes with ramp: true). Every `every` points = +1 level, up to maxLevel.
  // At max level: spawn weights shift to `cumMax` and the lose timer shrinks to `dangerMin` seconds.
  ramp: { every: 3000, maxLevel: 5, cumMax: [0.35, 0.68, 0.9], dangerMin: 2.0 },
  // Skill bonuses for the launched cup's first merge (fraction of that merge's gain), plus a flat bonus per extra simultaneous merge.
  bonus: { bank: 0.5, long: 0.3, longDist: 520, double: 150 },
  // Checkmate shockwave: pushes cups within `radius` outward (up to `push` speed); pawns within `shatter` are destroyed.
  shock: { radius: 340, push: 1100, shatter: 170 },
  // Crowding: when a new cup spawns and more than `max` cups are on the table, the oldest pawn disappears.
  crowd: { max: 24 },
  view: { TILT: 0.7, S_FAR: 0.78 },
  // Items: bag holds `slots`; Classic gives a random item every energyCost points; cost = VP to pack one for the next run
  items: {
    slots: 2, energyCost: 1500, sweepDepth: 240, upgradeMax: 3, magnetTime: 1.6, magnetAccel: 2600, magnetVmax: 800,
    defs: [
      { id: 'sweep', cost: 20 }, { id: 'upgrade', cost: 10 }, { id: 'wild', cost: 10 }, { id: 'magnet', cost: 10 }, { id: 'undo', cost: 6 },
    ],
  },
  // Levels: goal = a king of every kind in `kinds`. reward = VP on first clear only (no farming)
  levels: [
    { kinds: [0],       reward: 30,  items: [] },       // items = starting items for this level (no earning in Levels)
    { kinds: [0, 1],    reward: 60,  items: [] },
    { kinds: [0, 1, 2], reward: 100, items: [] },
  ],
  // massK mass factor, fric friction factor, bounce restitution factor: bigger cups are heavier, stop sooner, bounce less
  tiers: [
    { r: 22, glyph: '♟', massK: 1.0, fric: 1.00, bounce: 1.00 },
    { r: 28, glyph: '♞', massK: 1.1, fric: 1.08, bounce: 0.95 },
    { r: 36, glyph: '♝', massK: 1.2, fric: 1.16, bounce: 0.90 },
    { r: 46, glyph: '♜', massK: 1.3, fric: 1.24, bounce: 0.85 },
    { r: 58, glyph: '♛', massK: 1.4, fric: 1.32, bounce: 0.80 },
    { r: 72, glyph: '♚', massK: 1.5, fric: 1.40, bounce: 0.75 },
  ],
  kinds: [
    { id: 'dragon',      body: '#ff7a59', dark: '#c9482a', rim: '#ffc9b8' },
    { id: 'unicorn',     body: '#b98cff', dark: '#7d4fd1', rim: '#e6d6ff' },
    { id: 'hydra',       body: '#5fd08a', dark: '#2f9a58', rim: '#c9f2d8' },
    { id: 'phoenix',     body: '#ffc23d', dark: '#d18f00', rim: '#ffe7a8' },
    { id: 'basilisk',    body: '#3cc7c2', dark: '#1d8f8b', rim: '#bff0ee' },
    { id: 'griffin',     body: '#c58a5a', dark: '#8a5832', rim: '#ecd0b6' },
    { id: 'aqrabuamelu', body: '#e8b86a', dark: '#b27d2c', rim: '#f8e3bd' },
  ],
};
const TOP = CONFIG.tiers.length - 1;

/* ───────── RNG (mulberry32, seeded → replays, daily challenge, tests)───────── */
function makeRng(seed) {
  let a = seed >>> 0;
  const f = function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  f.get = () => a; f.set = (v) => { a = v >>> 0; };   // state access (used by Undo)
  return f;
}

/* ───────── PHYSICS (pure functions; only touches the world, knows nothing about score or rules)───────── */
const Physics = (() => {
  const P = CONFIG.phys, Wd = CONFIG.world;
  function createWorld() { return { cups: [], events: [], nextId: 0, acc: 0 }; }
  function makeCup(world, kind, tier, x, y) {
    const T = CONFIG.tiers[tier], r = T.r;
    return { id: ++world.nextId, kind, tier, x, y, vx: 0, vy: 0, r, m: r * r * T.massK,
             fric: T.fric, bounce: T.bounce, held: false, pop: 0, dead: false };
  }
  const wallHit = (world, c, v) => { if (v > 60) world.events.push({ type: 'wall', v, x: c.x, y: c.y, id: c.id }); };
  function integrate(world, dt) {
    const W = Wd.W, H = Wd.H;
    for (const c of world.cups) {
      if (c.held || c.dead) continue;
      const sp = Math.hypot(c.vx, c.vy);
      if (sp > 0) {
        const sp2 = Math.max(0, sp - (P.A + P.K * sp) * c.fric * dt);
        if (sp2 < P.STOP) { c.vx = c.vy = 0; }
        else { const f = sp2 / sp; c.vx *= f; c.vy *= f; }
      }
      c.x += c.vx * dt; c.y += c.vy * dt;
      if (c.x < c.r)     { c.x = c.r;     if (c.vx < 0) { wallHit(world, c, -c.vx); c.vx = -c.vx * P.EW * c.bounce; } }
      if (c.x > W - c.r) { c.x = W - c.r; if (c.vx > 0) { wallHit(world, c, c.vx); c.vx = -c.vx * P.EW * c.bounce; } }
      if (c.y < c.r)     { c.y = c.r;     if (c.vy < 0) { wallHit(world, c, -c.vy); c.vy = -c.vy * P.EW * c.bounce; } }
      if (c.y > H - c.r) { c.y = H - c.r; if (c.vy > 0) { wallHit(world, c, c.vy); c.vy = -c.vy * P.EW * c.bounce; } }
    }
  }
  function merge(world, a, b) {
    a.dead = b.dead = true;
    const x = (a.x * a.m + b.x * b.m) / (a.m + b.m);
    const y = (a.y * a.m + b.y * b.m) / (a.m + b.m);
    const kind = a.wild && !b.wild ? b.kind : a.kind;       // a wild cup becomes the other cup's creature
    if (a.tier === TOP) { world.events.push({ type: 'checkmate', kind, x, y, a: a.id, b: b.id }); return; }
    const nc = makeCup(world, kind, a.tier + 1, x, y);
    nc.vx = (a.vx * a.m + b.vx * b.m) / (a.m + b.m);
    nc.vy = (a.vy * a.m + b.vy * b.m) / (a.m + b.m);
    nc.pop = 1;
    world.cups.push(nc);
    world.events.push({ type: 'merge', kind, tier: nc.tier, x, y, a: a.id, b: b.id, id: nc.id });
  }
  function collide(world) {
    const cups = world.cups;
    for (let i = 0; i < cups.length; i++) {
      const a = cups[i];
      if (a.dead || a.held) continue;
      for (let j = i + 1; j < cups.length; j++) {
        const b = cups[j];
        if (b.dead || b.held) continue;
        const dx = b.x - a.x, dy = b.y - a.y, rr = a.r + b.r;
        const d2 = dx * dx + dy * dy;
        if (d2 >= rr * rr) continue;
        if (a.tier === b.tier && (a.kind === b.kind || a.wild || b.wild)) { merge(world, a, b); break; }
        const d = Math.sqrt(d2) || 0.0001;
        const nx = dx / d, ny = dy / d;
        const ia = 1 / a.m, ib = 1 / b.m;
        const corr = (rr - d) / (ia + ib) * 0.8;
        a.x -= nx * corr * ia; a.y -= ny * corr * ia;
        b.x += nx * corr * ib; b.y += ny * corr * ib;
        const rvn = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
        if (rvn < 0) {
          if (-rvn > 40) world.events.push({ type: 'hit', v: -rvn, tier: Math.max(a.tier, b.tier), ta: a.tier, tb: b.tier, a: a.id, b: b.id, x: a.x + nx * a.r, y: a.y + ny * a.r });
          const e = P.E * (a.bounce + b.bounce) / 2;
          const j2 = -(1 + e) * rvn / (ia + ib);
          a.vx -= j2 * nx * ia; a.vy -= j2 * ny * ia;
          b.vx += j2 * nx * ib; b.vy += j2 * ny * ib;
        }
      }
    }
  }
  function substep(world, dt) { integrate(world, dt); collide(world); }
  // advance in fixed steps; remove dead cups before returning
  function advance(world, dt) {
    world.acc += dt;
    while (world.acc >= P.STEP) { substep(world, P.STEP); world.acc -= P.STEP; }
    world.cups = world.cups.filter(c => !c.dead);
  }
  const isMoving = (world) => world.cups.some(c => !c.held && (c.vx || c.vy));
  const isSettled = (c) => !c.held && !c.vx && !c.vy;
  // predicted path (friction and walls only, ignores other cups)
  function predictPath(c, v) {
    const W = Wd.W, H = Wd.H, pts = [], pos = { x: c.x, y: c.y }, vel = { x: v.vx, y: v.vy }, dt = 1 / 60;
    for (let i = 0; i < 480; i++) {
      const sp = Math.hypot(vel.x, vel.y);
      const sp2 = Math.max(0, sp - (P.A + P.K * sp) * c.fric * dt);
      if (sp2 < P.STOP) break;
      const f = sp2 / sp; vel.x *= f; vel.y *= f;
      pos.x += vel.x * dt; pos.y += vel.y * dt;
      if (pos.x < c.r)     { pos.x = c.r;     vel.x = Math.abs(vel.x) * P.EW * c.bounce; }
      if (pos.x > W - c.r) { pos.x = W - c.r; vel.x = -Math.abs(vel.x) * P.EW * c.bounce; }
      if (pos.y < c.r)     { pos.y = c.r;     vel.y = Math.abs(vel.y) * P.EW * c.bounce; }
      if (pos.y > H - c.r) { pos.y = H - c.r; vel.y = -Math.abs(vel.y) * P.EW * c.bounce; }
      if (i % 3 === 0) pts.push({ x: pos.x, y: pos.y });
    }
    pts.push({ x: pos.x, y: pos.y });
    return pts;
  }
  return { createWorld, makeCup, advance, substep, isMoving, isSettled, predictPath };
})();

/* ───────── MODES (mode objects: rule hooks such as what spawns and how you lose)───────── */
const Modes = {
  classic: {
    id: 'classic',
    danger: 'lose',            // a cup resting inside the line too long → lose
    assistForced: false,
    tracksBest: true,
    givesVP: true,
    hud: 'best',               // top-right HUD: 'best' best score | 'level' level number
    items: 'earn',             // items: 'earn' charged by scoring | 'fixed' set per level | 'free' unlimited | 'none'
    banner: null,              // on-screen mode label (i18n key)
    goalKinds: null,           // goal: creatures that need a king (null = no goal)
    ramp: true,                // difficulty rises with score (see CONFIG.ramp)
    pickNext(g) {              // same roll order as the prototype: tier first, then creature
      const t = g.rng(), cum = Game.spawnCum(g);
      let tier = cum.length; for (let i = 0; i < cum.length; i++) if (t < cum[i]) { tier = i; break; }
      return { kind: g.kinds[Math.floor(g.rng() * g.kinds.length)], tier };
    },
  },
  level: {
    id: 'level',
    danger: 'lose',
    assistForced: false,
    tracksBest: false,
    givesVP: false,            // Levels only pay the first-clear reward (Profile.clearLevel)
    hud: 'level',
    items: 'fixed',
    banner: null,
    goalKinds(g) { return CONFIG.levels[g.level].kinds; },
    pickNext(g) { return Modes.classic.pickNext(g); },
  },
  practice: {
    id: 'practice',
    danger: 'fade',            // cups resting inside the line fade away; no losing
    assistForced: true,
    tracksBest: false,
    givesVP: false,
    hud: 'best',
    items: 'free',
    banner: 'fx.practice',
    goalKinds: null,
    pickNext(g) { return Modes.classic.pickNext(g); },
  },
};

/* ───────── GAME (rules and state machine; no DOM)───────── */
const Game = (() => {
  const P = CONFIG.phys, R = CONFIG.rules, Wd = CONFIG.world;

  function create(opts) {
    opts = opts || {};
    const seed = opts.seed != null ? opts.seed >>> 0 : (Math.random() * 4294967296) >>> 0;
    const g = {
      seed, rng: makeRng(seed), kinds: [], nKinds: 1, kings: 0, kingKinds: [], level: null,
      mode: Modes[opts.mode || 'classic'], world: Physics.createWorld(),
      phase: 'ready',           // ready (waiting to launch) | flying (cups sliding) | over | won
      score: 0, shotMerges: 0, dangerT: 0, settleT: 0,
      held: null, next: null, drag: null, assist: false, banked: false, startItems: [], runs: 0,
    };
    setKinds(g, opts.kinds || Array.from({ length: Math.max(1, Math.min(CONFIG.kinds.length, opts.nKinds || 1)) }, (_, i) => i));
    restart(g);
    return g;
  }
  function restart(g, seed) {
    if (seed != null) { g.seed = seed >>> 0; g.rng = makeRng(g.seed); }
    g.world = Physics.createWorld();
    g.shot = null; g.rampLv = 0; g.held = null; g.drag = null; g.score = 0; g.kings = 0; g.kingKinds = []; g.banked = false; g.shotMerges = 0; g.dangerT = 0; g.settleT = 0;
    const im = g.mode.items;                                       // item state (own RNG, so spawn order is unaffected)
    g.items = (im === 'fixed' ? (CONFIG.levels[g.level].items || []) : im === 'earn' ? g.startItems : []).slice(0, CONFIG.items.slots);
    g.startItems = []; g.energy = 0; g.itemsUsed = 0; g.snap = null; g.magnetT = 0;
    g.itemRng = makeRng((g.seed ^ 0x9E3779B9 ^ Math.imul(++g.runs, 0x85EBCA6B)) >>> 0);
    g.next = g.mode.pickNext(g);
    spawn(g);
  }
  function spawn(g, out) {
    const onTable = g.world.cups.filter(c => !c.held && !c.dead);
    if (onTable.length > CONFIG.crowd.max) {                       // crowding: the oldest pawn disappears

/* ───────── Sfx (Web Audio synthesis, no audio files; iOS needs a first tap before sound)───────── */
const Sfx = (() => {
  let ac = null, master = null, noiseBuf = null;
  const lastAt = {}, stats = {};
  const enabled = () => save.sound !== false;
  function unlock() {
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}   // iOS: play even with the mute switch on
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      ac = new AC(); master = ac.createGain(); master.gain.value = 0.55;
      const comp = ac.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 6; comp.attack.value = 0.003; comp.release.value = 0.15;
      master.connect(comp); comp.connect(ac.destination);       // compressor: many simultaneous hits don't clip

      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;

  }

    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t0 + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + dur + 0.02);
  }
  function noise(dur, vol, f0, f1, delay) {
    const t0 = ac.currentTime + (delay || 0), src = ac.createBufferSource(), flt = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = noiseBuf; flt.type = 'bandpass'; flt.Q.value = 1.2;
    flt.frequency.setValueAtTime(f0, t0); flt.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(flt); flt.connect(g); g.connect(master); src.start(t0); src.stop(t0 + dur + 0.02);
  }
  // stone impact: a low 'thunk' body (fast decay, no long ringing highs — that's glass/metal)
  // + a burst of low-passed noise for grit + a tiny click. Bigger size (bigger cup) = lower, duller, longer.
  function stone(f, vol, size, delay) {
    const d = delay || 0, len = 0.07 + size * 0.025, det = 1 + (Math.random() - 0.5) * 0.08;
    tone(f * det * 1.25, f * det * 0.6, len, 'sine', vol, d);                 // body: dull thud with a fast pitch drop
    tone(f * det * 2.1, f * det * 1.3, len * 0.55, 'triangle', vol * 0.4, d); // overtone: decays quickly, makes it feel solid
    noise(0.045 + size * 0.01, vol * 0.7, 1300, 450, d);                      // grit: low-mid noise
    noise(0.01, vol * 0.18, 3200, 2200, d);                                   // surface click (very quiet)
  }
  const note = (semi) => 523.25 * Math.pow(2, semi / 12);            // based on C5
  const SCALE = [0, 2, 4, 7, 9, 12];                                  // pentatonic: higher from pawn to king
  const sounds = {
    hit(ev) {                                                       // stone on stone: one sound per cup (bigger = deeper), volume by impact speed
      const k = Math.min(1, ev.v / 1400), vol = 0.5 * (0.3 + 0.7 * k);
      stone(210 * Math.pow(0.84, ev.ta), vol, ev.ta);
      stone(210 * Math.pow(0.84, ev.tb) * 0.97, vol, ev.tb, 0.003);
      tone(70, 40, 0.12, 'sine', 0.45 * k);                                   // heavy low-frequency hit
    },
    wall(v) { const k = Math.min(1, v / 1500); stone(130, 0.4 * (0.35 + 0.65 * k), 3); tone(60, 38, 0.1, 'sine', 0.35 * k); },
    launch(v) { noise(0.28, 0.12 + Math.min(1, v / 3000) * 0.3, 500, 1800); },
    merge(tier, combo) {
      const f = note(SCALE[Math.min(tier, 5)] + Math.min(combo - 1, 5) * 2);
      tone(f, f, 0.28, 'triangle', 0.32); tone(f * 1.5, f * 1.5, 0.22, 'sine', 0.16, 0.06);
      stone(150 * Math.pow(0.86, tier), 0.4, tier);                                                          // stone thunk at the moment of merging
    },
    checkmate() { stone(90, 0.7, 5); stone(120, 0.5, 5, 0.04); [0, 4, 7, 12, 16].forEach((n, i) => tone(note(n), note(n), 0.3, 'triangle', 0.3, i * 0.09)); },
    spawn() { tone(500, 720, 0.06, 'sine', 0.1); },
    fade() { tone(420, 200, 0.12, 'sine', 0.08); },
    gameover() { [392, 330, 262].forEach((f, i) => tone(f, f * 0.97, 0.35, 'triangle', 0.25, i * 0.18)); },
    levelclear() { [-5, 0, 4, 7, 12].forEach((n, i) => tone(note(n), note(n), 0.32, 'triangle', 0.3, i * 0.1)); },
    click() { tone(900, 700, 0.03, 'square', 0.05); },
    bonus() { [7, 12].forEach((n, i) => tone(note(n + 12), note(n + 12), 0.16, 'triangle', 0.22, i * 0.06)); },
    rampup() { [0, 6].forEach((n, i) => tone(note(n - 5), note(n - 5), 0.3, 'sawtooth', 0.12, i * 0.16)); },
    shockwave() { stone(60, 0.8, 5); tone(55, 30, 0.6, 'sine', 0.5); noise(0.6, 0.3, 900, 120); },
    shatter() { noise(0.12, 0.2, 2600, 900); },
    itemget() { [0, 7, 12].forEach((n, i) => tone(note(n + 12), note(n + 12), 0.22, 'sine', 0.2, i * 0.07)); },
    sweep() {                                                  // inferno: low roar + crackles
      noise(1.0, 0.34, 650, 110); noise(0.55, 0.22, 2300, 380, 0.05); tone(70, 42, 0.7, 'sine', 0.32);
      for (let i = 0; i < 7; i++) noise(0.035, 0.18, 3200, 1500, 0.12 + i * 0.085 + Math.random() * 0.04);
    },
    upgrade() { tone(300, 900, 0.28, 'triangle', 0.26); tone(450, 1350, 0.26, 'sine', 0.13, 0.05); },
    wild() { [0, 4, 7, 11, 14, 19].forEach((n, i) => tone(note(n + 12), note(n + 12), 0.16, 'sine', 0.13, i * 0.05)); },
    magnet() { tone(90, 300, 0.7, 'sawtooth', 0.1); tone(180, 560, 0.7, 'sine', 0.13); },
    undo() { tone(720, 160, 0.32, 'triangle', 0.22); noise(0.26, 0.14, 1900, 280); },
  };
  const gaps = { hit: 0.04, wall: 0.06, spawn: 0, fade: 0.05 };
  function play(name, a, b) {
    if (!ac || !enabled()) return;
    const now = ac.currentTime, gap = gaps[name] || 0;

    switch (ev.type) {
      case 'hit': play('hit', ev); break;
      case 'wall': play('wall', ev.v); break;
      case 'merge': play('merge', ev.tier, ev.combo); break;
      case 'checkmate': play('checkmate'); break;
      case 'spawn': play('spawn'); break;
      case 'fade': play('fade'); break;
      case 'gameover': play('gameover'); break;
      case 'levelclear': play('levelclear'); break;
      case 'item': play(ev.id); break;
      case 'itemget': play('itemget'); break;
      case 'bonus': play('bonus'); break;
      case 'rampup': play('rampup'); break;
      case 'shockwave': play('shockwave'); break;
      case 'shatter': case 'crowd': play('shatter'); break;
    }
  }
  return { unlock, suspend, play, event, stats };
})();

/* ───────── Renderer (2.5D view from above at an angle)───────── */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let L = { cw: 0, ch: 0, dpr: 1, cx: 0, top: 0, f: 1, k: 1, ok: false };
let tilt = TILT;
function layout() {
  const r = canvas.getBoundingClientRect();
  if (!(r.width >= 50 && r.height >= 50)) { L.ok = false; return; }   // size not ready (can be 0 when launched from the iOS home screen) → skip until ResizeObserver fires
  L.ok = true;
  L.cw = r.width; L.ch = r.height; L.dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(L.cw * L.dpr);
  canvas.height = Math.round(L.ch * L.dpr);

  const pad = 8, ART_TOP = 174, R6 = TIERS[TIERS.length - 1].r, sAvg = (S_FAR + 1) / 2, sTop = S_FAR + (1 - S_FAR) * (R6 / H);
  let f, k, headroom = 58;
  for (let i = 0; i < 4; i++) {                       // headroom depends on scale and scale on headroom → iterate a few times to converge
    f = (L.cw - pad * 2) / W;
    const avail = L.ch - pad - headroom;
    tilt = Math.max(0.7, Math.min(0.88, avail / (f * sAvg * H)));
    k = tilt * f * sAvg;
    if (k * H > avail) { k = avail / H; f = k / (tilt * sAvg); }
    headroom = Math.max(58, ART_TOP * f * sTop - R6 * k + 6);

  const s = S_FAR + (1 - S_FAR) * (y / H);

}

  const r = canvas.getBoundingClientRect();

  const y = (sy - L.top) / L.k;
  const s = S_FAR + (1 - S_FAR) * (y / H);

}

/* ───────── Sprites (art/<kind>/<kind>_t<tier>.png, spec in ASSET_SPEC.md; falls back to procedural drawing)───────── */
const Sprites = (() => {

  for (const f of Fx.flames) {                                    // flames: yellow → orange → red from the centre, transparent edge
    const k = f.life / f.max, r = f.r * (0.4 + 0.6 * k), gr = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, r);
    gr.addColorStop(0, 'rgba(255,244,170,' + (0.95 * k).toFixed(3) + ')'); gr.addColorStop(0.45, 'rgba(255,150,40,' + (0.8 * k).toFixed(3) + ')'); gr.addColorStop(1, 'rgba(200,40,10,0)');
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(f.x, f.y, r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.lineCap = 'round';
  for (const p of Fx.sparks) {                                   // sparks
    ctx.strokeStyle = 'rgba(236,222,196,' + Math.min(1, p.life * 4).toFixed(3) + ')'; ctx.lineWidth = p.w;
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 0.05, p.y - p.vy * 0.05); ctx.stroke();
  }
  ctx.restore();

  drawNextBox(); drawParticlesAndPopups(); drawModeInfo();
}

// top-layer info (not affected by screen shake)
function drawNextBox() {
  ctx.fillStyle = 'rgba(0,0,0,.28)'; rr(10, 6, 96, 46, 12); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = '12px sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(t('fx.next'), 18, 29);
  if (game.next) drawPiece(80, 40, 16, game.next.kind, game.next.tier, { noShadow: true });
  const lv = Game.rampLevel(game);                              // difficulty level (classic)
  if (lv > 0) { ctx.fillStyle = 'rgba(255,200,120,.95)'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'left'; ctx.fillText(t('fx.lv', { n: lv }), 14, 66); }
}
function drawParticlesAndPopups() {
  for (const p of Fx.particles) {
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 2));
    ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.size, p.size);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = 'bold 18px sans-serif';
  for (const p of Fx.popups) {
    ctx.globalAlpha = Math.min(1, p.life * 1.5);
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(60,30,60,.8)'; ctx.strokeText(p.text, p.x, p.y);
    ctx.fillStyle = '#fff'; ctx.fillText(p.text, p.x, p.y);
  }
  ctx.globalAlpha = 1;
}
function drawModeInfo() {                                    // mode label + level goal
  if (game.mode.banner) {
    ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.font = '12px sans-serif'; ctx.textAlign = 'right';
    ctx.fillText(t(game.mode.banner), L.cw - 12, 20);
  }
  if (game.mode.goalKinds) {                                    // level goal: a king per creature, lit when done
    const ks = game.mode.goalKinds(game);
    ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.font = '12px sans-serif'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.fillText(t('fx.goal'), L.cw - 12, 14);
    ks.forEach((k, i) => {
      const x = L.cw - 28 - i * 38, done = game.kingKinds.includes(k);
      ctx.globalAlpha = done ? 1 : 0.35; drawPiece(x, 52, 13, k, TIERS.length - 1, { noShadow: true }); ctx.globalAlpha = 1;
      if (done) { ctx.fillStyle = '#fff'; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('✔', x, 66); }
    });
  }
}

/* ───────── Input (only turns pointer events into Game calls)───────── */
canvas.addEventListener('pointerdown', e => {
  if (flow.state !== 'playing') return;
  const w = toWorld(e);
  const began = Game.beginDrag(game, w.x, w.y, e.pointerId, e.timeStamp);
  dbg.ptr = Math.round(e.clientX) + ',' + Math.round(e.clientY) + ' → world ' + Math.round(w.x) + ',' + Math.round(w.y); dbg.begin = began;
  if (began) { try { canvas.setPointerCapture(e.pointerId); } catch (err) {} }
});
canvas.addEventListener('pointermove', e => {
  if (!game.drag) return;
  const w = toWorld(e);
  if (Game.dragTo(game, w.x, w.y, e.pointerId, e.timeStamp) === 'launched') {
    const c = game.world.cups.reduce((a, b) => (a.id > b.id ? a : b));   // the cup just launched
    Sfx.play('launch', Math.hypot(c.vx, c.vy));
  }
});
const endDrag = e => Game.endDrag(game, e.pointerId);
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

/* ───────── UI (HUD, buttons, menu / pause / result overlays)───────── */
const flow = Flow.create();
let newBest = false, lastReward = 0, lastGet = null, itemSig = '';
const ICON = { sweep: '🔥', upgrade: '⬆️', wild: '🌈', magnet: '🧲', undo: '⏪' };
function bankVP() { Profile.bankRun(save, game); Storage.save(save); }   // bank VP when quitting / restarting mid-run (once per run, guarded by game.banked)
const $ = (id) => document.getElementById(id);
const elScore = $('score'), elBest = $('best'), lblScore = $('lblScore'), lblBest = $('lblBest');
const bPause = $('bPause'), bAssist = $('bAssist'), bSound = $('bSound'), ov = $('ov');
function refreshButtons() {
  document.documentElement.lang = save.lang === 'zh' ? 'zh-Hant' : 'en';
  bAssist.textContent = t('aim', { v: game.mode.assistForced ? t('onPractice') : game.assist ? t('on') : t('off') });
  bSound.textContent = t('sound', { v: save.sound !== false ? t('on') : t('off') });
  bPause.textContent = t('pause');
  bPause.disabled = flow.state !== 'playing';
  lblScore.textContent = t('score');
  lblBest.textContent = game.mode.hud === 'level' ? t('level') : t('best');
}
const elItems = $('items');
function refreshItems() {
  const mode = game.mode.items, slots = Game.itemSlots(game);
  const show = flow.state === 'playing' && (mode === 'earn' || mode === 'free' || (mode === 'fixed' && slots.length > 0));
  const pct = mode === 'earn' ? Math.min(100, Math.floor(game.energy / CONFIG.items.energyCost * 100)) : 0;
  const sig = [show, mode, slots.join(), slots.map(id => (Game.canUse(game, id) ? 1 : 0)).join(''), pct, save.lang, lastGet].join('|');
  if (sig === itemSig) return; itemSig = sig;
  elItems.className = show ? 'on' : '';
  if (!show) { elItems.innerHTML = ''; return; }
  const cells = mode === 'earn' ? Array.from({ length: CONFIG.items.slots }, (_, i) => slots[i] || null) : slots;
  elItems.innerHTML = (mode === 'earn' ? `<div class="em${pct >= 100 ? ' full' : ''}"><i style="width:${pct}%"></i></div>` : '') +
    cells.map(id => (id ? `<button class="it${id === lastGet ? ' new' : ''}" data-item="${id}" ${Game.canUse(game, id) ? '' : 'disabled'}>${ICON[id]}<small>${t('item.' + id)}</small></button>` : '<span class="slot"></span>')).join('');
}
elItems.addEventListener('pointerdown', e => {                // pointerdown: redrawing the item bar never swallows a tap
  const el = e.target.closest('[data-item]'); if (!el || el.disabled || flow.state !== 'playing') return;
  const ev = Game.useItem(game, el.dataset.item); if (ev) handleEvents(ev);
  itemSig = ''; refreshItems();
});
function refreshHud() {
  elScore.textContent = game.score;
  elBest.textContent = game.mode.hud === 'level' ? game.level + 1
    : game.mode.tracksBest ? Math.max(save.best[Profile.bestKey(game)] || 0, game.score) : '—';
  if (game.mode.hud !== 'level') lblBest.textContent = game.itemsUsed > 0 && game.mode.tracksBest ? t('best.items') : t('best');
}
const dot = (i) => `<i style="background:${KINDS[i].body}"></i>`;
const btn = (act, label, cls, sub) => `<button data-act="${act}" class="${cls || ''}">${label}${sub ? '<small>' + sub + '</small>' : ''}</button>`;
const SCREENS = {                                                  // one function per screen returning HTML; new screen = entry here + Flow transition
  menu() {
    return `<div class="card"><h1>${t('title')}</h1><p class="sub">${t('subtitle')}</p>
    ${btn('start:classic', t('mode.classic'), 'main', t('mode.classic.desc'))}
    ${btn('start:practice', t('mode.practice'), '', t('mode.practice.desc'))}
    ${btn('levels', t('mode.level'), '', t('mode.level.desc'))}
    ${btn('kinds', t('creatures', { n: save.active.length }), '', t('vp', { n: save.vp }))}
    ${btn('items', t('items.title'), '', save.carry ? t('items.menu.packed', { name: t('item.' + save.carry) }) : t('items.menu.sub'))}
    ${btn('backup', t('backup.title'), '', t('backup.menu.sub'))}
    <p class="best">${t('bestClassic', { n: save.best.classic || 0 })}${save.best.classicItems ? '　·　' + t('bestItems', { n: save.best.classicItems }) : ''}</p>
    ${btn('lang', t('language') + ': ' + (save.lang === 'zh' ? '繁體中文' : 'English'), 'lang')}</div>`;
  },
  backup() {
    const code = Profile.exportCode(save), p = bk.pending;
    const msg = bk.msg ? `<p class="note ${bk.msgCls || ''}">${bk.msg}</p>` : '';
    const found = p ? `<p class="note okmsg">${t('backup.found', { vp: p.vp, best: p.best.classic || 0, n: p.unlocked.length, lv: p.cleared.length })}</p><p class="note warn">${t('backup.applywarn')}</p>${btn('backup:apply', t('backup.apply'), 'main')}` : '';
    return `<div class="card"><h2>${t('backup.title')}</h2><p class="note">${t('backup.how')}</p>
    <textarea id="bkOut" readonly>${code}</textarea>
    ${btn('backup:copy', t('backup.copy'), 'main')}${navigator.share ? btn('backup:share', t('backup.share')) : ''}
    <h2>${t('backup.restore')}</h2>
    <textarea id="bkIn" placeholder="${t('backup.paste')}">${escapeHtml(bk.input)}</textarea>
    ${btn('backup:check', t('backup.check'))}${msg}${found}
    ${btn('menu', t('back'))}</div>`;
  },
  kinds() {
    const nextIdx = Profile.nextLockedKind(save);
    const rows = KINDS.map((K, i) => {
      const name = `<span>${dot(i)}${kindName(i)}</span>`, cost = CONFIG.vp.unlockCost[i];
      if (save.unlocked.includes(i)) { const on = save.active.includes(i); return `<button data-act="kind:${i}" class="row ${on ? 'on' : ''}">${name}<small>${on ? t('kinds.active') : t('kinds.add')}</small></button>`; }
      if (i === nextIdx) return `<button data-act="buy:${i}" class="row" ${save.vp < cost ? 'disabled' : ''}>${name}<small>${t('kinds.buy', { n: cost })}${save.vp < cost ? t('kinds.short', { n: cost - save.vp }) : ''}</small></button>`;
      return `<button class="row" disabled>${name}<small>${t('kinds.locked', { n: cost })}</small></button>`;
    }).join('');
    return `<div class="card"><h2>${t('kinds.title')}</h2><p class="best">${t('kinds.sub', { n: save.vp })}</p>${rows}${btn('menu', t('back'), 'main')}</div>`;
  },
  items() {
    const carried = save.carry ? CONFIG.items.defs.find(d => d.id === save.carry).cost : 0;
    const rows = CONFIG.items.defs.map(d => {
      const on = save.carry === d.id, can = on || save.vp + carried >= d.cost;
      return `<button data-act="carry:${d.id}" class="row ${on ? 'on' : ''}" ${can ? '' : 'disabled'}><span>${ICON[d.id]} ${t('item.' + d.id)}</span><small>${t('item.' + d.id + '.desc')}<br>${on ? t('items.packed') : t('items.pack', { n: d.cost })}</small></button>`;
    }).join('');
    return `<div class="card"><h2>${t('items.title')}</h2><p class="best">${t('items.how', { n: CONFIG.items.energyCost, s: CONFIG.items.slots })}<br>${t('items.vp', { n: save.vp })}</p>${rows}${btn('menu', t('back'), 'main')}</div>`;
  },
  levels() {
    const rows = CONFIG.levels.map((lv, i) => {
      const cleared = save.cleared.includes(i), open = Profile.levelOpen(save, i);
      const names = lv.kinds.map(k => dot(k) + kindName(k)).join('  ');
      const sub = open ? t('level.goal', { names }) + '<br>' + (cleared ? t('level.cleared') : t('level.reward', { n: lv.reward })) : t('level.locked');
      return `<button data-act="level:${i}" class="row ${open && !cleared ? 'on' : ''}" ${open ? '' : 'disabled'}><span>${cleared ? '✔ ' : ''}${t('level.n', { n: i + 1 })}</span><small>${sub}</small></button>`;
    }).join('');
    return `<div class="card"><h2>${t('levels.title')}</h2>${rows}${btn('menu', t('back'), 'main')}</div>`;
  },
  paused() {
    return `<div class="card"><h2>${t('paused')}</h2>
    ${btn('resume', t('resume'), 'main')}${btn('restart', t('restart'))}${btn('menu', t('menu'))}</div>`;
  },
  result() {
    const won = game.phase === 'won', v = Game.vp(game);
    let extra = '';
    if (won) extra = lastReward ? `<p class="best">${t('level.firstClear', { n: lastReward })}　${t('vpTotal', { n: save.vp })}</p>` : '';
    else if (game.mode.tracksBest) extra = `<p class="best">${newBest ? t('newBest') : t('bestIs', { n: save.best[Profile.bestKey(game)] || 0 })}</p>${game.itemsUsed ? `<p class="best">${t('result.items')}</p>` : ''}`;
    if (v.total) extra += `<p class="best">${t('vpGain', { n: v.total, a: v.fromScore, k: v.fromKings ? t('vpKings', { n: v.fromKings }) : '' })}　${t('vpTotal', { n: save.vp })}</p>`;
    const hasNext = won && game.level + 1 < CONFIG.levels.length;
    return `<div class="card"><h2>${won ? t('level.clear') : t('gameOver')}</h2><p class="big">${game.score}</p>${extra}
      ${hasNext ? btn('next', t('level.next'), 'main') : ''}
      ${btn('restart', won ? t('level.replay') : t('retry'), hasNext ? '' : 'main')}${btn('menu', t('menu'))}</div>`;
  },
};
function showScreen() {
  const s = flow.state;
  ov.className = s === 'playing' ? '' : 'on ' + s;
  ov.innerHTML = SCREENS[s] ? SCREENS[s]() : '';
  refreshButtons();
}
function go(ev) { if (!Flow.send(flow, ev)) return; if (ev === 'start' || ev === 'restart') Fx.reset(); showScreen(); }   // clear leftover effects on a new run
function carryIn() { const id = Profile.takeCarry(save); game.startItems = id ? [id] : []; Storage.save(save); }   // packed item: consumed by this run
/* ── Backup screen state (code to restore is validated first, then applied on a second tap) ── */
const bk = { input: '', pending: null, msg: '', msgCls: '' };
const escapeHtml = (v) => String(v).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
ov.addEventListener('input', e => { if (e.target.id === 'bkIn') { bk.input = e.target.value; bk.pending = null; } });
function backupAct(cmd) {
  const say = (msg, cls) => { bk.msg = msg; bk.msgCls = cls || ''; showScreen(); };
  const code = Profile.exportCode(save);
  if (cmd === 'copy') {
    const fallback = () => { const el = document.getElementById('bkOut'); el.focus(); el.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (e) {} say(t(ok ? 'backup.copied' : 'backup.copyfail'), ok ? 'okmsg' : 'warn'); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(() => say(t('backup.copied'), 'okmsg'), fallback); else fallback();
  } else if (cmd === 'share') {
    navigator.share({ title: 'Sliding Cups backup', text: code }).catch(() => {});
  } else if (cmd === 'check') {
    const r = Profile.importCode(bk.input);
    bk.pending = r.ok ? r.profile : null;
    say(r.ok ? '' : t('backup.err.' + r.error), 'warn');
  } else if (cmd === 'apply' && bk.pending) {
    for (const k of Object.keys(save)) delete save[k];
    Object.assign(save, bk.pending); Storage.save(save);
    bk.pending = null; bk.input = '';
    Game.setKinds(game, activeKinds()); refreshButtons();
    say(t('backup.done'), 'okmsg');
  }
}
function act(a) {
  Sprites.preload(a.startsWith('level:') ? CONFIG.levels[+a.slice(6)].kinds : activeKinds());
  if (a.startsWith('start:')) { Game.setKinds(game, activeKinds()); if (a === 'start:classic') carryIn(); Game.setMode(game, a.slice(6)); go('start'); }
  else if (a.startsWith('level:')) { Game.startLevel(game, +a.slice(6)); go('start'); }
  else if (a === 'next') { Game.startLevel(game, game.level + 1); go('restart'); }
  else if (a === 'restart') { bankVP(); if (game.mode.id === 'classic' && game.level == null) carryIn(); Game.rematch(game, activeKinds()); go('restart'); }
  else if (a === 'menu') { bankVP(); go('menu'); }
  else if (a === 'lang') { Profile.setLang(save, save.lang === 'zh' ? 'en' : 'zh'); Storage.save(save); showScreen(); }
  else if (a.startsWith('kind:')) { if (Profile.toggleKind(save, +a.slice(5))) Storage.save(save); showScreen(); }
  else if (a.startsWith('carry:')) { if (Profile.toggleCarry(save, a.slice(6))) Storage.save(save); showScreen(); }
  else if (a.startsWith('backup:')) backupAct(a.slice(7));
  else if (a === 'backup') { bk.msg = ''; bk.pending = null; go('backup'); }
  else if (a.startsWith('buy:')) { if (Profile.buy(save, +a.slice(4))) Storage.save(save); showScreen(); }
  else go(a);
}
ov.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (el && !el.disabled) act(el.dataset.act); });
bPause.onclick = () => { if (game.drag) Game.endDrag(game, game.drag.id); go('pause'); };
bAssist.onclick = () => { game.assist = !game.assist; refreshButtons(); };
bSound.onclick = () => { Profile.toggleSound(save); Storage.save(save); refreshButtons(); };
document.addEventListener('pointerdown', () => Sfx.unlock());                       // iOS must start audio inside a user gesture
document.addEventListener('click', e => { if (e.target.closest('button')) Sfx.play('click'); });
document.addEventListener('visibilitychange', () => { if (document.hidden) { Sfx.suspend(); if (flow.state === 'playing') bPause.onclick(); } });

/* ───────── Debug panel (tap the version label bottom right): for diagnosing the iPhone home-screen app ───────── */
const dbg = { frames: 0, doc: '-', ptr: '-', touches: 0, begin: '-' };
document.addEventListener('pointerdown', e => { dbg.doc = e.pointerType + '@' + Math.round(e.clientX) + ',' + Math.round(e.clientY); }, true);
document.addEventListener('touchstart', () => { dbg.touches++; }, { capture: true, passive: true });
function dbgText() {
  const r = canvas.getBoundingClientRect(), vv = window.visualViewport, h = game.held;
  const standalone = !!(navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches));
  return [APP_VERSION + '  standalone=' + standalone + '  sw=' + !!(navigator.serviceWorker && navigator.serviceWorker.controller),
    'inner=' + innerWidth + 'x' + innerHeight + '  vv=' + (vv ? Math.round(vv.width) + 'x' + Math.round(vv.height) + '@' + Math.round(vv.offsetTop) : '-') + '  dpr=' + devicePixelRatio,
    'canvas=' + Math.round(r.left) + ',' + Math.round(r.top) + ' ' + Math.round(r.width) + 'x' + Math.round(r.height) + '  L.ok=' + L.ok + ' f=' + L.f.toFixed(3) + ' k=' + L.k.toFixed(3) + ' top=' + Math.round(L.top),
    'frames=' + dbg.frames + '  flow=' + flow.state + '  phase=' + game.phase + '  drag=' + !!game.drag + '  held=' + (h ? Math.round(h.x) + ',' + Math.round(h.y) : '-'),
    'touchstart=' + dbg.touches + '  doc-pointerdown=' + dbg.doc,
    'canvas-pointerdown=' + dbg.ptr + '  beginDrag=' + dbg.begin,
    'external-errors=' + window.__ext.length + (window.__ext.length ? ' (' + window.__ext[window.__ext.length - 1] + ')' : '')].join('\n');
}
{ const v = document.createElement('div'); v.id = 'ver'; v.textContent = APP_VERSION; document.body.appendChild(v);
  const panel = document.getElementById('dbg'); let timer = 0;
  v.addEventListener('click', () => { const on = panel.style.display !== 'block'; panel.style.display = on ? 'block' : 'none';
    clearInterval(timer); if (on) { panel.textContent = dbgText(); timer = setInterval(() => { panel.textContent = dbgText(); }, 300); } }); }

/* ───────── Main loop ───────── */
let last = performance.now();
function frame(now) {
  try {
    dbg.frames++;
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (flow.state === 'playing') { if (Fx.hitstop > 0) Fx.hitstop -= dt; else handleEvents(Game.update(game, dt)); }   // hit-stop: physics pauses briefly on heavy hits
    Fx.update(dt);
    refreshHud(); refreshItems();
    render();
  } catch (e) { reportError(e); }
  finally { requestAnimationFrame(frame); }          // whatever goes wrong, the loop must keep running
}
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', () => setTimeout(layout, 100));
window.addEventListener('pageshow', layout);
if (window.visualViewport) window.visualViewport.addEventListener('resize', layout);
if (window.ResizeObserver) new ResizeObserver(layout).observe(document.getElementById('stage'));   // re-layout whenever the stage resizes (most reliable for the iOS home-screen app)
layout(); showScreen();
requestAnimationFrame(frame);

if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {   // PWA: playable offline (not registered on file://)
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

window.SC = SC; window.__game = game; window.__flow = flow; window.__act = act; window.__sfx = Sfx; window.__sprites = Sprites; window.__project = project;   // for debugging and automated tests
})();
</script>
