<style>
  html,body{margin:0;height:100%;overscroll-behavior:none;background:#2b2233;overflow:hidden;touch-action:none;

  #app{position:fixed;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column}

<script>
/* 診斷：任何錯誤都顯示在畫面底部（點一下關閉），方便在 iPhone 上截圖回報 */
const APP_VERSION = 'v9';
function reportError(e) {
  try { const el = document.getElementById('err'); el.textContent = '[' + APP_VERSION + '] ' + (e && e.message ? e.message : e) + (e && e.stack ? ' @ ' + String(e.stack).split('\n')[0] : ''); el.style.display = 'block'; } catch (x) {}
}
window.__ext = [];   // 瀏覽器 / 擴充功能（例如分享選單）丟出的「Script error.」：沒有細節、不是遊戲的錯，不顯示紅條，只記錄在診斷面板
window.addEventListener('error', e => {
  if (!e.error && (!e.filename || e.message === 'Script error.')) { window.__ext.push(String(e.message)); return; }
  reportError(e.error || e.message);
});
window.addEventListener('unhandledrejection', e => reportError(e.reason));
</script>
<script>
/* ════════════════════════════════════════════════════════════════════
   Sliding Cups — 單檔架構
   ┌ CORE（不碰 DOM，可在 Node 測試）
   │   CONFIG   所有資料與手感參數
   │   RNG      有種子的亂數
   │   Physics  純物理：移動、摩擦、碰撞、合併；只產生「事件」
   │   Modes    模式物件：出什麼杯、怎樣算輸、是否強制輔助線
   │   Game     規則與狀態機：出杯、發射（冰壺式）、計分、勝負
   └ APP（瀏覽器）
       Storage / Renderer / FX / Input / UI / main
   ════════════════════════════════════════════════════════════════════ */

/*#core-start*/
const SC = (() => {
'use strict';

/* ───────── CONFIG ───────── */
const CONFIG = {
  world: { W: 600, H: 945, LINE_Y: 720, SPAWN: { x: 300, y: 845 } },   // 俯視平面；y=0 遠端，y=H 靠近玩家
  phys: {
    STEP: 1 / 120,  // 固定時間步長
    A: 560,         // 滑動摩擦（固定減速）
    K: 0.7,         // 速度阻尼
    VMAX: 3600,     // 發射速度上限
    VMIN: 630,      // 越線時低於此速度 → 退回
    GAIN: 0.9,      // 手指速度（低於 KNEE）→ 杯子速度
    KNEE: 700,      // 超過此手指速度，超出的部分改用 GAIN_HI
    GAIN_HI: 1.7,
    E: 0.6,         // 杯子互撞彈性
    EW: 0.35,       // 撞牆彈性
    STOP: 8,        // 低於此速度視為停下
    HIST_MS: 100,   // 計算發射速度的時間窗
  },
  rules: { DANGER_T: 3, SETTLE_T: 0.25, FADE_T: 1.2, RETURN_RATE: 14, GRAB_MARGIN: 40, GRAB_OFFSET_MAX: 120 },
  scoring: { base: 10, checkmate: 2000 },
  // VP（勝利點）：每 perScore 分 1 VP；每做出一個國王 +kingBonus；unlockCost[i] = 解鎖第 i 種生物所需 VP（依序解鎖）
  vp: { perScore: 500, kingBonus: 10, unlockCost: [0, 0, 100, 200, 350, 550, 800] },
  nextTierCum: [0.5, 0.8, 0.95],                 // 出杯階級的累積機率：兵 50%、馬 30%、象 15%、城堡 5%
  view: { TILT: 0.7, S_FAR: 0.78 },
  // 道具：背包 slots 格；經典模式每累積 energyCost 分（合併得分）給 1 個隨機道具；cost = 開局攜帶所需 VP
  items: {
    slots: 2, energyCost: 1500, sweepDepth: 240, upgradeMax: 3, magnetTime: 1.6, magnetAccel: 2600, magnetVmax: 800,
    defs: [
      { id: 'sweep', cost: 20 }, { id: 'upgrade', cost: 10 }, { id: 'wild', cost: 10 }, { id: 'magnet', cost: 10 }, { id: 'undo', cost: 6 },
    ],
  },
  // 關卡：目標 = 每一種「kinds」都做出國王。reward = 首次通關的 VP（重玩不再給，避免刷分）
  levels: [
    { kinds: [0],       reward: 30,  items: [] },       // items = 這一關開局給的道具（關卡模式不會再獲得）
    { kinds: [0, 1],    reward: 60,  items: [] },
    { kinds: [0, 1, 2], reward: 100, items: [] },
  ],
  // massK 質量倍率、fric 摩擦倍率、bounce 彈性倍率：越大的杯子越重、停得越快、彈得越少
  tiers: [
    { r: 22, glyph: '♟', massK: 1.0, fric: 1.00, bounce: 1.00 },
    { r: 28, glyph: '♞', massK: 1.1, fric: 1.08, bounce: 0.95 },
    { r: 36, glyph: '♝', massK: 1.2, fric: 1.16, bounce: 0.90 },
    { r: 46, glyph: '♜', massK: 1.3, fric: 1.24, bounce: 0.85 },
    { r: 58, glyph: '♛', massK: 1.4, fric: 1.32, bounce: 0.80 },
    { r: 72, glyph: '♚', massK: 1.5, fric: 1.40, bounce: 0.75 },
  ],
  kinds: [
    { id: 'dragon',      body: '#ff7a59', dark: '#c9482a', rim: '#ffc9b8' },
    { id: 'unicorn',     body: '#b98cff', dark: '#7d4fd1', rim: '#e6d6ff' },
    { id: 'hydra',       body: '#5fd08a', dark: '#2f9a58', rim: '#c9f2d8' },
    { id: 'phoenix',     body: '#ffc23d', dark: '#d18f00', rim: '#ffe7a8' },
    { id: 'basilisk',    body: '#3cc7c2', dark: '#1d8f8b', rim: '#bff0ee' },
    { id: 'griffin',     body: '#c58a5a', dark: '#8a5832', rim: '#ecd0b6' },
    { id: 'aqrabuamelu', body: '#e8b86a', dark: '#b27d2c', rim: '#f8e3bd' },
  ],
};
const TOP = CONFIG.tiers.length - 1;

/* ───────── RNG（mulberry32，有種子 → 可重播、每日挑戰、自動測試）───────── */
function makeRng(seed) {
  let a = seed >>> 0;
  const f = function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  f.get = () => a; f.set = (v) => { a = v >>> 0; };   // 狀態存取（撤銷道具用）
  return f;
}

/* ───────── PHYSICS（純函式，只改 world，不認識分數與規則）───────── */
const Physics = (() => {
  const P = CONFIG.phys, Wd = CONFIG.world;
  function createWorld() { return { cups: [], events: [], nextId: 0, acc: 0 }; }
  function makeCup(world, kind, tier, x, y) {
    const T = CONFIG.tiers[tier], r = T.r;
    return { id: ++world.nextId, kind, tier, x, y, vx: 0, vy: 0, r, m: r * r * T.massK,
             fric: T.fric, bounce: T.bounce, held: false, pop: 0, dead: false };
  }
  const wallHit = (world, c, v) => { if (v > 60) world.events.push({ type: 'wall', v, x: c.x, y: c.y, id: c.id }); };
  function integrate(world, dt) {
    const W = Wd.W, H = Wd.H;
    for (const c of world.cups) {
      if (c.held || c.dead) continue;
      const sp = Math.hypot(c.vx, c.vy);
      if (sp > 0) {
        const sp2 = Math.max(0, sp - (P.A + P.K * sp) * c.fric * dt);
        if (sp2 < P.STOP) { c.vx = c.vy = 0; }
        else { const f = sp2 / sp; c.vx *= f; c.vy *= f; }
      }
      c.x += c.vx * dt; c.y += c.vy * dt;
      if (c.x < c.r)     { c.x = c.r;     if (c.vx < 0) { wallHit(world, c, -c.vx); c.vx = -c.vx * P.EW * c.bounce; } }
      if (c.x > W - c.r) { c.x = W - c.r; if (c.vx > 0) { wallHit(world, c, c.vx); c.vx = -c.vx * P.EW * c.bounce; } }
      if (c.y < c.r)     { c.y = c.r;     if (c.vy < 0) { wallHit(world, c, -c.vy); c.vy = -c.vy * P.EW * c.bounce; } }
      if (c.y > H - c.r) { c.y = H - c.r; if (c.vy > 0) { wallHit(world, c, c.vy); c.vy = -c.vy * P.EW * c.bounce; } }
    }
  }
  function merge(world, a, b) {
    a.dead = b.dead = true;
    const x = (a.x * a.m + b.x * b.m) / (a.m + b.m);
    const y = (a.y * a.m + b.y * b.m) / (a.m + b.m);
    const kind = a.wild && !b.wild ? b.kind : a.kind;       // 萬用杯合併後變成對方的生物
    if (a.tier === TOP) { world.events.push({ type: 'checkmate', kind, x, y }); return; }
    const nc = makeCup(world, kind, a.tier + 1, x, y);
    nc.vx = (a.vx * a.m + b.vx * b.m) / (a.m + b.m);
    nc.vy = (a.vy * a.m + b.vy * b.m) / (a.m + b.m);
    nc.pop = 1;
    world.cups.push(nc);
    world.events.push({ type: 'merge', kind, tier: nc.tier, x, y });
  }
  function collide(world) {
    const cups = world.cups;
    for (let i = 0; i < cups.length; i++) {
      const a = cups[i];
      if (a.dead || a.held) continue;
      for (let j = i + 1; j < cups.length; j++) {
        const b = cups[j];
        if (b.dead || b.held) continue;
        const dx = b.x - a.x, dy = b.y - a.y, rr = a.r + b.r;
        const d2 = dx * dx + dy * dy;
        if (d2 >= rr * rr) continue;
        if (a.tier === b.tier && (a.kind === b.kind || a.wild || b.wild)) { merge(world, a, b); break; }
        const d = Math.sqrt(d2) || 0.0001;
        const nx = dx / d, ny = dy / d;
        const ia = 1 / a.m, ib = 1 / b.m;
        const corr = (rr - d) / (ia + ib) * 0.8;
        a.x -= nx * corr * ia; a.y -= ny * corr * ia;
        b.x += nx * corr * ib; b.y += ny * corr * ib;
        const rvn = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
        if (rvn < 0) {
          if (-rvn > 40) world.events.push({ type: 'hit', v: -rvn, tier: Math.max(a.tier, b.tier), ta: a.tier, tb: b.tier, a: a.id, b: b.id, x: a.x + nx * a.r, y: a.y + ny * a.r });
          const e = P.E * (a.bounce + b.bounce) / 2;
          const j2 = -(1 + e) * rvn / (ia + ib);
          a.vx -= j2 * nx * ia; a.vy -= j2 * ny * ia;
          b.vx += j2 * nx * ib; b.vy += j2 * ny * ib;
        }
      }
    }
  }
  function substep(world, dt) { integrate(world, dt); collide(world); }
  // 以固定步長推進；回傳前清掉已死亡的杯子
  function advance(world, dt) {
    world.acc += dt;
    while (world.acc >= P.STEP) { substep(world, P.STEP); world.acc -= P.STEP; }
    world.cups = world.cups.filter(c => !c.dead);
  }
  const isMoving = (world) => world.cups.some(c => !c.held && (c.vx || c.vy));
  const isSettled = (c) => !c.held && !c.vx && !c.vy;
  // 預測路徑（只算摩擦與撞牆，不含其他杯子）
  function predictPath(c, v) {
    const W = Wd.W, H = Wd.H, pts = [], pos = { x: c.x, y: c.y }, vel = { x: v.vx, y: v.vy }, dt = 1 / 60;
    for (let i = 0; i < 480; i++) {
      const sp = Math.hypot(vel.x, vel.y);
      const sp2 = Math.max(0, sp - (P.A + P.K * sp) * c.fric * dt);
      if (sp2 < P.STOP) break;
      const f = sp2 / sp; vel.x *= f; vel.y *= f;
      pos.x += vel.x * dt; pos.y += vel.y * dt;
      if (pos.x < c.r)     { pos.x = c.r;     vel.x = Math.abs(vel.x) * P.EW * c.bounce; }
      if (pos.x > W - c.r) { pos.x = W - c.r; vel.x = -Math.abs(vel.x) * P.EW * c.bounce; }
      if (pos.y < c.r)     { pos.y = c.r;     vel.y = Math.abs(vel.y) * P.EW * c.bounce; }
      if (pos.y > H - c.r) { pos.y = H - c.r; vel.y = -Math.abs(vel.y) * P.EW * c.bounce; }
      if (i % 3 === 0) pts.push({ x: pos.x, y: pos.y });
    }
    pts.push({ x: pos.x, y: pos.y });
    return pts;
  }
  return { createWorld, makeCup, advance, substep, isMoving, isSettled, predictPath };
})();

/* ───────── MODES（模式物件：只回答「出什麼杯」「怎樣算輸」）───────── */
const Modes = {
  classic: {
    id: 'classic',
    danger: 'lose',            // 杯子停在線內太久 → 輸
    assistForced: false,
    tracksBest: true,
    givesVP: true,
    hud: 'best',               // 右上角顯示：'best' 最高分 | 'level' 關卡編號
    items: 'earn',             // 道具：'earn' 合併充能獲得 | 'fixed' 關卡指定 | 'free' 無限使用 | 'none'
    banner: null,              // 畫面上的模式標示（i18n key）
    goalKinds: null,           // 過關目標：需要做出國王的生物清單（null = 沒有目標）
    pickNext(g) {              // 與原型相同的擲骰順序：先階級、再種類
      const t = g.rng(), cum = CONFIG.nextTierCum;
      let tier = cum.length; for (let i = 0; i < cum.length; i++) if (t < cum[i]) { tier = i; break; }
      return { kind: g.kinds[Math.floor(g.rng() * g.kinds.length)], tier };
    },
  },
  level: {
    id: 'level',
    danger: 'lose',
    assistForced: false,
    tracksBest: false,
    givesVP: false,            // 關卡只給「首次通關獎勵」（Profile.clearLevel）
    hud: 'level',
    items: 'fixed',
    banner: null,
    goalKinds(g) { return CONFIG.levels[g.level].kinds; },
    pickNext(g) { return Modes.classic.pickNext(g); },
  },
  practice: {
    id: 'practice',
    danger: 'fade',            // 越線的杯子淡出消失，不會輸
    assistForced: true,
    tracksBest: false,
    givesVP: false,
    hud: 'best',
    items: 'free',
    banner: 'fx.practice',
    goalKinds: null,
    pickNext(g) { return Modes.classic.pickNext(g); },
  },
};

/* ───────── GAME（規則與狀態機；不碰 DOM）───────── */
const Game = (() => {
  const P = CONFIG.phys, R = CONFIG.rules, Wd = CONFIG.world;

  function create(opts) {
    opts = opts || {};
    const seed = opts.seed != null ? opts.seed >>> 0 : (Math.random() * 4294967296) >>> 0;
    const g = {
      seed, rng: makeRng(seed), kinds: [], nKinds: 1, kings: 0, kingKinds: [], level: null,
      mode: Modes[opts.mode || 'classic'], world: Physics.createWorld(),
      phase: 'ready',           // ready（等玩家發射）| flying（杯子在滑）| over
      score: 0, shotMerges: 0, dangerT: 0, settleT: 0,
      held: null, next: null, drag: null, assist: false, banked: false, startItems: [], runs: 0,
    };
    setKinds(g, opts.kinds || Array.from({ length: Math.max(1, Math.min(CONFIG.kinds.length, opts.nKinds || 1)) }, (_, i) => i));
    restart(g);
    return g;
  }
  function restart(g, seed) {
    if (seed != null) { g.seed = seed >>> 0; g.rng = makeRng(g.seed); }
    g.world = Physics.createWorld();
    g.held = null; g.drag = null; g.score = 0; g.kings = 0; g.kingKinds = []; g.banked = false; g.shotMerges = 0; g.dangerT = 0; g.settleT = 0;
    const im = g.mode.items;                                       // 道具狀態（用獨立的亂數，不影響出杯順序）

const Profile = (() => {

  const nat = (x) => (Number.isFinite(x) && x >= 0 ? Math.floor(x) : 0);

    p.vp = nat(raw.vp);
    const n = Math.max(2, Math.min(NK, uniq(raw.unlocked, i => i < NK).length));   // 依序解鎖：永遠是 [0..n-1]，至少 2 種

  }
  const nextLockedKind = (p) => (p.unlocked.length < NK ? p.unlocked.length : -1);
  function buy(p, i) {                                    // 解鎖下一種生物；回傳是否成功
    const cost = CONFIG.vp.unlockCost[i];
    if (i !== p.unlocked.length || i >= NK || p.vp < cost) return false;
    p.vp -= cost; p.unlocked.push(i); return true;
  }
  function toggleKind(p, i) {                             // 加入 / 移出本局使用的生物（至少留 1 種）
    if (!p.unlocked.includes(i)) return false;
    const at = p.active.indexOf(i);
    if (at >= 0) { if (p.active.length === 1) return false; p.active.splice(at, 1); }

  if (sq > 0) { ctx.save(); ctx.translate(p.sx, p.sy); ctx.scale(1 + 0.16 * sq * JUICE.squash, 1 - 0.13 * sq * JUICE.squash); ctx.translate(-p.sx, -p.sy); }
  const usedSprite = drawPiece(p.sx, p.sy, c.r * p.s * scale, c.kind, c.tier, { happy: c.pop > 0, fast: Math.hypot(c.vx, c.vy) > 300, glow: c.held });
  if (c.wild) {                                           // 萬用杯：彩虹色光圈
    const R = c.r * p.s * scale; ctx.strokeStyle = 'hsl(' + ((performance.now() / 5) % 360).toFixed(0) + ',95%,65%)'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.ellipse(p.sx, p.sy, R * 1.12, R * 1.12 * tilt, 0, 0, Math.PI * 2); ctx.stroke();
  }
  if (sq > 0 && !usedSprite) {
    ctx.fillStyle = 'rgba(255,255,255,' + (0.45 * sq * JUICE.squash).toFixed(3) + ')';          // 受擊瞬間閃白
    const R = c.r * p.s * scale; ctx.beginPath(); ctx.ellipse(p.sx, p.sy - R * 0.95, R, R * tilt, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  } else if (sq > 0) ctx.restore();
}
function drawTable() {
  const a = project(0, 0), b = project(W, 0), c = project(W, H), d = project(0, H);
  const g = ctx.createLinearGradient(0, a.sy, 0, d.sy);
  g.addColorStop(0, '#e7c99a'); g.addColorStop(1, '#f3dcb4');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.moveTo(a.sx, a.sy); ctx.lineTo(b.sx, b.sy); ctx.lineTo(c.sx, c.sy); ctx.lineTo(d.sx, d.sy); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(160,110,60,.12)'; ctx.lineWidth = 1;
  for (let i = 1; i < 12; i++) {
    const y = H * i / 12, l = project(0, y), r = project(W, y);
    ctx.beginPath(); ctx.moveTo(l.sx, l.sy); ctx.lineTo(r.sx, r.sy); ctx.stroke();
  }
  const l1 = project(0, LINE_Y), r1 = project(W, LINE_Y);
  ctx.fillStyle = 'rgba(255,255,255,.28)';
  ctx.beginPath(); ctx.moveTo(l1.sx, l1.sy); ctx.lineTo(r1.sx, r1.sy); ctx.lineTo(c.sx, c.sy); ctx.lineTo(d.sx, d.sy); ctx.closePath(); ctx.fill();
  const danger = game.dangerT > 0 && game.mode.danger === 'lose';
  const pulse = danger ? 0.5 + 0.5 * Math.sin(performance.now() / 90) : 0;
  ctx.setLineDash([10, 8]);
  ctx.strokeStyle = danger ? `rgba(230,40,60,${0.6 + 0.4 * pulse})` : 'rgba(120,80,40,.6)';
  ctx.lineWidth = danger ? 4 : 2.5;
  ctx.beginPath(); ctx.moveTo(l1.sx, l1.sy); ctx.lineTo(r1.sx, r1.sy); ctx.stroke();
  ctx.setLineDash([]);
  if (danger) {
    const frac = Math.min(1, game.dangerT / CONFIG.rules.DANGER_T);
    ctx.fillStyle = 'rgba(230,40,60,.9)';
    ctx.fillRect(l1.sx, l1.sy - 6, (r1.sx - l1.sx) * frac, 6);
  }
  ctx.strokeStyle = '#8a5a34'; ctx.lineWidth = 6; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(d.sx, d.sy); ctx.lineTo(a.sx, a.sy); ctx.lineTo(b.sx, b.sy); ctx.lineTo(c.sx, c.sy); ctx.stroke();
}
function drawAssist() {
  if (!Game.assistOn(game) || !game.drag || !game.held) return;
  const v = Game.launchV(game);
  if (Math.hypot(v.vx, v.vy) < CONFIG.phys.VMIN * 0.6) return;
  const pts = Physics.predictPath(game.held, v);
  ctx.save();
  ctx.setLineDash([2, 8]); ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 4;
  ctx.beginPath();
  pts.forEach((q, i) => { const p = project(q.x, q.y); if (i) ctx.lineTo(p.sx, p.sy); else ctx.moveTo(p.sx, p.sy); });
  ctx.stroke();
  ctx.setLineDash([]);
  const e = pts[pts.length - 1], pe = project(e.x, e.y);
  ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.ellipse(pe.sx, pe.sy, game.held.r * pe.s, game.held.r * pe.s * tilt, 0, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
}

/* ───────── FX（粒子與浮動文字；由遊戲事件觸發）───────── */
let particles = [], popups = [], sparks = [], rings = [];
const squash = new Map();                 // 杯子 id → 受擊壓扁程度（0..1，會衰減）
let shake = 0, hitstop = 0;
const JUICE = { shake: 0.45, hitstop: 0.35, sparks: 0.35, squash: 0.5, rings: 0.6 };   // 打擊感強度倍率；設 0 就關掉該效果
function impactFx(ev, sx, sy) {           // 撞擊點：火花 + 衝擊環
  const k = Math.min(1, ev.v / 1800);
  const n = Math.round((3 + k * 11) * JUICE.sparks);
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = 250 + Math.random() * 500 * (0.4 + k);
    sparks.push({ x: sx, y: sy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * 0.6, life: 0.22 + Math.random() * 0.25, w: 2.2 + Math.random() * 2 });
  }
  rings.push({ x: sx, y: sy, life: 0.28, max: 0.28, r1: 16 + k * 34, str: 0.7 + k * 0.3 });
}
function kick(px) { shake = Math.max(shake, px * JUICE.shake); }
function burst(sx, sy, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 80 + Math.random() * 220;
    particles.push({ x: sx, y: sy, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 120, life: 0.5 + Math.random() * 0.4, color, size: 2 + Math.random() * 3 });
  }
}
function popup(text, sx, sy) { popups.push({ text, x: sx, y: sy, life: 1.1 }); }
function handleEvents(events) {
  for (const ev of events) {
    Sfx.event(ev);
    if (ev.type === 'hit') {
      const p = project(ev.x, ev.y), k = Math.min(1, ev.v / 1800);
      impactFx(ev, p.sx, p.sy - 8 * p.s);
      squash.set(ev.a, Math.min(1, 0.35 + k)); squash.set(ev.b, Math.min(1, 0.35 + k));
      if (ev.v > 250) kick(1 + k * 6 + ev.tier * 0.6);
      if (ev.v > 1700) hitstop = Math.max(hitstop, 0.035 * JUICE.hitstop);
    } else if (ev.type === 'wall') {
      const p = project(ev.x, ev.y), k = Math.min(1, ev.v / 1800);
      if (ev.v > 500) { impactFx(ev, p.sx, p.sy - 8 * p.s); kick(1 + k * 4); }
      squash.set(ev.id, Math.min(1, 0.3 + k));
    } else if (ev.type === 'merge') {
      kick(3 + ev.tier * 2.2); if (ev.tier >= 3) hitstop = Math.max(hitstop, 0.05 * JUICE.hitstop);
      const p = project(ev.x, ev.y);
      rings.push({ x: p.sx, y: p.sy - 6, life: 0.35, max: 0.35, r1: 30 + ev.tier * 14, str: 1 });
      burst(p.sx, p.sy, KINDS[ev.kind].rim, 10 + ev.tier * 3);
      popup((ev.combo > 1 ? t('fx.combo', { n: ev.combo }) + '  ' : '') + '+' + ev.gain, p.sx, p.sy - 20);
    } else if (ev.type === 'checkmate') {
      kick(20); hitstop = Math.max(hitstop, 0.15 * JUICE.hitstop);
      const p = project(ev.x, ev.y);
      rings.push({ x: p.sx, y: p.sy - 6, life: 0.5, max: 0.5, r1: 120, str: 1 });
      burst(p.sx, p.sy, KINDS[ev.kind].body, 36);
      popup(t('fx.checkmate') + ' +' + ev.gain, p.sx, p.sy - 30);
    } else if (ev.type === 'fade') {
      const p = project(ev.x, ev.y); burst(p.sx, p.sy, '#ffffff', 8);
    } else if (ev.type === 'item') {
      const c = project(CONFIG.world.W / 2, CONFIG.world.LINE_Y - 80); popup(t('item.' + ev.id), c.sx, c.sy);
      if (ev.id === 'undo') kick(4);
    } else if (ev.type === 'sweepcup') {
      const p = project(ev.x, ev.y); burst(p.sx, p.sy, KINDS[ev.kind].body, 14); rings.push({ x: p.sx, y: p.sy - 6, life: 0.3, max: 0.3, r1: 40, str: 0.8 }); kick(3);
    } else if (ev.type === 'upgrade' || ev.type === 'wild') {
      const p = project(ev.x, ev.y); burst(p.sx, p.sy, ev.type === 'wild' ? '#ffd86a' : '#ffffff', 16); rings.push({ x: p.sx, y: p.sy - 6, life: 0.4, max: 0.4, r1: 70, str: 1 });
    } else if (ev.type === 'itemget') {
      const c = project(CONFIG.world.W / 2, CONFIG.world.LINE_Y - 40); popup(t('fx.itemget', { name: t('item.' + ev.id) }), c.sx, c.sy);
      lastGet = ev.id; setTimeout(() => { lastGet = null; }, 900);
    } else if (ev.type === 'gameover') {
      newBest = Profile.finishRun(save, game).newBest; Storage.save(save); go('gameover');
    } else if (ev.type === 'levelclear') {
      lastReward = Profile.clearLevel(save, ev.level); game.banked = true; Storage.save(save); go('clear');
    }
  }
}
function updateFx(dt) {
  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 500 * dt; p.life -= dt; }
  particles = particles.filter(p => p.life > 0);
  for (const p of popups) { p.y -= 28 * dt; p.life -= dt; }
  popups = popups.filter(p => p.life > 0);
  for (const p of sparks) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.92; p.vy *= 0.92; p.life -= dt; }
  sparks = sparks.filter(p => p.life > 0);
  for (const r of rings) r.life -= dt;
  rings = rings.filter(r => r.life > 0);
  for (const [id, a] of squash) { const n = a - dt / 0.22; if (n <= 0) squash.delete(id); else squash.set(id, n); }
  shake *= Math.exp(-dt * 14); if (shake < 0.15) shake = 0;
}

function render() {
  if (!L.ok) return;
  ctx.setTransform(L.dpr, 0, 0, L.dpr, 0, 0);
  ctx.clearRect(0, 0, L.cw, L.ch);
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * 2 * shake, (Math.random() - 0.5) * 2 * shake);   // 畫面震動（只震桌面，不震介面）
  drawTable();
  drawAssist();
  const list = game.world.cups.slice().sort((a, b) => a.y - b.y);
  for (const c of list) drawCup(c);
  if (game.magnetT > 0) {                                     // 磁鐵：有成對的杯子會閃光圈
    const seen = {}; for (const c of game.world.cups) if (!c.held) { const k = c.kind * 8 + c.tier; (seen[k] = seen[k] || []).push(c); }
    const a = 0.35 + 0.35 * Math.sin(performance.now() / 70); ctx.lineWidth = 3;
    for (const k in seen) if (seen[k].length > 1) for (const c of seen[k]) { const p = project(c.x, c.y), R = c.r * p.s; ctx.strokeStyle = 'rgba(160,210,255,' + a.toFixed(2) + ')'; ctx.beginPath(); ctx.ellipse(p.sx, p.sy, R * 1.25, R * 1.25 * tilt, 0, 0, Math.PI * 2); ctx.stroke(); }
  }
  for (const r of rings) {                                    // 衝擊環
    const k = 1 - r.life / r.max, rad = r.r1 * (0.3 + 0.7 * k);
    ctx.strokeStyle = 'rgba(255,248,220,' + (r.str * (1 - k) * JUICE.rings).toFixed(3) + ')'; ctx.lineWidth = 5 * (1 - k) + 1.5;
    ctx.beginPath(); ctx.ellipse(r.x, r.y, rad, rad * tilt, 0, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.lineCap = 'round';
  for (const p of sparks) {                                   // 金屬火花
    ctx.strokeStyle = 'rgba(236,222,196,' + Math.min(1, p.life * 4).toFixed(3) + ')'; ctx.lineWidth = p.w;
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 0.05, p.y - p.vy * 0.05); ctx.stroke();
  }
  ctx.restore();

  ctx.fillStyle = 'rgba(0,0,0,.28)'; rr(10, 6, 96, 46, 12); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = '12px sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(t('fx.next'), 18, 29);
  if (game.next) drawPiece(80, 40, 16, game.next.kind, game.next.tier, { noShadow: true });

  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 2));
    ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.size, p.size);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = 'bold 18px sans-serif';
  for (const p of popups) {
    ctx.globalAlpha = Math.min(1, p.life * 1.5);
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(60,30,60,.8)'; ctx.strokeText(p.text, p.x, p.y);
    ctx.fillStyle = '#fff'; ctx.fillText(p.text, p.x, p.y);
  }
  ctx.globalAlpha = 1;
  if (game.mode.banner) {
    ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.font = '12px sans-serif'; ctx.textAlign = 'right';
    ctx.fillText(t(game.mode.banner), L.cw - 12, 20);
  }
  if (game.mode.goalKinds) {                                    // 過關目標：每種生物的國王，達成後亮起
    const ks = game.mode.goalKinds(game);
    ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.font = '12px sans-serif'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.fillText(t('fx.goal'), L.cw - 12, 14);
    ks.forEach((k, i) => {
      const x = L.cw - 28 - i * 38, done = game.kingKinds.includes(k);
      ctx.globalAlpha = done ? 1 : 0.35; drawPiece(x, 52, 13, k, TIERS.length - 1, { noShadow: true }); ctx.globalAlpha = 1;
      if (done) { ctx.fillStyle = '#fff'; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('✔', x, 66); }
    });
  }
}

/* ───────── Input（只把手指事件轉成 Game 的呼叫）───────── */
canvas.addEventListener('pointerdown', e => {
  if (flow.state !== 'playing') return;
  const w = toWorld(e);
  const began = Game.beginDrag(game, w.x, w.y, e.pointerId, e.timeStamp);
  dbg.ptr = Math.round(e.clientX) + ',' + Math.round(e.clientY) + ' → world ' + Math.round(w.x) + ',' + Math.round(w.y); dbg.begin = began;
  if (began) { try { canvas.setPointerCapture(e.pointerId); } catch (err) {} }
});

  if (!game.drag) return;
  const w = toWorld(e);
  if (Game.dragTo(game, w.x, w.y, e.pointerId, e.timeStamp) === 'launched') {
    const c = game.world.cups.reduce((a, b) => (a.id > b.id ? a : b));   // 剛發射的杯子
    Sfx.play('launch', Math.hypot(c.vx, c.vy));

});
const endDrag = e => Game.endDrag(game, e.pointerId);
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

      const names = lv.kinds.map(k => dot(k) + kindName(k)).join('  ');
      const sub = open ? t('level.goal', { names }) + '<br>' + (cleared ? t('level.cleared') : t('level.reward', { n: lv.reward })) : t('level.locked');
      return `<button data-act="level:${i}" class="row ${open && !cleared ? 'on' : ''}" ${open ? '' : 'disabled'}><span>${cleared ? '✔ ' : ''}${t('level.n', { n: i + 1 })}</span><small>${sub}</small></button>`;
    }).join('');
    ov.innerHTML = `<div class="card"><h2>${t('levels.title')}</h2>${rows}${btn('menu', t('back'), 'main')}</div>`;
  } else if (s === 'paused') ov.innerHTML = `<div class="card"><h2>${t('paused')}</h2>
    ${btn('resume', t('resume'), 'main')}${btn('restart', t('restart'))}${btn('menu', t('menu'))}</div>`;
  else if (s === 'result') {
    const won = game.phase === 'won', v = Game.vp(game);
    let extra = '';
    if (won) extra = lastReward ? `<p class="best">${t('level.firstClear', { n: lastReward })}　${t('vpTotal', { n: save.vp })}</p>` : '';
    else if (game.mode.tracksBest) extra = `<p class="best">${newBest ? t('newBest') : t('bestIs', { n: save.best[Profile.bestKey(game)] || 0 })}</p>${game.itemsUsed ? `<p class="best">${t('result.items')}</p>` : ''}`;
    if (v.total) extra += `<p class="best">${t('vpGain', { n: v.total, a: v.fromScore, k: v.fromKings ? t('vpKings', { n: v.fromKings }) : '' })}　${t('vpTotal', { n: save.vp })}</p>`;
    const hasNext = won && game.level + 1 < CONFIG.levels.length;
    ov.innerHTML = `<div class="card"><h2>${won ? t('level.clear') : t('gameOver')}</h2><p class="big">${game.score}</p>${extra}
      ${hasNext ? btn('next', t('level.next'), 'main') : ''}
      ${btn('restart', won ? t('level.replay') : t('retry'), hasNext ? '' : 'main')}${btn('menu', t('menu'))}</div>`;
  } else ov.innerHTML = '';
  refreshButtons();
}
function go(ev) { if (Flow.send(flow, ev)) showScreen(); }
function carryIn() { const id = Profile.takeCarry(save); game.startItems = id ? [id] : []; Storage.save(save); }   // 開局攜帶的道具：這一局用掉
function act(a) {
  Sprites.preload(a.startsWith('level:') ? CONFIG.levels[+a.slice(6)].kinds : activeKinds());
  if (a.startsWith('start:')) { Game.setKinds(game, activeKinds()); if (a === 'start:classic') carryIn(); Game.setMode(game, a.slice(6)); go('start'); }
  else if (a.startsWith('level:')) { Game.startLevel(game, +a.slice(6)); go('start'); }
  else if (a === 'next') { Game.startLevel(game, game.level + 1); go('restart'); }
  else if (a === 'restart') { bankVP(); if (game.mode.id === 'classic' && game.level == null) carryIn(); Game.rematch(game, activeKinds()); go('restart'); }
  else if (a === 'menu') { bankVP(); go('menu'); }
  else if (a === 'lang') { Profile.setLang(save, save.lang === 'zh' ? 'en' : 'zh'); Storage.save(save); showScreen(); }
  else if (a.startsWith('kind:')) { if (Profile.toggleKind(save, +a.slice(5))) Storage.save(save); showScreen(); }
  else if (a.startsWith('carry:')) { if (Profile.toggleCarry(save, a.slice(6))) Storage.save(save); showScreen(); }
  else if (a.startsWith('buy:')) { if (Profile.buy(save, +a.slice(4))) Storage.save(save); showScreen(); }
  else go(a);
}
ov.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (el && !el.disabled) act(el.dataset.act); });
bPause.onclick = () => { if (game.drag) Game.endDrag(game, game.drag.id); go('pause'); };
bAssist.onclick = () => { game.assist = !game.assist; refreshButtons(); };
bSound.onclick = () => { Profile.toggleSound(save); Storage.save(save); refreshButtons(); };
document.addEventListener('pointerdown', () => Sfx.unlock());                       // iOS 要在使用者操作中啟動音訊
document.addEventListener('click', e => { if (e.target.closest('button')) Sfx.play('click'); });
document.addEventListener('visibilitychange', () => { if (document.hidden) { Sfx.suspend(); if (flow.state === 'playing') bPause.onclick(); } });

/* ───────── 診斷面板（點右下角的版本號開關）：用來在 iPhone 主畫面版查問題 ───────── */
const dbg = { frames: 0, doc: '-', ptr: '-', touches: 0, begin: '-' };
document.addEventListener('pointerdown', e => { dbg.doc = e.pointerType + '@' + Math.round(e.clientX) + ',' + Math.round(e.clientY); }, true);
document.addEventListener('touchstart', () => { dbg.touches++; }, { capture: true, passive: true });
function dbgText() {
  const r = canvas.getBoundingClientRect(), vv = window.visualViewport, h = game.held;
  const standalone = !!(navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches));
  return [APP_VERSION + '  standalone=' + standalone + '  sw=' + !!(navigator.serviceWorker && navigator.serviceWorker.controller),
    'inner=' + innerWidth + 'x' + innerHeight + '  vv=' + (vv ? Math.round(vv.width) + 'x' + Math.round(vv.height) + '@' + Math.round(vv.offsetTop) : '-') + '  dpr=' + devicePixelRatio,
    'canvas=' + Math.round(r.left) + ',' + Math.round(r.top) + ' ' + Math.round(r.width) + 'x' + Math.round(r.height) + '  L.ok=' + L.ok + ' f=' + L.f.toFixed(3) + ' k=' + L.k.toFixed(3) + ' top=' + Math.round(L.top),
    'frames=' + dbg.frames + '  flow=' + flow.state + '  phase=' + game.phase + '  drag=' + !!game.drag + '  held=' + (h ? Math.round(h.x) + ',' + Math.round(h.y) : '-'),
    'touchstart=' + dbg.touches + '  doc-pointerdown=' + dbg.doc,
    'canvas-pointerdown=' + dbg.ptr + '  beginDrag=' + dbg.begin,
    'external-errors=' + window.__ext.length + (window.__ext.length ? ' (' + window.__ext[window.__ext.length - 1] + ')' : '')].join('\n');
}
{ const v = document.createElement('div'); v.id = 'ver'; v.textContent = APP_VERSION; document.body.appendChild(v);
  const panel = document.getElementById('dbg'); let timer = 0;
  v.addEventListener('click', () => { const on = panel.style.display !== 'block'; panel.style.display = on ? 'block' : 'none';
    clearInterval(timer); if (on) { panel.textContent = dbgText(); timer = setInterval(() => { panel.textContent = dbgText(); }, 300); } }); }

/* ───────── 主迴圈 ───────── */
let last = performance.now();
function frame(now) {
  try {
    dbg.frames++;
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (flow.state === 'playing') { if (hitstop > 0) hitstop -= dt; else handleEvents(Game.update(game, dt)); }   // hitstop：重擊時物理短暫停格
    updateFx(dt);
    refreshHud(); refreshItems();
    render();
  } catch (e) { reportError(e); }
  finally { requestAnimationFrame(frame); }          // 不論發生什麼錯，迴圈都不能停
}
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', () => setTimeout(layout, 100));
window.addEventListener('pageshow', layout);
if (window.visualViewport) window.visualViewport.addEventListener('resize', layout);
if (window.ResizeObserver) new ResizeObserver(layout).observe(document.getElementById('stage'));   // 桌面區域大小一變就重算（iOS 主畫面版最可靠）
layout(); showScreen();
requestAnimationFrame(frame);

if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {   // PWA：離線可玩（file:// 不註冊）
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

window.SC = SC; window.__game = game; window.__flow = flow; window.__act = act; window.__sfx = Sfx; window.__sprites = Sprites; window.__project = project;   // 除錯與自動測試用
})();
</script>
</body>
</html>
