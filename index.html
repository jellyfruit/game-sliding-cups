<div id="dbg"></div>
<script>
/* Diagnostics: any error shows at the bottom of the screen (tap to close) so it can be screenshotted on an iPhone */
const APP_VERSION = 'v18.1.1';
function reportError(e) {
  try { const el = document.getElementById('err'); el.textContent = '[' + APP_VERSION + '] ' + (e && e.message ? e.message : e) + (e && e.stack ? ' @ ' + String(e.stack).split('\n')[0] : ''); el.style.display = 'block'; } catch (x) {}
}
window.__ext = [];   // sanitized 'Script error.' from the browser / extensions (e.g. the share sheet): no details and not our bug — logged in the debug panel, no red bar
window.addEventListener('error', e => {
  if (!e.error && (!e.filename || e.message === 'Script error.')) { window.__ext.push(String(e.message)); return; }
  reportError(e.error || e.message);
});
window.addEventListener('unhandledrejection', e => reportError(e.reason));
</script>
<script>
/* ════════════════════════════════════════════════════════════════════
   Kings of Cups (repo: game-sliding-cups) — single-file architecture
   ┌ CORE (no DOM, testable in Node)
   │   CONFIG   all data and feel parameters
   │   RNG      seeded random numbers
   │   Physics  pure physics: motion, friction, collisions, merges; only emits events
   │   Modes    mode objects with rule hooks (spawning, losing, aim line, items…)
   │   Game     rules + state machine: spawning, curling-style launch, scoring, win/lose
   └ APP (browser)
       Storage / Renderer / FX / Input / UI / main
   ════════════════════════════════════════════════════════════════════ */

/*#core-start*/
const SC = (() => {
'use strict';

/* ───────── CONFIG ───────── */
const CONFIG = {
  world: { W: 600, H: 945, LINE_Y: 720, SPAWN: { x: 300, y: 845 } },   // top-down plane; y=0 far end, y=H near the player
  phys: {
    STEP: 1 / 120,  // fixed time step
    A: 560,         // sliding friction (constant deceleration)
    K: 0.7,         // speed damping
    VMAX: 3600,     // max launch speed
    VMIN: 630,      // slower than this when crossing the line → returns
    GAIN: 0.9,      // finger speed (below KNEE) → cup speed
    KNEE: 700,      // finger speed above this uses GAIN_HI for the excess
    GAIN_HI: 1.7,
    E: 0.6,         // cup–cup restitution
    EW: 0.35,       // wall restitution
    STOP: 8,        // below this speed a cup counts as stopped
    HIST_MS: 100,   // time window for measuring launch speed
  },
  rules: { DANGER_T: 3, SETTLE_T: 0.25, FADE_T: 1.2, RETURN_RATE: 14, GRAB_MARGIN: 40, GRAB_OFFSET_MAX: 120 },
  scoring: { base: 10, checkmate: 2000 },
  // VP: 1 per perScore points; +kingBonus per king made; unlockCost[i] = VP to unlock creature i (in order)
  vp: { perScore: 500, kingBonus: 10, starBonus: 10, unlockCost: [0, 0, 100, 200, 350, 550, 800, null] },   // null = never for sale (finale creature)   // starBonus: VP per newly earned level star
  nextTierCum: [0.5, 0.8, 0.95],                 // cumulative spawn-tier odds: pawn 50%, knight 30%, bishop 15%, rook 5%
  // Difficulty ramp (modes with ramp: true). Every `every` points = +1 level, up to maxLevel.
  // At max level: spawn weights shift to `cumMax` and the lose timer shrinks to `dangerMin` seconds.
  ramp: { every: 3000, maxLevel: 5, cumMax: [0.35, 0.68, 0.9], dangerMin: 2.0 },
  // Skill bonuses for the launched cup's first merge (fraction of that merge's gain), plus a flat bonus per extra simultaneous merge.
  bonus: { bank: 0.5, long: 0.3, longDist: 520, double: 150 },
  // Checkmate shockwave: pushes cups within `radius` outward (up to `push` speed); pawns within `shatter` are destroyed.
  shock: { radius: 340, push: 1100, shatter: 170 },
  // Cluster merge: when two cups merge, every same-creature same-tier cup touching the group (within `touch` units
  // of contact, chained) is absorbed too. Result is still one tier up; score × group size when it reaches `min`.
  cluster: { touch: 30, min: 3 },
  // Chapter 1 coaching: hint bar seconds on screen; demo loop timing (s) and idle time before the demo returns
  tutor: { hintT: 7, press: 0.35, swipe: 0.3, travel: 0.8, rest: 0.8, idleT: 6 },
  // Creature ultimates (modes with ults: 'charge' | 'free'). Rule: hard on low tiers, kind to big pieces.
  // Gauge per creature: each merge of that creature adds tier × perTier (× (cups − 1) for clusters); other creatures with an ultimate get `share` of that; a checkmate adds full/2 to its own creature.
  // Tap the creature's portrait when full → the held cup is enchanted → it fires on its first hit / merge / stop.
  ults: { full: 24, perTier: 3, share: 0.5, kinds: { 0: 'fireball', 1: 'holy', 2: 'venom' },
          fireball: { radius: 150, maxTier: 1, push: 700, pillarDmg: 6 },      // dragon: burns pawns + knights, pushes the rest out
          holy: { radius: 160, gatherT: 0.9, accel: 2600, vmax: 600 },          // unicorn: cups around turn into unicorns and are drawn together
          venom: { radius: 120, shots: 3, maxTier: 0, pillarDmg: 3 },           // hydra: a pool that dissolves pawns for 3 shots, corrodes stone
          slowmo: { t: 0.7, k: 0.3 } },
  // Rune pillars (modes with pillars: true, i.e. Classic): fixed stones that cups bounce off. `count[lv]` = pillars on
  // the table at pressure level lv. Every merge's blast damages pillars within `blast[result tier]` units for
  // (result tier number) hp — knight 2 … king 6 — × (cups − 1) for clusters; a checkmate deals `hp` within CONFIG.shock.radius.
  // A broken pillar gives `breakBonus` points and is replaced `respawnShots` shots later.
  pillars: { hp: 10, r: 26, count: [0, 0, 1, 1, 2, 2], blast: [0, 110, 130, 150, 170, 190], breakBonus: 300, respawnShots: 3,
             area: { x0: 70, x1: 530, y0: 90, y1: 580 }, gapCup: 12, gapPillar: 170 },
  view: { TILT: 0.7, S_FAR: 0.78 },
  // Field items (16.0.0: three fantasy items; Inferno and Magnet were cut — Dragonfire and Holy Light cover them):
  // bag holds `slots`; Classic gives a random item every energyCost points. undo = Hourglass, wild = Polymorph Potion, upgrade = Coronation Oil.
  items: { slots: 2, energyCost: 800, upgradeMax: 3, defs: [{ id: 'undo' }, { id: 'wild' }, { id: 'upgrade' }] },
  // Equipment (armory): bought and upgraded with VP, up to `slots` worn, passive, Classic only, for the whole run.
  // cost[i] = VP for level i+1; val[i] = effect at level i+1. Opens after `unlockVP` VP earned in total.
  equip: { slots: 3, unlockVP: 150, defs: [
    { id: 'scale',   cost: [60, 120, 200], val: [0.4, 0.7, 1.0] },     // Dragon Scale Charm: +seconds before a cup in the line loses
    { id: 'grail',   cost: [80, 150, 240], val: [1.2, 1.35, 1.5] },    // Grail: ultimate charge ×
    { id: 'eye',     cost: [50, 110, 220], val: [1, 2, 3] },           // Seer's Eye: 1 longer aim arrow, 2 + landing ring, 3 full aim line
    { id: 'hammer',  cost: [50, 100, 160], val: [1.5, 2, 2.5] },       // Mason's Hammer: damage to pillars ×
    { id: 'scepter', cost: [70, 140, 220], val: [0.08, 0.14, 0.2] },   // King's Sceptre: + chance the next cup is a pawn
    { id: 'coin',    cost: [100, 200, 320], val: [1.2, 1.35, 1.5] },   // Lucky Coin: VP from the run ×
  ] },
  // Progressive unlocks (David, 16.0.0): items after chapter 1 level 6, ultimates after chapter 1, armory after equip.unlockVP total VP.
  unlocks: { itemsLevel: 5, ultsLevel: 7 },
  // Story (STORY.md): chapters with an opening card (before the chapter's first level, once) and a closing card (after its last level's
  // first clear). Text in STR 'story.ch<N>.open' / '.close'; Elden's line per level in 'lv.<id>.elden'; optional art/story/ch<N>.jpg.
  // unfinished: chapters still being built (only the opening card; the closing card comes with the chapter's last level).
  story: { chapters: [1, 2, 3, 4], unfinished: [] },
  // Chapter 3 (Gates of the Sun) level-only obstacles — never in Classic, so its physics and the golden baseline are untouched.
  //   sand: a cup whose centre is inside a level's sand patch slides with friction × `fric` (aim line included).
  //   sting: every `every` shots (level field sting: { every, first }) a random cup of tier ≥ minTier is stung; if it is not merged
  //          within `life` shots it drops one tier. Merging it (the new cup carries no mark) cures it. Own RNG: spawn order unchanged.
  //   guard: the twin guardian statues (level field guards: [[x, y, hp]]): pillars of radius `r` drawn as stone scorpion men (`kind`);
  //          a merge blast damages only the nearest guardian in range.
  sand: { fric: 4.8 },   // 18.0.x: doubled from 2.4 (David: sand felt too weak)
  sting: { life: 3, minTier: 1 },
  guard: { r: 40, kind: 6 },
  // Chapter 4 (The Drowned Capital) level-only obstacles — never in Classic, so its physics and the golden baseline are untouched.
  //   current: water bands (level field current: [[y, h, k]]: full-width band centred on y, half-height h; k = direction × strength,
  //            + pushes right, − left, 1 = normal, up to maxK = strong). A MOVING cup whose centre is inside gets accel × k px/s² sideways
  //            (its velocity) plus a drift of drift × k px/s straight to its position (velocity untouched, 18.0.x: David wanted currents
  //            twice as strong). Resting cups stay put. accel × maxK must stay below phys.A, so friction always wins and every cup comes
  //            to rest; the drift never changes velocity, so it cannot keep a cup moving. Aim line included.
  current: { accel: 300, maxK: 1.4, drift: 130 },
  //   hydra: the Hydra's heads (level field heads: [[x, y, hp]], goal 'heads'): targets of radius `r` drawn as stone hydra statues (`kind`).
  //          A merge blast (pillar rules) damages a head; at 0 hp it is CUT and grows back to full hp `regrow` shots later.
  //          Phoenix fire: if the finishing blast came from a chain (2nd+ merge of one shot), a cluster merge or a checkmate,

/* ───────── RNG (mulberry32, seeded → replays, daily challenge, tests)───────── */
function makeRng(seed) {
  let a = seed >>> 0;
  const f = function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  f.get = () => a; f.set = (v) => { a = v >>> 0; };   // state access (used by Undo)
  return f;
}

/* ───────── PHYSICS (pure functions; only touches the world, knows nothing about score or rules)───────── */
const Physics = (() => {
  const P = CONFIG.phys, Wd = CONFIG.world;
  function createWorld() { return { cups: [], pillars: [], sand: [], current: [], events: [], nextId: 0, acc: 0 }; }
  // level sand patches [x, y, rx, ry] (ellipses): friction factor at (x, y); 1 outside (and always 1 in Classic: no sand)
  const inSand = (sand, x, y) => sand.some(([sx, sy, rx, ry]) => ((x - sx) / rx) ** 2 + ((y - sy) / ry) ** 2 < 1);
  const sandK = (sand, x, y) => (sand && sand.length && inSand(sand, x, y) ? CONFIG.sand.fric : 1);
  // level water bands [y, h, k]: sideways push (px/s²) on a moving cup at height y; 0 outside (and always 0 in Classic: no currents)
  const currentK = (bands, y) => { if (bands) for (const [by, h, k] of bands) if (Math.abs(y - by) < h) return k; return 0; };
  const currentAt = (bands, y) => currentK(bands, y) * CONFIG.current.accel;
  const driftAt = (bands, y) => currentK(bands, y) * CONFIG.current.drift;        // px/s added to x while moving (velocity unchanged)
  function makeCup(world, kind, tier, x, y) {
    const T = CONFIG.tiers[tier], r = T.r;
    return { id: ++world.nextId, kind, tier, x, y, vx: 0, vy: 0, r, m: r * r * T.massK,
             fric: T.fric, bounce: T.bounce, held: false, pop: 0, dead: false };
  }
  const wallHit = (world, c, v) => { if (v > 60) world.events.push({ type: 'wall', v, x: c.x, y: c.y, id: c.id }); };
  function integrate(world, dt) {
    const W = Wd.W, H = Wd.H;
    for (const c of world.cups) {
      if (c.held || c.dead) continue;
      const sp = Math.hypot(c.vx, c.vy);
      if (sp > 0) {
        const fr = world.sand.length ? c.fric * sandK(world.sand, c.x, c.y) : c.fric;   // sand: levels only
        const sp2 = Math.max(0, sp - (P.A + P.K * sp) * fr * dt);
        if (sp2 < P.STOP) { c.vx = c.vy = 0; }
        else { const f = sp2 / sp; c.vx *= f; c.vy *= f; if (world.current.length) c.vx += currentAt(world.current, c.y) * dt; }   // currents: levels only
      }
      if (world.current.length && (c.vx || c.vy)) c.x += driftAt(world.current, c.y) * dt;   // currents: levels only; moving cups only
      c.x += c.vx * dt; c.y += c.vy * dt;
      if (c.x < c.r)     { c.x = c.r;     if (c.vx < 0) { wallHit(world, c, -c.vx); c.vx = -c.vx * P.EW * c.bounce; } }
      if (c.x > W - c.r) { c.x = W - c.r; if (c.vx > 0) { wallHit(world, c, c.vx); c.vx = -c.vx * P.EW * c.bounce; } }
      if (c.y < c.r)     { c.y = c.r;     if (c.vy < 0) { wallHit(world, c, -c.vy); c.vy = -c.vy * P.EW * c.bounce; } }
      if (c.y > H - c.r) { c.y = H - c.r; if (c.vy > 0) { wallHit(world, c, c.vy); c.vy = -c.vy * P.EW * c.bounce; } }
    }
  }
  // the pair a+b plus every matching cup touching the group (chained); wild cups match any creature
  // (two wilds take the creature of the first real cup that joins them)
  function clusterOf(world, a, b) {
    const group = [a, b], T = CONFIG.cluster.touch;
    let kind = a.wild && !b.wild ? b.kind : a.kind, open = a.wild && b.wild;
    const fits = (c) => !c.dead && !c.held && !c.stone && !group.includes(c) && c.tier === a.tier && (c.wild || open || c.kind === kind);
    for (let i = 0; i < group.length; i++) {
      const g = group[i];
      for (const c of world.cups) if (fits(c) && Math.hypot(c.x - g.x, c.y - g.y) < g.r + c.r + T) { group.push(c); if (open && !c.wild) { kind = c.kind; open = false; } }
    }
    return { group, kind };
  }
  function merge(world, a, b) {
    const { group, kind } = clusterOf(world, a, b);         // a wild cup becomes the other cup's creature
    let m = 0, x = 0, y = 0, vx = 0, vy = 0;
    for (const c of group) { c.dead = true; m += c.m; x += c.x * c.m; y += c.y * c.m; vx += c.vx * c.m; vy += c.vy * c.m; }
    x /= m; y /= m;
    const n = group.length, ids = group.map(c => c.id), from = group.map(c => ({ x: c.x, y: c.y }));
    if (a.tier === TOP) { world.events.push({ type: 'checkmate', kind, x, y, a: a.id, b: b.id, n, ids, from }); return; }
    const nc = makeCup(world, kind, a.tier + 1, x, y);
    nc.vx = vx / m; nc.vy = vy / m;

    for (const p of world.pillars) for (const c of world.cups) {
      if (c.dead || c.held) continue;
      const dx = c.x - p.x, dy = c.y - p.y, rr = c.r + p.r, d2 = dx * dx + dy * dy;
      if (d2 >= rr * rr) continue;
      const d = Math.sqrt(d2) || 0.0001, nx = dx / d, ny = dy / d;
      c.x = p.x + nx * rr; c.y = p.y + ny * rr;
      const vn = c.vx * nx + c.vy * ny;
      if (vn < 0) { if (-vn > 60) world.events.push({ type: 'wall', v: -vn, x: c.x, y: c.y, id: c.id, pillar: true }); const k = (1 + P.EW * c.bounce) * vn; c.vx -= k * nx; c.vy -= k * ny; }

    pts.bounces = [];                                          // wall-hit points (for the aim line's bounce markers)
    for (let i = 0; i < 480; i++) {
      const sp = Math.hypot(vel.x, vel.y);

      pos.x += (vel.x + driftAt(current, pos.y)) * dt; pos.y += vel.y * dt;

      if (pos.y < c.r)     { pos.y = c.r;     vel.y = Math.abs(vel.y) * P.EW * c.bounce; }
      if (pos.y > H - c.r) { pos.y = H - c.r; vel.y = -Math.abs(vel.y) * P.EW * c.bounce; }

/* ───────── MODES (mode objects: rule hooks such as what spawns and how you lose)───────── */
const Modes = {
  classic: {
    id: 'classic',
    danger: 'lose',            // a cup resting inside the line too long → lose
    assistForced: false,
    tracksBest: true,
    givesVP: true,
    hud: 'best',               // top-right HUD: 'best' best score | 'level' level number
    items: 'earn',             // items: 'earn' charged by scoring | 'fixed' set per level | 'free' unlimited | 'none'
    ults: 'charge',            // creature ultimates: 'charge' by merging | 'free' always ready | 'none'
    banner: null,              // on-screen mode label (i18n key)
    ramp: true,                // difficulty rises with score (see CONFIG.ramp)
    pillars: true,             // rune pillars appear as pressure rises (see CONFIG.pillars)
    pickNext(g) {              // same roll order as the prototype: tier first, then creature
      const t = g.rng(), cum = Game.spawnCum(g);
      let tier = cum.length; for (let i = 0; i < cum.length; i++) if (t < cum[i]) { tier = i; break; }
      return { kind: g.kinds[Math.floor(g.rng() * g.kinds.length)], tier };
    },
  },
  level: {
    id: 'level',
    danger: 'lose',
    assistForced: false,
    tracksBest: false,
    givesVP: false,            // Levels only pay the first-clear reward (Profile.clearLevel)
    hud: 'level',
    items: 'fixed',
    ults: 'none',
    banner: null,
    pickNext(g) { return Modes.classic.pickNext(g); },
  },
  practice: {
    id: 'practice',
    danger: 'fade',            // cups resting inside the line fade away; no losing
    assistForced: true,
    tracksBest: false,
    givesVP: false,
    hud: 'best',
    items: 'free',
    ults: 'free',
    banner: 'fx.practice',
    pickNext(g) { return Modes.classic.pickNext(g); },
  },
};

/* ───────── GAME (rules and state machine; no DOM)───────── */
const Game = (() => {
  const P = CONFIG.phys, R = CONFIG.rules, Wd = CONFIG.world;

  function create(opts) {
    opts = opts || {};
    const seed = opts.seed != null ? opts.seed >>> 0 : (Math.random() * 4294967296) >>> 0;
    const g = {
      seed, rng: makeRng(seed), kinds: [], nKinds: 1, kings: 0, kingKinds: [], level: null,
      mode: Modes[opts.mode || 'classic'], world: Physics.createWorld(),
      phase: 'ready',           // ready (waiting to launch) | flying (cups sliding) | over | won
      score: 0, shotMerges: 0, dangerT: 0, settleT: 0,
      held: null, next: null, drag: null, assist: false, banked: false, runs: 0,
      features: { items: true, ults: true }, eq: {},   // set by the app from the save: unlocked features, worn equipment {id: level}
    };
    setKinds(g, opts.kinds || Array.from({ length: Math.max(1, Math.min(CONFIG.kinds.filter(k => !k.finale).length, opts.nKinds || 1)) }, (_, i) => i));
    restart(g);
    return g;
  }
  function restart(g, seed) {
    if (seed != null) { g.seed = seed >>> 0; g.rng = makeRng(g.seed); }
    g.world = Physics.createWorld();
    g.shot = null; g.rampLv = 0; g.held = null; g.drag = null; g.score = 0; g.kings = 0; g.kingKinds = []; g.banked = false; g.shotMerges = 0; g.dangerT = 0; g.settleT = 0;
    const lv = levelOf(g);
    g.danger = lv ? (lv.danger || 'lose') : g.mode.danger; g.slots = (lv && lv.slots) || CONFIG.items.slots;
    g.shots = 0; g.prog = 0; g.stars = 0; g.endReason = null; g.lineY = Wd.LINE_Y;   // lineY: the danger line (rises in levels with rising water)
    g.ult = CONFIG.kinds.map(() => (g.mode.ults === 'free' ? CONFIG.ults.full : 0)); g.armed = null; g.proj = null; g.pools = []; g.gather = null;
    if (lv) {                                                        // fixed starting layout (same every time)
      for (const [k, t, x, y, f] of lv.cups || []) { const c = Physics.makeCup(g.world, k, t, x, y); if (f === 'stone') c.stone = true; g.world.cups.push(c); }
      for (const [x, y, hp] of lv.pillars || []) { const h = hp > 0 ? hp : Infinity; g.world.pillars.push({ id: 'p' + (g.world.nextId++), x, y, r: CONFIG.pillars.r, hp: h, max: h }); }   // hp 0 = unbreakable
      for (const [x, y, hp] of lv.guards || []) g.world.pillars.push({ id: 'g' + (g.world.nextId++), x, y, r: CONFIG.guard.r, hp, max: hp, guard: true });   // twin guardians
      for (const [x, y, hp] of lv.heads || []) g.world.pillars.push({ id: 'h' + (g.world.nextId++), x, y, r: CONFIG.hydra.r, hp, max: hp, head: true, cut: 0 });   // hydra heads
      g.world.sand = (lv.sand || []).map(s => s.slice());
      g.world.current = (lv.current || []).map(b => b.slice());
    }
    const im = g.mode.items;                                       // item state (own RNG, so spawn order is unaffected)
    g.items = (im === 'fixed' ? (lv.items || []) : []).slice(0, g.slots);
    g.energy = 0; g.itemsUsed = 0; g.snap = null;
    g.itemRng = makeRng((g.seed ^ 0x9E3779B9 ^ Math.imul(++g.runs, 0x85EBCA6B)) >>> 0);
    g.pillarRng = makeRng((g.seed ^ 0x51ED2701 ^ Math.imul(g.runs, 0x27D4EB2F)) >>> 0); g.pillarWait = 0;   // own RNG: spawn order unaffected
    g.stingRng = makeRng((g.seed ^ 0x2C1B3C6D ^ Math.imul(g.runs, 0x165667B1)) >>> 0);                       // stingers: own RNG too
    g.next = g.mode.pickNext(g);
    spawn(g);
  }
  function spawn(g, out) {
    if (g.pools && g.pools.length) tickPools(g, out || []);
    const lv = levelOf(g); if (lv && lv.sting) stingTick(g, lv.sting, out || []);
    if (lv && lv.heads) regrowTick(g, out || []);
    if (lv && lv.rise) riseTick(g, out || []);
    if (g.mode.pillars) placePillars(g, out);
    const c = Physics.makeCup(g.world, g.next.kind, g.next.tier, Wd.SPAWN.x, Wd.SPAWN.y);
    c.held = true; g.world.cups.push(c); g.held = c;
    g.next = g.mode.pickNext(g);
    g.phase = 'ready';
  }
  const levelOf = (g) => (g.level != null ? CONFIG.levels[g.level] : null);
  function setMode(g, id) { g.mode = Modes[id]; g.level = null; restart(g); }
  // Replay: Levels replay the same level; other modes restart with the given creatures
  function rematch(g, kinds) { if (g.level != null) startLevel(g, g.level); else { setKinds(g, kinds); restart(g); } }
  function startLevel(g, idx) {
    g.mode = Modes.level; g.level = idx; setKinds(g, CONFIG.levels[idx].kinds); restart(g);
  }
  // creatures used this run (index array); takes effect on restart
  function setKinds(g, arr) {
    const k = [...new Set(arr)].filter(i => Number.isInteger(i) && i >= 0 && i < CONFIG.kinds.length).sort((a, b) => a - b);
    g.kinds = k.length ? k : [0]; g.nKinds = g.kinds.length;
  }
  // VP earned this run (0 in Practice)
  function vp(g) {
    if (!g.mode.givesVP) return { fromScore: 0, fromKings: 0, total: 0 };
    const fromScore = Math.floor(g.score / CONFIG.vp.perScore), fromKings = g.kings * CONFIG.vp.kingBonus, coin = eqVal(g, 'coin') || 1;   // Lucky Coin
    return { fromScore, fromKings, total: Math.round((fromScore + fromKings) * coin) };
  }
  const assistOn = (g) => g.assist || g.mode.assistForced || (eqVal(g, 'eye') || 0) >= 3;   // Seer's Eye level 3 = full aim line

  /* ── Checkmate shockwave: push nearby cups outward; shatter nearby pawns ── */
  function shockwave(g, ev, out) {
    const S = CONFIG.shock;
    for (const c of g.world.cups) {
      if (c.held || c.dead) continue;
      const dx = c.x - ev.x, dy = c.y - ev.y, d = Math.hypot(dx, dy);
      if (d >= S.radius) continue;
      if (c.tier === 0 && d < S.shatter) { c.dead = true; out.push({ type: 'shatter', x: c.x, y: c.y, kind: c.kind }); continue; }
      const v = S.push * (1 - d / S.radius), nx = d > 1e-3 ? dx / d : 0, ny = d > 1e-3 ? dy / d : -1;
      c.vx += nx * v; c.vy += ny * v;
    }
    g.world.cups = g.world.cups.filter(c => !c.dead);
    if (g.phase === 'ready' || g.phase === 'flying') { g.phase = g.held ? g.phase : 'flying'; g.settleT = 0; }
    out.push({ type: 'shockwave', x: ev.x, y: ev.y });
  }

  /* ── Rune pillars ── */
  const PL = CONFIG.pillars;
  function placePillars(g, out) {
    const w = g.world, want = PL.count[Math.min(PL.count.length - 1, rampLevel(g))];
    if (g.pillarWait > 0) { g.pillarWait--; return; }
    while (w.pillars.length < want) {
      let spot = null;
      for (let i = 0; i < 40 && !spot; i++) {
        const x = PL.area.x0 + g.pillarRng() * (PL.area.x1 - PL.area.x0), y = PL.area.y0 + g.pillarRng() * (PL.area.y1 - PL.area.y0);
        if (w.cups.some(c => Math.hypot(c.x - x, c.y - y) < c.r + PL.r + PL.gapCup)) continue;
        if (w.pillars.some(p => Math.hypot(p.x - x, p.y - y) < PL.gapPillar)) continue;
        spot = { x, y };
      }
      if (!spot) return;                                        // table too full: try again next shot
      const p = { id: 'p' + (w.nextId++), x: spot.x, y: spot.y, r: PL.r, hp: PL.hp, max: PL.hp };
      w.pillars.push(p); if (out) out.push({ type: 'pillar', x: p.x, y: p.y, id: p.id });
    }
  }
  // free petrified cups within `radius` of (x, y)
  function blastStones(g, x, y, radius, out) {
    for (const c of g.world.cups) if (c.stone && !c.dead && Math.hypot(c.x - x, c.y - y) < radius + c.r) { c.stone = false; out.push({ type: 'unstone', x: c.x, y: c.y, id: c.id, kind: c.kind }); }
  }
  // damage pillars within `radius` of (x, y); broken ones give a bonus and start the respawn wait.
  // Twin guardians (p.guard): only the nearest guardian in range is hit.
  // Hydra heads (p.head): at 0 hp a head is cut (grows back) — or burned for good when `fire` (chain, cluster, checkmate); fire also burns cut stumps.
  function blastPillars(g, x, y, radius, dmg, out, bonus, fire) {
    const w = g.world; if (!w.pillars.length || dmg <= 0) return;
    dmg = Math.round(dmg * (eqVal(g, 'hammer') || 1));                 // Mason's Hammer
    const inRange = (p) => isFinite(p.hp) && Math.hypot(p.x - x, p.y - y) < radius + p.r;   // unbreakable pillars ignore blasts
    const guard = w.pillars.filter(p => p.guard && inRange(p)).sort((a, b) => Math.hypot(a.x - x, a.y - y) - Math.hypot(b.x - x, b.y - y))[0];
    for (const p of w.pillars) {
      if (!inRange(p) || (p.guard && p !== guard)) continue;
      if (p.head) { hitHead(g, p, dmg, out, bonus, fire); continue; }
      p.hp = Math.max(0, p.hp - dmg);
      out.push({ type: 'pillarhit', x: p.x, y: p.y, id: p.id, dmg, hp: p.hp, guard: !!p.guard });
      if (p.hp === 0) { out.push({ type: 'pillarbreak', x: p.x, y: p.y, id: p.id, guard: !!p.guard }); if (bonus) bonus('pillar', PL.breakBonus, p.x, p.y); g.pillarWait = PL.respawnShots; }
    }
    w.pillars = w.pillars.filter(p => p.hp > 0 || (p.head && !p.burned));
  }

  /* ── Hydra heads (chapter 4): cut heads grow back; Phoenix fire (chain / cluster / checkmate) burns them for good ── */
  const HY = CONFIG.hydra;
  function hitHead(g, p, dmg, out, bonus, fire) {
    if (p.cut > 0) { if (fire) burnHead(p, out, bonus); return; }       // a stump: only fire matters
    p.hp = Math.max(0, p.hp - dmg);
    out.push({ type: 'pillarhit', x: p.x, y: p.y, id: p.id, dmg, hp: p.hp, head: true });
    if (p.hp > 0) return;
    if (fire) burnHead(p, out, bonus);
    else { p.cut = HY.regrow; out.push({ type: 'headcut', x: p.x, y: p.y, id: p.id, regrow: p.cut }); }
  }
  function burnHead(p, out, bonus) {
    p.burned = true; p.hp = 0; p.cut = 0; out.push({ type: 'headburn', x: p.x, y: p.y, id: p.id });
    if (bonus) bonus('pillar', PL.breakBonus, p.x, p.y);
  }
  function regrowTick(g, out) {                                 // between shots: cut heads count down, then grow back at full health
    for (const p of g.world.pillars) if (p.head && p.cut > 0 && --p.cut === 0) { p.hp = p.max; out.push({ type: 'headgrow', x: p.x, y: p.y, id: p.id }); }
  }
  /* ── Rising water (chapter 4 boss): the danger line climbs every few shots, up to a cap ── */
  const RI = CONFIG.rise;
  function riseTick(g, out) {
    if (!g.shots || g.shots % RI.every || g.lineY <= Wd.LINE_Y - RI.max) return;
    g.lineY = Math.max(Wd.LINE_Y - RI.max, g.lineY - RI.step); out.push({ type: 'rise', y: g.lineY });
  }

  /* ── Stingers (chapter 3): marked cups drop a tier unless merged in time ── */
  const ST = CONFIG.sting;
  // between shots: count down stung cups (dropping those at 0), then sting a new cup every `every` shots from shot `first`
  function stingTick(g, S, out) {
    const w = g.world;
    w.cups = w.cups.map(c => {
      if (!c.sting || c.dead || --c.sting > 0) return c;
      const n = Physics.makeCup(w, c.kind, Math.max(0, c.tier - 1), c.x, c.y); n.pop = 1;   // stung cups are tier ≥ 1, so a drop never removes one
      out.push({ type: 'stingdrop', x: n.x, y: n.y, id: n.id, old: c.id, kind: n.kind, tier: n.tier });
      return n;
    });
    if (g.shots < S.first || (g.shots - S.first) % S.every) return;

    if (!pool.length) return;
    const c = pool[Math.floor(g.stingRng() * pool.length)]; c.sting = ST.life;
    const from = w.pillars.filter(p => p.guard).sort((a, b) => Math.hypot(a.x - c.x, a.y - c.y) - Math.hypot(b.x - c.x, b.y - c.y))[0];   // the nearer guardian stings; else from the far edge
    out.push({ type: 'sting', x: c.x, y: c.y, id: c.id, kind: c.kind, tier: c.tier, from: from ? { x: from.x, y: from.y } : { x: c.x, y: 0 } });
  }

  /* ── Equipment (passive, Classic only) ── */
  const EQ = CONFIG.equip;
  // effect value of worn equipment `id` (null when not worn or not Classic)
  function eqVal(g, id) {
    const lv = g.mode.id === 'classic' ? g.eq[id] || 0 : 0; if (!lv) return null;
    return EQ.defs.find(d => d.id === id).val[lv - 1];
  }
  const setFeatures = (g, f) => { g.features = { items: !!f.items, ults: !!f.ults }; };
  const setEquip = (g, eq) => { g.eq = Object.assign({}, eq || {}); };

  /* ── Creature ultimates ── */
  const U = CONFIG.ults;
  const ultOf = (k) => U.kinds[k] || null;
  const ultKinds = (g) => (g.features.ults && g.mode.ults && g.mode.ults !== 'none' ? g.kinds.filter(ultOf) : []);   // portraits shown in the tray
  const ultReady = (g, k) => ultKinds(g).includes(k) && g.ult[k] >= U.full;
  // tap a portrait: arm (enchant the held cup) or disarm; returns events or null
  function armUlt(g, k) {
    if (g.phase !== 'ready' || !g.held || g.drag) return null;

  const VERSION = 9, NK = CONFIG.kinds.length, NL = CONFIG.levels.length;
  const NB = CONFIG.kinds.filter(k => !k.finale).length, CHIMERA = CONFIG.kinds.findIndex(k => k.finale);   // creatures 0..NB-1 are bought with VP in order; the finale creature only by clearing the finale
  const fresh = (best) => ({ v: VERSION, best: { classic: best || 0, classicItems: 0 }, vp: 0, unlocked: [0, 1], active: [0], cleared: [], stars: Array(NL).fill(0), equip: {}, worn: [], vpEarned: 0, ack: [], story: [], finaleCleared: false, lang: 'en', sound: true, seen: [0, 0, ...Array(NK - 2).fill(-1)] });   // seen[k] = highest tier reached (-1 = none), for the codex
  const nat = (x) => (Number.isFinite(x) && x >= 0 ? Math.floor(x) : 0);
  const uniq = (arr, ok) => [...new Set((Array.isArray(arr) ? arr : []).filter(i => Number.isInteger(i) && i >= 0 && ok(i)))].sort((a, b) => a - b);
  // turn any input (old, broken, edited) into a valid current save; unknown fields are dropped
  function migrate(raw, legacyBest) {
    if (!raw || typeof raw !== 'object') return fresh(legacyBest);
    const p = fresh(0);
    p.best.classic = nat(raw.best && raw.best.classic); p.best.classicItems = nat(raw.best && raw.best.classicItems);
    p.vp = nat(raw.vp);
    const LEGACY_CARRY = { sweep: 20, upgrade: 10, wild: 10, magnet: 10, undo: 6 };   // v≤6 packed item → refunded (equipment replaced it)
    if (!(raw.v >= 7) && LEGACY_CARRY[raw.carry]) p.vp += LEGACY_CARRY[raw.carry];
    const n = Math.max(2, Math.min(NB, uniq(raw.unlocked, i => i < NB).length));   // VP unlocks are sequential: always [0..n-1], at least 2
    p.finaleCleared = raw.v >= 9 && raw.finaleCleared === true;                      // v9: the finale creature joins only after the finale
    p.unlocked = Array.from({ length: n }, (_, i) => i).concat(p.finaleCleared && CHIMERA >= 0 ? [CHIMERA] : []);
    const act = uniq(raw.active, i => p.unlocked.includes(i)); p.active = act.length ? act : [0];
    if (!(raw.v >= 6)) {                                        // v≤5 had 3 levels: old 1 → new 1; old 2 or 3 → the whole tutorial chapter
      const old = Array.isArray(raw.cleared) ? raw.cleared : [];
      p.cleared = old.includes(1) || old.includes(2) ? CONFIG.levels.map((L, i) => i).filter(i => CONFIG.levels[i].chapter === 1) : old.includes(0) ? [0] : [];
      p.stars = CONFIG.levels.map((L, i) => (p.cleared.includes(i) ? 1 : 0));
    } else {
      p.cleared = uniq(raw.cleared, i => i < NL);
      const st = Array.isArray(raw.stars) ? raw.stars : [];
      p.stars = CONFIG.levels.map((L, i) => (p.cleared.includes(i) ? Math.max(1, Math.min(3, Number.isInteger(st[i]) ? st[i] : 1)) : 0));
    }
    p.lang = raw.lang === 'zh' ? 'zh' : 'en';
    p.sound = raw.sound !== false;
    const eq = raw.equip && typeof raw.equip === 'object' ? raw.equip : {};    // v7: equipment levels, worn list, lifetime VP, seen unlock notices
    for (const d of CONFIG.equip.defs) { const l = nat(eq[d.id]); if (l) p.equip[d.id] = Math.min(l, d.cost.length); }
    p.worn = [...new Set(Array.isArray(raw.worn) ? raw.worn : [])].filter(id => p.equip[id]).slice(0, CONFIG.equip.slots);
    p.vpEarned = raw.v >= 7 ? nat(raw.vpEarned) : p.vp + p.unlocked.reduce((a, i) => a + (CONFIG.vp.unlockCost[i] || 0), 0);   // older saves: estimate from VP held + spent
    p.ack = [...new Set(Array.isArray(raw.ack) ? raw.ack : [])].filter(f => ['items', 'ults', 'equip'].includes(f));
    const ids = storyIds(); p.story = [...new Set(Array.isArray(raw.story) ? raw.story : [])].filter(id => ids.includes(id));   // v8: story cards already read
    const seen = Array.isArray(raw.seen) ? raw.seen : [];       // v5; older saves start with every unlocked creature's pawn
    p.seen = Array.from({ length: NK }, (_, i) => { const v = Number.isInteger(seen[i]) ? Math.min(Math.max(seen[i], -1), CONFIG.tiers.length - 1) : -1; return p.unlocked.includes(i) ? Math.max(v, 0) : i === CHIMERA ? -1 : v; });   // a locked finale creature cannot have been seen
    return p;
  }
  const bought = (p) => p.unlocked.filter(i => i < NB).length;
  const nextLockedKind = (p) => (bought(p) < NB ? bought(p) : -1);   // never the finale creature
  function buy(p, i) {                                    // unlock the next creature; returns success
    const cost = CONFIG.vp.unlockCost[i];
    if (i !== bought(p) || i >= NB || !(cost >= 0) || p.vp < cost) return false;
    p.vp -= cost; p.unlocked.push(i); p.unlocked.sort((a, b) => a - b); p.seen[i] = Math.max(p.seen[i], 0); return true;
  }
  // clearing the finale: the finale creature joins (not reachable in play until the finale exists); returns true the first time
  function unlockChimera(p) {
    if (CHIMERA < 0 || p.finaleCleared) return false;
    p.finaleCleared = true; p.unlocked.push(CHIMERA); p.unlocked.sort((a, b) => a - b); p.seen[CHIMERA] = Math.max(p.seen[CHIMERA], 0); return true;
  }
  function toggleKind(p, i) {                             // add/remove a creature for the next run (keep at least 1)
    if (!p.unlocked.includes(i)) return false;
    const at = p.active.indexOf(i);
    if (at >= 0) { if (p.active.length === 1) return false; p.active.splice(at, 1); }
    else { p.active.push(i); p.active.sort((a, b) => a - b); }
    return true;
  }
  const levelOpen = (p, i) => i === 0 || p.cleared.includes(i - 1);
  /* story cards: ids 'ch<N>.open' / 'ch<N>.close' */
  function storyIds() { return CONFIG.story.chapters.flatMap(c => ['ch' + c + '.open'].concat((CONFIG.story.unfinished || []).includes(c) ? [] : ['ch' + c + '.close'])); }
  const chapterLevels = (c) => CONFIG.levels.map((L, i) => i).filter(i => CONFIG.levels[i].chapter === c);
  function storyBefore(p, idx) {                          // opening card to show before level idx's briefing (first level of a chapter, not read yet), or null
    const L = CONFIG.levels[idx]; if (!L || !CONFIG.story.chapters.includes(L.chapter) || chapterLevels(L.chapter)[0] !== idx) return null;
    const id = 'ch' + L.chapter + '.open'; return p.story.includes(id) ? null : id;
  }
  function storyAfter(p, idx) {                           // closing card after level idx is cleared (last level of a chapter, not read yet), or null
    const L = CONFIG.levels[idx]; if (!L || !CONFIG.story.chapters.includes(L.chapter) || chapterLevels(L.chapter).slice(-1)[0] !== idx || !p.cleared.includes(idx)) return null;
    const id = 'ch' + L.chapter + '.close'; return p.story.includes(id) || !storyIds().includes(id) ? null : id;
  }
  function readStory(p, id) { if (!storyIds().includes(id) || p.story.includes(id)) return false; p.story.push(id); return true; }
  // level cleared with `stars` (1–3); returns VP gained: reward on first clear + starBonus per newly earned star
  function clearLevel(p, idx, stars) {
    stars = Math.max(1, Math.min(3, stars || 1));
    let r = 0;
    if (!p.cleared.includes(idx)) { p.cleared.push(idx); p.cleared.sort((a, b) => a - b); r += CONFIG.levels[idx].reward; }
    const prev = p.stars[idx] || 0;
    if (stars > prev) { r += (stars - Math.max(prev, 1)) * CONFIG.vp.starBonus; p.stars[idx] = stars; }
    p.vp += r; p.vpEarned += r; return r;
  }
  const bestKey = (g) => (g.mode.id === 'classic' && g.itemsUsed > 0 ? 'classicItems' : g.mode.id);   // runs that used items keep a separate best
  function recordBest(p, g) {                             // returns whether it's a new best
    const k = bestKey(g);
    if (!g.mode.tracksBest || g.score <= (p.best[k] || 0)) return false;
    p.best[k] = g.score; return true;
  }
  /* equipment */
  const eqDef = (id) => CONFIG.equip.defs.find(d => d.id === id);
  const eqNextCost = (p, id) => { const d = eqDef(id), l = p.equip[id] || 0; return d && l < d.cost.length ? d.cost[l] : null; };
  function buyEquip(p, id) {                              // buy level 1 or upgrade; returns success
    const c = eqNextCost(p, id); if (c == null || p.vp < c) return false;
    p.vp -= c; p.equip[id] = (p.equip[id] || 0) + 1; return true;
  }
  function toggleWear(p, id) {                            // wear / take off (owned only, up to equip.slots)
    if (!p.equip[id]) return false;
    const at = p.worn.indexOf(id);
    if (at >= 0) { p.worn.splice(at, 1); return true; }
    if (p.worn.length >= CONFIG.equip.slots) return false;
    p.worn.push(id); return true;
  }
  const wornLevels = (p) => Object.fromEntries(p.worn.map(id => [id, p.equip[id]]));
  /* progressive unlocks */
  function features(p) {
    const U = CONFIG.unlocks;
    return { items: p.cleared.includes(U.itemsLevel), ults: p.cleared.includes(U.ultsLevel), equip: p.vpEarned >= CONFIG.equip.unlockVP };
  }
  const newFeatures = (p) => Object.entries(features(p)).filter(([f, on]) => on && !p.ack.includes(f)).map(([f]) => f);
  function ackFeature(p, f) { if (!p.ack.includes(f)) p.ack.push(f); }
  function bankRun(p, g) {                                // bank this run's VP (once per run; 0 in Levels)
    if (g.banked) return { fromScore: 0, fromKings: 0, total: 0 };
    g.banked = true; const v = Game.vp(g); p.vp += v.total; p.vpEarned += v.total; return v;
  }
  const finishRun = (p, g) => ({ newBest: recordBest(p, g), vp: bankRun(p, g) });
  const setLang = (p, lang) => { p.lang = lang === 'zh' ? 'zh' : 'en'; };
  const toggleSound = (p) => { p.sound = p.sound === false; };
  function see(p, kind, tier) { if (!(kind >= 0 && kind < NK) || tier <= p.seen[kind] || (kind === CHIMERA && !p.finaleCleared)) return false; p.seen[kind] = tier; return true; }   // returns true for a new codex entry
  const discovered = (p) => p.seen.reduce((n, v) => n + v + 1, 0);

  /* ── Backup codes: "SC1.<base64url JSON>.<checksum>" — copy anywhere, paste back to restore ── */
  const CODE = 'SC1';
  const hash = (str) => { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } return h.toString(36); };
  const b64 = (str) => btoa(str).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  const unb64 = (str) => { str = str.replace(/-/g, '+').replace(/_/g, '/'); while (str.length % 4) str += '='; return atob(str); };
  function exportCode(p) { const json = JSON.stringify(migrate(JSON.parse(JSON.stringify(p)))); return CODE + '.' + b64(json) + '.' + hash(json); }
  // returns { ok: true, profile } or { ok: false, error: 'empty' | 'format' | 'checksum' }
  function importCode(code) {
    const c = String(code || '').replace(/\s+/g, '');
    if (!c) return { ok: false, error: 'empty' };
    const parts = c.split('.');
    if (parts.length !== 3 || parts[0] !== CODE) return { ok: false, error: 'format' };
    let json; try { json = unb64(parts[1]); } catch (e) { return { ok: false, error: 'format' }; }
    if (hash(json) !== parts[2]) return { ok: false, error: 'checksum' };
    let raw; try { raw = JSON.parse(json); } catch (e) { return { ok: false, error: 'format' }; }
    if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return { ok: false, error: 'format' };
    return { ok: true, profile: migrate(raw) };
  }

})();

    'story.ch1.open': 'The bells of the keep are silent. Of all the knights of the Grail, only you still hold a cup. Old Elden lights one torch in the courtyard. "The Grail does not choose the strong," he says. "It chooses those who learn. Begin."',
    'story.ch1.close': 'The two kings meet, and for one breath the courtyard is bright as noon. Then a rider falls through the gate, half of him already grey stone. "The east," he whispers. "The marsh. They are all stone." The dragon on the wall lifts its head. Elden nods. "It will go with you."',
    'lv.first.elden': 'Every king was once a pawn. So were you.',
    'lv.line.elden': 'The line is the castle wall. What stays behind it is lost.',
    'lv.bank.elden': 'When the road is blocked, the wise knight takes the wall.',
    'lv.chain.elden': 'One deed, done well, wakes the next.',
    'lv.cluster.elden': 'Alone they are cups. Together they are an army.',
    'lv.items.elden': 'The old armory still holds a few gifts. Use them wisely.',
    'lv.pillars.elden': 'Runes cannot be argued with. They can be broken.',
    'lv.checkmate.elden': 'Two kings, one board. Show me what the Grail sees in you.',
    'story.ch2.open': 'Statues line the marsh road: knights frozen mid-stride, shields still raised. A white unicorn stands among them, pressing its horn to the stone, and the stone grows warm. "It cannot free them alone," says Elden. "But a blast of the Grail\'s power can. Every merge you make near them will crack their prison."',
    'story.ch2.close': 'The last stone falls, and the Basilisk lowers its head. Burned into its brow is a mark of three heads, a lion, a goat and a serpent, still smoking. Elden goes pale. "The king\'s rite," he says. "So it is true. Something sits on the Grail Throne." Far to the south, the sky stays black at noon.',
    'lv.gaze.elden': 'Do not meet its eyes. Meet its victims, and set them free.',
    'lv.maze.elden': 'The Basilisk built this maze from the bones of the old temple. Walls bounce.',
    'lv.crowd.elden': 'So many stand frozen here. Make room, and they will march again.',
    'lv.domino.elden': 'One push at the bottom of the hill can topple a tower.',
    'lv.siege.elden': 'Its nest is walled in rune-stone. We go through, not around.',
    'lv.twins.elden': 'Two thrones, two crowns. The Grail wants both.',
    'lv.precise.elden': 'We are close. It can hear us breathe. Waste nothing.',
    'lv.basilisk.elden': 'Look at its brow. That brand is not its own. Free it.',
    'story.ch3.open': 'For a year the sun has not risen. A griffin finds you at the edge of the dunes and kneels. Beyond the sand stands Mount Mashu, and at its foot two scorpion guardians, man above and scorpion below, who have kept the Gate of the Sun since the first dawn. "They were the most loyal of all," Elden says. "That is why the Chimera wanted them."',
    'story.ch3.close': 'The twin guardians fall to their knees, and the brand on their shells cracks. Together they heave the Gate open. Light pours across the desert, the first sunrise in a year. Their eyes are clear now, and full of shame. "The beast drinks from the old capital," they say. "The Hydra guards the only road to the throne, and the city is under water."',
    'lv.dunes.elden': 'Sand eats your strength. Flick harder.',
    'lv.obelisk.elden': 'The pilgrims\' markers still stand. Turn on them.',
    'lv.quicksand.elden': 'The most dangerous ground hides the best chances.',
    'lv.pilgrims.elden': 'The Basilisk is not the only thing that turns men to stone. Sand does too.',
    'lv.stingers.elden': 'A stung cup will not last. Save it first.',
    'lv.camp.elden': 'Their poison is everywhere. Gather it and end it at once.',
    'lv.silence.elden': 'The Gate is ahead. Waste nothing.',
    'lv.guardians.elden': 'They have stood side by side for a thousand years. Face them both.',
    'lv.dunes.name': 'Night Dunes', 'lv.dunes.tip': 'Sandy patches slow every cup that crosses them. Flick harder to get through.',
    'lv.obelisk.name': 'Obelisk Road', 'lv.obelisk.tip': 'The obelisks never break. Bounce off them or off a wall — both count as bank shots.',
    'lv.quicksand.name': 'Quicksand Pit', 'lv.quicksand.tip': 'The best targets sit in the sand. Hit the pawn hard enough that the new knight still reaches its twin.',
    'lv.pilgrims.name': 'Buried Pilgrims', 'lv.pilgrims.tip': 'Pilgrims lie turned to stone. Merge right next to a grey cup to free it.',
    'lv.stingers.name': 'Stingers', 'lv.stingers.tip': 'A stung cup shows a countdown. Merge it before it runs out, or it drops one tier.',
    'lv.camp.name': 'Scorpion Camp', 'lv.camp.tip': 'A crowded camp, stingers and sand. Throw into a matching pair to merge three at once — and keep the line clear.',
    'lv.silence.name': 'Silence Before the Gate', 'lv.silence.tip': 'Eight shots, sand everywhere. The pieces are lined up for a queen — one good chain does it.',
    'lv.guardians.name': 'Boss: The Twin Guardians', 'lv.guardians.tip': 'Two guardian statues, each with its own health. A merge only damages the nearer one. Every few shots they sting a cup.',
    'goal.free': 'Free stone cups', 'goal.guardians': 'Break both guardians', 'fx.sting': 'Stung!', 'fx.stingdrop': 'Poison! −1 tier',

    'chapter.4': 'Chapter 4 · The Drowned Capital',
    'story.ch4.open': 'Under the black lake lies Aurelia, the old capital. Its towers still stand beneath the water, and its bells ring when the current moves them. In the lighthouse on the last dry rock, a phoenix burns low, almost out. "The Hydra floods the city to keep us from the throne," Elden says. "Cut one head and two return. You must end each fight in a single stroke."',
    'lv.lighthouse.elden': 'Her flame is fading. Every merge you make makes it stronger.',
    'lv.streets.elden': 'The waterways still remember the roads. Let them carry you.',
    'lv.market.elden': 'Even sunk beneath the water, a market still has a bargain. Find the pair that pays twice.',
    'lv.belltower.elden': 'Ring the bells. Let the whole city know: we have come.',
    'lv.cathedral.elden': 'These knights knelt to pray and never rose. Restore them to their old glory.',
    'lv.lighthouse.name': 'Lighthouse Rock', 'lv.lighthouse.tip': 'The blue water bands push every moving piece sideways, in the direction of the arrows. Aim a little upstream.',
    'lv.streets.name': 'Sunken Streets', 'lv.streets.tip': 'Two currents flow in opposite directions. Bounce off a wall or a ruined tower and let the water carry you to the pair.',
    'lv.market.name': 'Market Under Water', 'lv.market.tip': 'The pairs sit beyond a strong current. Aim upstream so the pawn reaches its twin — the new knight finishes the chain.',
    'lv.belltower.name': 'The Bell Tower', 'lv.belltower.tip': 'The bell pillars stand in the current. Merge next to them to crack them — three must fall.',
    'lv.cathedral.name': 'The Drowned Cathedral', 'lv.cathedral.tip': 'Knights of stone kneel in the water. Merge right next to a grey piece to free it.',
    'brief.current': '🌊 Currents: water bands push moving pieces sideways — aim upstream',
    'story.ch4.close': 'The last head sinks, and the Hydra\'s coils loosen around the tower. The brand fades from its scales and the lake begins to drain. The Phoenix flares bright and lets fall a single burning feather. "The Rebirth Feather," whispers Elden. "What it touches returns to what it was. Now we climb."',
    'lv.firsthead.elden': 'Cut it once and it grows back. Burn it away, and it will never grow again.',
    'lv.stair.elden': 'The stair is narrow and the water is fast. Strike with all your strength.',
    'lv.hydra.elden': 'Three heads, one heart. Burn them, and burn the brand with them.',
    'lv.firsthead.name': 'The First Head', 'lv.firsthead.tip': 'A merge next to the head cuts it, but a cut head grows back. Finish it with a chain or a cluster merge: the Phoenix\'s fire burns it for good.',

/* ───────── Sfx (Web Audio synthesis, no audio files; iOS needs a first tap before sound)───────── */
const Sfx = (() => {
  let ac = null, master = null, noiseBuf = null;
  const lastAt = {}, stats = {};
  const enabled = () => save.sound !== false;
  function unlock() {
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}   // iOS: play even with the mute switch on
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      ac = new AC(); master = ac.createGain(); master.gain.value = 0.55;
      const comp = ac.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 6; comp.attack.value = 0.003; comp.release.value = 0.15;
      master.connect(comp); comp.connect(ac.destination);       // compressor: many simultaneous hits don't clip
      noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ac.state === 'suspended') ac.resume();
  }
  const suspend = () => { if (ac && ac.state === 'running') ac.suspend(); };
  // one tone: pitch glides f0 → f1, fast attack, exponential decay
  function tone(f0, f1, dur, type, vol, delay) {
    const t0 = ac.currentTime + (delay || 0), o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t0 + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + dur + 0.02);
  }
  function noise(dur, vol, f0, f1, delay) {
    const t0 = ac.currentTime + (delay || 0), src = ac.createBufferSource(), flt = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = noiseBuf; flt.type = 'bandpass'; flt.Q.value = 1.2;
    flt.frequency.setValueAtTime(f0, t0); flt.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(flt); flt.connect(g); g.connect(master); src.start(t0); src.stop(t0 + dur + 0.02);
  }
  // stone impact: a low 'thunk' body (fast decay, no long ringing highs — that's glass/metal)
  // + a burst of low-passed noise for grit + a tiny click. Bigger size (bigger cup) = lower, duller, longer.
  function stone(f, vol, size, delay) {
    const d = delay || 0, len = 0.07 + size * 0.025, det = 1 + (Math.random() - 0.5) * 0.08;
    tone(f * det * 1.25, f * det * 0.6, len, 'sine', vol, d);                 // body: dull thud with a fast pitch drop
    tone(f * det * 2.1, f * det * 1.3, len * 0.55, 'triangle', vol * 0.4, d); // overtone: decays quickly, makes it feel solid
    noise(0.045 + size * 0.01, vol * 0.7, 1300, 450, d);                      // grit: low-mid noise
    noise(0.01, vol * 0.18, 3200, 2200, d);                                   // surface click (very quiet)
  }
  const note = (semi) => 523.25 * Math.pow(2, semi / 12);            // based on C5
  const SCALE = [0, 2, 4, 7, 9, 12];                                  // pentatonic: higher from pawn to king
  const sounds = {
    hit(ev) {                                                       // stone on stone: one sound per cup (bigger = deeper), volume by impact speed
      const k = Math.min(1, ev.v / 1400), vol = 0.5 * (0.3 + 0.7 * k);

      tone(70, 40, 0.12, 'sine', 0.45 * k);                                   // heavy low-frequency hit
    },
    wall(v) { const k = Math.min(1, v / 1500); stone(130, 0.4 * (0.35 + 0.65 * k), 3); tone(60, 38, 0.1, 'sine', 0.35 * k); },
    launch(v) { noise(0.28, 0.12 + Math.min(1, v / 3000) * 0.3, 500, 1800); },
    merge(tier, combo) {

    spawn() { tone(500, 720, 0.06, 'sine', 0.1); },
    fade() { tone(420, 200, 0.12, 'sine', 0.08); },
    gameover() { [392, 330, 262].forEach((f, i) => tone(f, f * 0.97, 0.35, 'triangle', 0.25, i * 0.18)); },
    levelclear() { [-5, 0, 4, 7, 12].forEach((n, i) => tone(note(n), note(n), 0.32, 'triangle', 0.3, i * 0.1)); },
    click() { tone(900, 700, 0.03, 'square', 0.05); },
    bonus() { [7, 12].forEach((n, i) => tone(note(n + 12), note(n + 12), 0.16, 'triangle', 0.22, i * 0.06)); },
    rampup() { [0, 6].forEach((n, i) => tone(note(n - 5), note(n - 5), 0.3, 'sawtooth', 0.12, i * 0.16)); },
    shockwave() { stone(60, 0.8, 5); tone(55, 30, 0.6, 'sine', 0.5); noise(0.6, 0.3, 900, 120); },
    shatter() { noise(0.12, 0.2, 2600, 900); },
    itemget() { [0, 7, 12].forEach((n, i) => tone(note(n + 12), note(n + 12), 0.22, 'sine', 0.2, i * 0.07)); },
    fire() {                                                   // roar + crackles (Dragonfire)

    },
    upgrade() { tone(300, 900, 0.28, 'triangle', 0.26); tone(450, 1350, 0.26, 'sine', 0.13, 0.05); },
    wild() { [0, 4, 7, 11, 14, 19].forEach((n, i) => tone(note(n + 12), note(n + 12), 0.16, 'sine', 0.13, i * 0.05)); },
    undo() { tone(720, 160, 0.32, 'triangle', 0.22); noise(0.26, 0.14, 1900, 280); },
  };

    if (!ac || !enabled()) return;

      case 'wall': play('wall', ev.v); break;
      case 'merge': play('merge', ev.tier, ev.combo + (ev.n >= CONFIG.cluster.min ? ev.n : 0)); if (ev.n >= CONFIG.cluster.min) play('checkmate'); break;
      case 'checkmate': play('checkmate'); break;
      case 'spawn': play('spawn'); break;
      case 'fade': play('fade'); break;
      case 'gameover': play('gameover'); break;
      case 'levelclear': play('levelclear'); break;
      case 'item': play(ev.id); break;
      case 'itemget': play('itemget'); break;
      case 'bonus': play('bonus'); break;
      case 'rampup': play('rampup'); break;
      case 'shockwave': play('shockwave'); break;
      case 'shatter': case 'pillarbreak': case 'unstone': play('shatter'); break;
      case 'ultimate': play('checkmate'); play('shockwave'); if (ev.ult === 'fireball') play('fire'); break;

      case 'pillarhit': play('wall', 900); break;
      case 'pillar': play('spawn'); break;
      case 'sting': play('wall', 1400); break;
      case 'stingdrop': play('fade'); break;
      case 'headcut': play('shatter'); break;
      case 'headburn': play('fire'); play('shatter'); break;
      case 'headgrow': play('spawn'); break;
      case 'rise': play('fade'); break;
    }
  }
  return { unlock, suspend, play, event, stats };
})();

    ${btn('levels', '📜 ' + t('mode.level'), 'main big', t('levels.progress', { ch: t('chapter.' + chNow), s: stars, m: CONFIG.levels.length * 3 }))}

    <div class="tiles"><button data-act="kinds">${thumb(hero, save.seen[hero], '')}${t('creatures')}<small>${t('creaturesSub', { n: save.active.length, v: save.vp })}</small></button>

    ${Profile.newFeatures(save).map(f => `<p class="goalbox">${t('unlock.' + f)} <button class="mini" data-act="ack:${f}">${t('unlock.ok')}</button></p>`).join('')}</div>`;
  },
  settings() {
    return `<div class="card"><h2>${t('settings')}</h2>

  },
  backup() {
    const code = Profile.exportCode(save), p = bk.pending;
    const msg = bk.msg ? `<p class="note ${bk.msgCls || ''}">${bk.msg}</p>` : '';
    const found = p ? `<p class="note okmsg">${t('backup.found', { vp: p.vp, best: p.best.classic || 0, n: p.unlocked.length, lv: p.cleared.length })}</p><p class="note warn">${t('backup.applywarn')}</p>${btn('backup:apply', t('backup.apply'), 'main')}` : '';

  kinds() {

    }).join('');

  },
  levels() {
    let ch = 0;
    const rows = CONFIG.levels.map((lv, i) => {
      const cleared = save.cleared.includes(i), open = Profile.levelOpen(save, i);

      const head = lv.chapter !== ch ? `<div class="best chead"><b>${t('chapter.' + (ch = lv.chapter))}</b>${reread(ch)}</div>` : '';
      const sub = open ? goalText(lv) + goalTimes(lv) + '<br>' + (cleared ? starStr(save.stars[i] || 1) : t('level.reward', { n: lv.reward })) : t('level.locked');

    const lv = Game.levelOf(game), i = game.level;
    const elden = CONFIG.story.chapters.includes(lv.chapter) ? `<p class="elden">${t('story.quote', { s: t('lv.' + lv.id + '.elden') })}<small>— ${t('story.elden')}</small></p>` : '';   // Elden's line above the goal
    return `<div class="card"><p class="best">${t('chapter.' + lv.chapter)} · ${t('level.n', { n: i + 1 })}</p><h2>${t('lv.' + lv.id + '.name')}</h2>

    ${btn('start', t('brief.go'), 'main')}${btn('levels', t('back'))}</div>`;
  },
  story() {                                                    // chapter opening / closing card (text; art/story/ch<N>.jpg on top when present)
    const c = story.id.split('.')[0].slice(2), kind = story.id.split('.')[1];
    return `<div class="card story"><img class="art" src="art/story/ch${c}.jpg" alt="" onerror="this.remove()"><p class="best">${t('chapter.' + c)}</p><h2>${t('story.' + kind)}</h2>
    <p class="tale">${t('story.' + story.id)}</p>${btn('storygo', t('story.continue'), 'main')}</div>`;
  },
  paused() {
    const lv = Game.levelOf(game);
    const goal = lv ? `<p class="goalbox">🎯 <b>${goalText(lv)}</b> ${Game.goalProgress(game).have}/${Game.goalProgress(game).need}</p><p class="note">${t('lv.' + lv.id + '.tip')}</p>` : '';
    return `<div class="card"><h2>${t('paused')}</h2>${goal}
    ${btn('resume', t('resume'), 'main')}${btn('restart', t('restart'))}${lv ? btn('levels', t('levels.title')) : ''}${btn('menu', t('menu'))}</div>`;
  },
  result() {
    const won = game.phase === 'won', v = Game.vp(game);
    let extra = '';
    if (won) extra = `<p class="stars">${starStr(game.stars)}</p><p class="best">${t('result.shots', { n: game.shots })}</p>` + (lastReward ? `<p class="best">${t('level.stars', { n: lastReward })}　${t('vpTotal', { n: save.vp })}</p>` : '');
    else if (game.endReason === 'shots') extra = `<p class="best">${t('result.outOfShots')}</p>`;
    else if (game.mode.tracksBest) extra = `<p class="best">${newBest ? t('newBest') : t('bestIs', { n: save.best[Profile.bestKey(game)] || 0 })}</p>${game.itemsUsed ? `<p class="best">${t('result.items')}</p>` : ''}`;
    if (game.mode.id === 'classic' && Object.keys(game.eq).length) extra += `<p class="best">${t('result.equip', { list: Object.keys(game.eq).map(id => EQ_ICON[id] + ' ' + t('eq.' + id)).join(' · ') })}</p>`;
    if (v.total) extra += `<p class="best">${t('vpGain', { n: v.total, a: v.fromScore, k: v.fromKings ? t('vpKings', { n: v.fromKings }) : '' })}　${t('vpTotal', { n: save.vp })}</p>`;
    const hasNext = won && game.level + 1 < CONFIG.levels.length;   // 'next' opens the next level's briefing (after the chapter's closing card on its first clear)
    const lvR = Game.levelOf(game);
    if (won && lvR && lvR.chapter === 1) extra = `<p class="goalbox">${t('result.learned', { s: t('lv.' + lvR.id + '.learn') })}</p>` + extra + (hasNext ? `<p class="note">${t('result.nextUp', { name: t('lv.' + CONFIG.levels[game.level + 1].id + '.name') })}</p>` : '');   // chapter 1 recap
    return `<div class="card"><h2>${won ? t('level.clear') : t('gameOver')}</h2>${game.level == null ? `<p class="big">${game.score}</p>` : ''}${extra}
      ${won && closeCard ? btn('storyclose', t('story.continue'), 'main') : hasNext ? btn('next', t('level.next'), 'main') : ''}
      ${btn('restart', won ? t('level.replay') : t('retry'), hasNext || (won && closeCard) ? '' : 'main')}${btn('menu', t('menu'))}</div>`;
  },
};
function showScreen() {
  const s = flow.state;
  ov.className = s === 'playing' ? '' : 'on ' + s;
  ov.innerHTML = SCREENS[s] ? SCREENS[s]() : '';
  refreshButtons();
}
function go(ev) { if (!Flow.send(flow, ev)) return; if (ev === 'start' || ev === 'restart') { Fx.reset(); Tutor.reset(); startCameo(); } showScreen(); }   // clear leftover effects on a new run
function applyProfile() { Game.setFeatures(game, Profile.features(save)); Game.setEquip(game, Profile.features(save).equip ? Profile.wornLevels(save) : {}); }   // unlocks + worn equipment → game
/* ── Backup screen state (code to restore is validated first, then applied on a second tap) ── */
const bk = { input: '', pending: null, msg: '', msgCls: '' };
const escapeHtml = (v) => String(v).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
ov.addEventListener('input', e => { if (e.target.id === 'bkIn') { bk.input = e.target.value; bk.pending = null; } });
function backupAct(cmd) {
  const say = (msg, cls) => { bk.msg = msg; bk.msgCls = cls || ''; showScreen(); };
  const code = Profile.exportCode(save);
  if (cmd === 'copy') {
    const fallback = () => { const el = document.getElementById('bkOut'); el.focus(); el.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (e) {} say(t(ok ? 'backup.copied' : 'backup.copyfail'), ok ? 'okmsg' : 'warn'); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(() => say(t('backup.copied'), 'okmsg'), fallback); else fallback();
  } else if (cmd === 'share') {
    navigator.share({ title: 'Kings of Cups backup', text: code }).catch(() => {});
  } else if (cmd === 'check') {
    const r = Profile.importCode(bk.input);
    bk.pending = r.ok ? r.profile : null;
    say(r.ok ? '' : t('backup.err.' + r.error), 'warn');
  } else if (cmd === 'apply' && bk.pending) {
    for (const k of Object.keys(save)) delete save[k];
    Object.assign(save, bk.pending); Storage.save(save);
    bk.pending = null; bk.input = '';
    Game.setKinds(game, activeKinds()); refreshButtons();
    say(t('backup.done'), 'okmsg');
  }
}
function openLevel() {                                        // a chapter's opening card first (once), then the briefing
  const id = Profile.storyBefore(save, game.level);
  if (id) { story = { id, then: 'brief' }; go('story'); } else go('brief');
}
function act(a) {
  Sprites.preload(a.startsWith('level:') ? CONFIG.levels[+a.slice(6)].kinds : activeKinds());
  if (a.startsWith('start:')) { Game.setKinds(game, activeKinds()); applyProfile(); Game.setMode(game, a.slice(6)); go('start'); }
  else if (a.startsWith('level:')) { Game.startLevel(game, +a.slice(6)); openLevel(); }
  else if (a === 'next') { Game.startLevel(game, game.level + 1); openLevel(); }
  else if (a.startsWith('story:')) { story = { id: a.slice(6), then: 'levels' }; go('story'); }                 // re-read from the chapter list
  else if (a === 'storyclose') { story = { id: closeCard, then: game.level + 1 < CONFIG.levels.length ? 'next' : 'levels' }; closeCard = null; go('story'); }
  else if (a === 'storygo') {                                   // continue after a card: mark it read, then on to what comes next
    if (Profile.readStory(save, story.id)) Storage.save(save);
    if (story.then === 'next') { Sprites.preload(CONFIG.levels[game.level + 1].kinds); Game.startLevel(game, game.level + 1); openLevel(); } else go(story.then);
  }
  else if (a === 'start' && flow.state === 'brief') { Game.startLevel(game, game.level); go('start'); }
  else if (a === 'restart') { closeCard = null; bankVP(); applyProfile(); Game.rematch(game, activeKinds()); go('restart'); }
  else if (a === 'menu') { closeCard = null; bankVP(); go('menu'); }
  else if (a === 'lang') { Profile.setLang(save, save.lang === 'zh' ? 'en' : 'zh'); Storage.save(save); showScreen(); }
  else if (a.startsWith('kind:')) { if (Profile.toggleKind(save, +a.slice(5))) Storage.save(save); showScreen(); }
  else if (a.startsWith('eqbuy:')) { if (Profile.buyEquip(save, a.slice(6))) Storage.save(save); showScreen(); }
  else if (a.startsWith('eqwear:')) { if (Profile.toggleWear(save, a.slice(7))) Storage.save(save); showScreen(); }
  else if (a.startsWith('ack:')) { Profile.ackFeature(save, a.slice(4)); Storage.save(save); showScreen(); }
  else if (a.startsWith('backup:')) backupAct(a.slice(7));
  else if (a === 'backup') { bk.msg = ''; bk.pending = null; go('backup'); }
  else if (a.startsWith('buy:')) { if (Profile.buy(save, +a.slice(4))) Storage.save(save); showScreen(); }
  else go(a);
}
ov.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (el && !el.disabled) act(el.dataset.act); });
bPause.onclick = () => { if (game.drag) Game.endDrag(game, game.drag.id); go('pause'); };
bAssist.onclick = () => { game.assist = !game.assist; refreshButtons(); };
bSound.onclick = () => { Profile.toggleSound(save); Storage.save(save); refreshButtons(); };
document.addEventListener('pointerdown', () => Sfx.unlock());                       // iOS must start audio inside a user gesture
document.addEventListener('click', e => { if (e.target.closest('button')) Sfx.play('click'); });
document.addEventListener('visibilitychange', () => { if (document.hidden) { Sfx.suspend(); if (flow.state === 'playing') bPause.onclick(); } });

/* ───────── Debug panel (tap the version label bottom right): for diagnosing the iPhone home-screen app ───────── */
const dbg = { frames: 0, doc: '-', ptr: '-', touches: 0, begin: '-' };
document.addEventListener('pointerdown', e => { dbg.doc = e.pointerType + '@' + Math.round(e.clientX) + ',' + Math.round(e.clientY); }, true);
document.addEventListener('touchstart', () => { dbg.touches++; }, { capture: true, passive: true });
function dbgText() {
  const r = canvas.getBoundingClientRect(), vv = window.visualViewport, h = game.held;
  const standalone = !!(navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches));
  return [APP_VERSION + '  standalone=' + standalone + '  sw=' + !!(navigator.serviceWorker && navigator.serviceWorker.controller),
    'inner=' + innerWidth + 'x' + innerHeight + '  vv=' + (vv ? Math.round(vv.width) + 'x' + Math.round(vv.height) + '@' + Math.round(vv.offsetTop) : '-') + '  dpr=' + devicePixelRatio,
    'canvas=' + Math.round(r.left) + ',' + Math.round(r.top) + ' ' + Math.round(r.width) + 'x' + Math.round(r.height) + '  L.ok=' + L.ok + ' f=' + L.f.toFixed(3) + ' k=' + L.k.toFixed(3) + ' top=' + Math.round(L.top),
    'frames=' + dbg.frames + '  flow=' + flow.state + '  phase=' + game.phase + '  drag=' + !!game.drag + '  held=' + (h ? Math.round(h.x) + ',' + Math.round(h.y) : '-'),
    'touchstart=' + dbg.touches + '  doc-pointerdown=' + dbg.doc,
    'canvas-pointerdown=' + dbg.ptr + '  beginDrag=' + dbg.begin,
    'sprite-fails=' + Sprites.stats.fails + (Sprites.stats.last ? ' (' + Sprites.stats.last + ')' : '') + '  cache=' + Sprites.cache.size,
    'external-errors=' + window.__ext.length + (window.__ext.length ? ' (' + window.__ext[window.__ext.length - 1] + ')' : '')].join('\n');
}
{ const v = document.createElement('div'); v.id = 'ver'; v.textContent = APP_VERSION; document.body.appendChild(v);
  const panel = document.getElementById('dbg'); let timer = 0;
  v.addEventListener('click', () => { const on = panel.style.display !== 'block'; panel.style.display = on ? 'block' : 'none';
    clearInterval(timer); if (on) { panel.textContent = dbgText(); timer = setInterval(() => { panel.textContent = dbgText(); }, 300); } }); }

/* ───────── Main loop ───────── */
let last = performance.now();
function frame(now) {
  try {
    dbg.frames++;
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    const gdt = Fx.slow > 0 ? dt * CONFIG.ults.slowmo.k : dt; Fx.slow = Math.max(0, Fx.slow - dt);   // ultimate: brief slow motion
    if (flow.state === 'playing') { if (Fx.hitstop > 0) Fx.hitstop -= dt; else handleEvents(Game.update(game, gdt)); }   // hit-stop: physics pauses briefly on heavy hits
    Fx.update(dt); Tutor.update(dt);
    refreshHud(); refreshNext(); refreshItems(); refreshGear();
    render();
  } catch (e) { reportError(e); }
  finally { requestAnimationFrame(frame); }          // whatever goes wrong, the loop must keep running
}
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', () => setTimeout(layout, 100));
window.addEventListener('pageshow', layout);
if (window.visualViewport) window.visualViewport.addEventListener('resize', layout);
if (window.ResizeObserver) new ResizeObserver(layout).observe(document.getElementById('stage'));   // re-layout whenever the stage resizes (most reliable for the iOS home-screen app)
layout(); showScreen();
requestAnimationFrame(frame);

if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {   // PWA: playable offline (not registered on file://)
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

window.SC = SC; window.__game = game; window.__flow = flow; window.__act = act; window.__sfx = Sfx; window.__sprites = Sprites; window.__project = project; window.__render = render; window.__tutor = Tutor; window.__fx = Fx;   // for debugging and automated tests
})();
