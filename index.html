<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Kings of Cups</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#2b2233">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kings of Cups">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  html,body{margin:0;height:100%;overscroll-behavior:none;background:#2b2233;overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;color:#fff}
  #app{position:fixed;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column}
  #hud{flex:none;display:flex;justify-content:space-between;align-items:flex-end;
    padding:calc(env(safe-area-inset-top) + 8px) 14px 4px;font-size:13px;opacity:.95}
  #hud b{font-size:22px;font-variant-numeric:tabular-nums}
  #hud .r{text-align:right}
  #stage{flex:1;min-height:0;position:relative}
  canvas{position:absolute;top:0;left:0;width:100%;height:100%;display:block;touch-action:none}
  #bar{flex:none;display:flex;gap:8px;justify-content:center;
    padding:6px 12px calc(8px + env(safe-area-inset-bottom))}
  button{font:inherit;font-size:13px;color:#fff;background:#4a3b5c;border:0;border-radius:10px;
    padding:8px 12px;min-width:84px}
  button:active{background:#6b5585}
  #tray{flex:none;display:none;align-items:center;justify-content:center;gap:8px;padding:4px 10px 2px}
  #tray.on{display:flex;flex-wrap:wrap}
  #gear{display:none;flex-basis:100%;justify-content:center;gap:6px}
  #gear.on{display:flex}
  #gear span{display:flex;align-items:center;gap:3px;padding:1px 8px;border-radius:10px;background:#3a2d49;border:1px solid #6b5585;font-size:13px;line-height:20px}
  #gear small{font-size:11px;opacity:.9}
  img.ico{width:1.35em;height:1.35em;vertical-align:middle;object-fit:contain}   /* item / equipment icons scale with the text around them */
  #items button.it img.ico{width:30px;height:30px}
  .eqrow b img.ico{width:34px;height:34px;margin-right:2px}
  .tiles img.ico.tile{width:46px;height:46px;display:block;margin:0 auto}
  #nextBox{flex:none;width:78px;height:84px;box-sizing:border-box;border-radius:12px;background:#2a2036;border:1px solid #8a6fb0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  #nextBox span{font-size:10px;opacity:.8;line-height:12px}
  #nextBox canvas{position:static;width:72px;height:56px;touch-action:auto}
  #nextBox b{font-size:11px;white-space:nowrap;overflow:hidden;max-width:74px}
  #items{display:none;align-items:center;justify-content:center;gap:8px}
  #items.on{display:flex}
  #items .em{width:70px;height:10px;border-radius:6px;background:#4a3b5c;overflow:hidden}
  #items .em i{display:block;height:100%;background:linear-gradient(90deg,#ffc23d,#ff7a59)}
  #items .em.full i{animation:pulse .8s infinite alternate}
  @keyframes pulse{to{filter:brightness(1.5)}}
  #items button.it,#items .slot{width:58px;height:50px;box-sizing:border-box;border-radius:12px}
  #items button.it{min-width:0;padding:2px;font-size:22px;line-height:1.1;background:#4a3b5c;border:1px solid #8a6fb0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  #items button.it small{font-size:10px;opacity:.85}
  #items button.it:disabled{opacity:.35}
  #items button.it.new{animation:pop .5s}
  @keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
  #items .slot{border:1px dashed #6b5585}
  #items .ults{display:flex;gap:6px;margin-left:4px}
  #items .ulw{display:flex;flex-direction:column;align-items:center;gap:1px;width:64px;cursor:pointer}
  #items .ulw small{font-size:10px;line-height:11px;opacity:.9;white-space:nowrap}
  #items .ulw small.st{font-weight:700;color:#ffd36b}
  #items button.ul{position:relative;width:50px;height:50px;min-width:0;padding:3px;border-radius:50%;border:0;display:flex;align-items:center;justify-content:center}
  #items button.ul img{width:44px;height:44px;border-radius:50%;background:#2a2036;object-fit:cover;object-position:50% 15%;filter:grayscale(.6) brightness(.8)}
  #items button.ul.full img{filter:none}
  #items button.ul.full{animation:ulpulse .8s infinite alternate;box-shadow:0 0 12px var(--c)}
  #items button.ul.armed{outline:3px solid #fff;box-shadow:0 0 22px var(--c)}
  @keyframes ulpulse{from{transform:scale(1)}to{transform:scale(1.08)}}
  @media (max-width:440px){ #tray{gap:5px;padding:4px 6px 2px} #items{gap:5px;flex-wrap:wrap;max-width:296px} #items button.it,#items .slot{width:52px} #items .ults{margin-left:0} }
  #ov{position:fixed;top:0;right:0;bottom:0;left:0;z-index:5;display:none;align-items:center;justify-content:center;background:rgba(30,15,40,.78)}
  #ov.on{display:flex}
  #ov .card{max-height:calc(100dvh - 16px);overflow-y:auto}
  #ov.result{background:rgba(30,15,40,0);animation:ovin .5s .9s forwards}
  @keyframes ovin{to{background:rgba(30,15,40,.78)}}
  #ov.result .card{opacity:0;animation:cin .4s .9s forwards}
  @keyframes cin{to{opacity:1}}
  .card{width:min(86vw,360px);display:flex;flex-direction:column;gap:10px;text-align:center}
  #ov.title{background:#1d1626;padding:0}
  .titlescr{position:relative;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:calc(9vh + env(safe-area-inset-bottom));box-sizing:border-box;overflow:hidden}
  .titlescr .cover{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 55%,#4a3560 0%,#1d1626 70%)}
  .titlescr .cover img.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .titlescr .kings{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;max-width:92vw;margin-top:-6vh}
  .titlescr .kings img{height:min(18vw,120px)}
  .titlescr .logo{position:absolute;top:calc(7vh + env(safe-area-inset-top));left:0;right:0;text-align:center;text-shadow:0 3px 0 #000,0 0 18px rgba(0,0,0,.7)}
  .titlescr .logo h1{margin:0;font-size:min(11vw,72px);letter-spacing:1px}
  .titlescr .logo p{margin:4px 0 0;font-size:min(4.4vw,20px);opacity:.9}
  .titlescr button.enter{background:#ff7a59;color:#fff;font-weight:bold;position:relative;width:min(70vw,320px);font-size:24px;padding:16px;border-radius:18px;box-shadow:0 6px 0 #8a3a24,0 10px 24px rgba(0,0,0,.5)}
  .card.menu{position:relative;padding-top:6px}
  .card.menu h1{font-size:min(9vw,40px);padding:0 44px}
  .card .gear{position:absolute;top:0;right:0;min-width:44px;width:44px;height:44px;padding:0;font-size:22px;background:transparent}
  .card .row2{display:flex;gap:8px}.card .row2>button{flex:1;min-width:0}
  .card button.big{font-size:22px;padding:16px}
  .card button.mini{min-width:0;padding:6px 10px;font-size:12px;border-radius:8px}
  .card button.mini.on{background:#4f8f5a}.card button.mini.dim{opacity:.5}
  .card .goalbox button.mini{margin-left:6px;background:#ff7a59}
  .card .elden{margin:0;font-style:italic;font-size:15px;color:#ffe2b0}.card .elden small{display:block;font-style:normal;opacity:.7;margin-top:2px}
  .card.story,#ov.on .card{background:rgba(22,15,30,.94);padding:20px 18px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.6)}   /* every screen card sits over the table: dark panel keeps it readable */
  .card.story .art{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:12px}
  .card.story .tale{margin:0;font-size:16px;line-height:1.6;text-align:left;color:#f3e6cf}
  .card .chead{display:flex;align-items:center;justify-content:center;gap:8px}.card .chead button.mini{background:#5a4670}
  .eqrow{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#2a2036;border-radius:12px;padding:8px 10px;text-align:left}
  .eqrow.on{outline:2px solid #4f8f5a}.eqrow .pips{color:#ffd23d;font-size:11px;letter-spacing:1px}.eqrow small{opacity:.85}
  .eqrow .eqbtns{display:flex;flex-direction:column;gap:4px;align-items:flex-end;flex:none}
  .card .tiles{display:flex;gap:8px}.card .tiles>button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px}
  .card .tiles img{height:46px}
  .card h1{margin:0;font-size:40px}.card h2{margin:0;font-size:30px}
  .card .sub{margin:0 0 8px;opacity:.7}.card .big{font-size:44px;font-weight:700;margin:0}
  .card .best{margin:6px 0 0;opacity:.8;font-size:14px}
  .card button{font-size:17px;padding:14px;border-radius:14px}
  .card button small{display:block;font-size:12px;opacity:.7;margin-top:3px}
  .card button.row{text-align:left;display:flex;flex-direction:column;padding:10px 14px}
  .card button.row i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px;vertical-align:-1px}
  .card button.row.on{outline:2px solid #ff7a59}
  .card button.row.pic{flex-direction:row;align-items:center;gap:12px}
  .card button.row.pic > div{display:flex;flex-direction:column}
  .card img.pt{width:52px;height:56px;object-fit:contain;flex:none}
  .card img.sil{filter:brightness(0);opacity:.45}
  .codex{display:flex;flex-direction:column;gap:6px;max-height:calc(100vh - 230px);max-height:calc(100dvh - 230px);overflow-y:auto;-webkit-overflow-scrolling:touch}
  .codex .ck{background:#2a2036;border-radius:12px;padding:6px 8px;text-align:left}
  .codex .ck b{font-size:14px}
  .codex .tiers{display:flex;align-items:flex-end;justify-content:space-between}
  .codex .tiers span{display:flex;flex-direction:column;align-items:center;font-size:11px;opacity:.9}
  .card textarea{width:100%;box-sizing:border-box;min-height:74px;border-radius:12px;border:1px solid #6b5585;background:#1d1626;color:#f3e9ff;font:12px/1.35 ui-monospace,Menlo,monospace;padding:8px;resize:none;word-break:break-all}
  .card .note{font-size:13px;opacity:.85;margin:0}
  .card .goalbox{margin:0;padding:8px 10px;border-radius:10px;background:#2a2036;border:1px solid #ffb347;font-size:14px}
  .card .stars{margin:0;font-size:34px;letter-spacing:4px;color:#ffd23d}
  .card .warn{color:#ffb38a}
  .card .okmsg{color:#9ff0b0}
  .card button.lang{background:transparent;border:1px solid #6b5585;font-size:14px;padding:9px}
  .card button.main{background:#ff7a59}.card button:disabled{opacity:.35}
  #err{display:none;position:fixed;left:0;right:0;bottom:0;z-index:99;background:rgba(150,0,0,.92);color:#fff;font:11px/1.35 monospace;padding:8px 10px calc(8px + env(safe-area-inset-bottom));word-break:break-all}
  #ver{position:fixed;right:0;bottom:calc(0px + env(safe-area-inset-bottom));z-index:6;font-size:11px;opacity:.55;padding:10px 12px}
  #dbg{display:none;position:fixed;left:0;top:calc(env(safe-area-inset-top) + 4px);z-index:98;background:rgba(0,0,0,.78);color:#8f8;font:10px/1.4 monospace;padding:6px 8px;pointer-events:none;white-space:pre-wrap;max-width:100vw}
  #tuneTabs{display:none;position:fixed;left:0;top:calc(env(safe-area-inset-top) + 4px);z-index:99;gap:6px;padding:4px}
  #tuneTabs button{font-size:15px;padding:10px 18px;min-height:44px;background:#333;border-radius:10px}#tuneTabs button.on{background:#ff7a59}
  #tune{display:none;position:fixed;left:0;top:calc(env(safe-area-inset-top) + 60px);bottom:0;z-index:98;width:min(560px,100vw);overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain;-webkit-user-select:text;user-select:text;background:rgba(10,8,16,.93);color:#eee;font-size:14px;padding:8px 14px 40px;box-sizing:border-box}
  #tune h4{margin:16px 0 4px;color:#ffd23d;font-size:15px}#tune .th{opacity:.75;font-size:12px}
  #tune .tr{padding:6px 0;border-bottom:1px solid #2c2438}#tune .tr.chg .tv{color:#ff9a7a}
  #tune .tl{display:flex;justify-content:space-between;font-size:15px}#tune .tv{font:bold 16px monospace}
  #tune .ts{display:flex;align-items:center;gap:8px}#tune .ts button{min-width:48px;min-height:44px;font-size:22px;padding:0}
  #tune input[type=range]{flex:1;height:44px;margin:0;touch-action:none;accent-color:#ff7a59}
  #tune .td{font-size:11px;opacity:.8}#tune .td code{opacity:.7}#tune .tdef{font-size:12px;padding:6px 10px;background:#2c2438}
  #tune .tb{display:flex;gap:10px;margin-top:16px}#tune .tb button{flex:1;min-height:48px;font-size:16px}
  #tune .tjson{width:100%;box-sizing:border-box;font:12px monospace;background:#000;color:#8f8;border:1px solid #444}#tune .tmsg{color:#9ff0b0;min-height:1em}
  #tuneBadge{display:none;position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 2px);z-index:97;background:#c0392b;color:#fff;font:bold 12px/1 sans-serif;padding:5px 10px;border-radius:0 0 8px 8px;pointer-events:none;white-space:nowrap}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div><span id="lblScore"></span><br><b id="score">0</b></div>
    <div class="r"><span id="lblBest"></span><br><b id="best">0</b></div>
  </div>
  <div id="stage"><canvas id="c"></canvas></div>
  <div id="ov"></div>
  <div id="tray"><div id="nextBox"><span id="nextLbl"></span><canvas id="nextCv"></canvas><b id="nextName"></b></div><div id="items"></div><div id="gear"></div></div>
  <div id="bar">
    <button id="bPause"></button>
    <button id="bAssist"></button>
    <button id="bSound"></button>
  </div>
</div>

<div id="err" onclick="this.style.display='none'"></div>
<div id="dbg"></div>
<script>
/* Diagnostics: any error shows at the bottom of the screen (tap to close) so it can be screenshotted on an iPhone */
const APP_VERSION = 'v19.0.1';
function reportError(e) {
  try { const el = document.getElementById('err'); el.textContent = '[' + APP_VERSION + '] ' + (e && e.message ? e.message : e) + (e && e.stack ? ' @ ' + String(e.stack).split('\n')[0] : ''); el.style.display = 'block'; } catch (x) {}
}
window.__ext = [];   // sanitized 'Script error.' from the browser / extensions (e.g. the share sheet): no details and not our bug — logged in the debug panel, no red bar
window.addEventListener('error', e => {
  if (!e.error && (!e.filename || e.message === 'Script error.')) { window.__ext.push(String(e.message)); return; }
  reportError(e.error || e.message);
});
window.addEventListener('unhandledrejection', e => reportError(e.reason));
</script>
<!-- Game code (plain scripts, run in this order, sharing one global scope; no build step). Core = src/core + src/data (DOM-free,
     loaded in Node by tests/_load.js in this same order). Add a new file here AND to SHELL in sw.js (tests/version.test.js checks). -->
<script src="src/core/config.js"></script>
<script src="src/data/levels.js"></script>
<script src="src/data/kinds.js"></script>
<script src="src/core/rng.js"></script>
<script src="src/core/physics.js"></script>
<script src="src/core/modes.js"></script>
<script src="src/core/game.js"></script>
<script src="src/core/flow.js"></script>
<script src="src/core/profile.js"></script>
<script src="src/app/storage.js"></script>
<script src="src/app/i18n.js"></script>
<script src="src/app/sfx.js"></script>
<script src="src/app/stage.js"></script>
<script src="src/app/sprites.js"></script>
<script src="src/app/draw.js"></script>
<script src="src/app/fx.js"></script>
<script src="src/app/tutor.js"></script>
<script src="src/app/renderer.js"></script>
<script src="src/app/input.js"></script>
<script src="src/app/ui.js"></script>
<script src="src/app/tune.js"></script>
<script src="src/app/main.js"></script>
</body>
</html>
