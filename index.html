<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Sliding Cups</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#2b2233">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sliding Cups">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  html,body{margin:0;height:100%;overscroll-behavior:none;background:#2b2233;overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;color:#fff}
  #app{position:fixed;inset:0;display:flex;flex-direction:column}
  #hud{flex:none;display:flex;justify-content:space-between;align-items:flex-end;
    padding:calc(env(safe-area-inset-top) + 8px) 14px 4px;font-size:13px;opacity:.95}
  #hud b{font-size:22px;font-variant-numeric:tabular-nums}
  #hud .r{text-align:right}
  #stage{flex:1;min-height:0;position:relative}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #bar{flex:none;display:flex;gap:8px;justify-content:center;
    padding:6px 12px calc(8px + env(safe-area-inset-bottom))}
  button{font:inherit;font-size:13px;color:#fff;background:#4a3b5c;border:0;border-radius:10px;
    padding:8px 12px;min-width:84px}
  button:active{background:#6b5585}
  #ov{position:fixed;inset:0;z-index:5;display:none;align-items:center;justify-content:center;background:rgba(30,15,40,.78)}
  #ov.on{display:flex}
  #ov.result{background:rgba(30,15,40,0);animation:ovin .5s .9s forwards}
  @keyframes ovin{to{background:rgba(30,15,40,.78)}}
  #ov.result .card{opacity:0;animation:cin .4s .9s forwards}
  @keyframes cin{to{opacity:1}}
  .card{width:min(86vw,360px);display:flex;flex-direction:column;gap:10px;text-align:center}
  .card h1{margin:0;font-size:40px}.card h2{margin:0;font-size:30px}
  .card .sub{margin:0 0 8px;opacity:.7}.card .big{font-size:44px;font-weight:700;margin:0}
  .card .best{margin:6px 0 0;opacity:.8;font-size:14px}
  .card button{font-size:17px;padding:14px;border-radius:14px}
  .card button small{display:block;font-size:12px;opacity:.7;margin-top:3px}
  .card button.row{text-align:left;display:flex;flex-direction:column;padding:10px 14px}
  .card button.row i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px;vertical-align:-1px}
  .card button.row.on{outline:2px solid #ff7a59}
  .card button.lang{background:transparent;border:1px solid #6b5585;font-size:14px;padding:9px}
  .card button.main{background:#ff7a59}.card button:disabled{opacity:.35}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div><span id="lblScore"></span><br><b id="score">0</b></div>
    <div class="r"><span id="lblBest"></span><br><b id="best">0</b></div>
  </div>
  <div id="stage"><canvas id="c"></canvas></div>
  <div id="ov"></div>
  <div id="bar">
    <button id="bPause"></button>
    <button id="bAssist"></button>
    <button id="bSound"></button>
  </div>
</div>

<script>
/* ════════════════════════════════════════════════════════════════════
   Sliding Cups — 單檔架構
   ┌ CORE（不碰 DOM，可在 Node 測試）
   │   CONFIG   所有資料與手感參數
   │   RNG      有種子的亂數
   │   Physics  純物理：移動、摩擦、碰撞、合併；只產生「事件」
   │   Modes    模式物件：出什麼杯、怎樣算輸、是否強制輔助線
   │   Game     規則與狀態機：出杯、發射（冰壺式）、計分、勝負
   └ APP（瀏覽器）
       Storage / Renderer / FX / Input / UI / main
   ════════════════════════════════════════════════════════════════════ */

/*#core-start*/
const SC = (() => {
'use strict';

/* ───────── CONFIG ───────── */
const CONFIG = {
  world: { W: 600, H: 945, LINE_Y: 720, SPAWN: { x: 300, y: 845 } },   // 俯視平面；y=0 遠端，y=H 靠近玩家
  phys: {
    STEP: 1 / 120,  // 固定時間步長
    A: 560,         // 滑動摩擦（固定減速）
    K: 0.7,         // 速度阻尼
    VMAX: 3600,     // 發射速度上限
    VMIN: 630,      // 越線時低於此速度 → 退回
    GAIN: 0.9,      // 手指速度（低於 KNEE）→ 杯子速度
    KNEE: 700,      // 超過此手指速度，超出的部分改用 GAIN_HI
    GAIN_HI: 1.7,
    E: 0.6,         // 杯子互撞彈性
    EW: 0.35,       // 撞牆彈性
    STOP: 8,        // 低於此速度視為停下
    HIST_MS: 100,   // 計算發射速度的時間窗
  },
  rules: { DANGER_T: 3, SETTLE_T: 0.25, FADE_T: 1.2, RETURN_RATE: 14, GRAB_MARGIN: 40, GRAB_OFFSET_MAX: 120 },
  scoring: { base: 10, checkmate: 2000 },
  // VP（勝利點）：每 perScore 分 1 VP；每做出一個國王 +kingBonus；unlockCost[i] = 解鎖第 i 種生物所需 VP（依序解鎖）
  vp: { perScore: 500, kingBonus: 10, unlockCost: [0, 0, 100, 200, 350, 550, 800] },
  nextTierCum: [0.5, 0.8, 0.95],                 // 出杯階級的累積機率：兵 50%、馬 30%、象 15%、城堡 5%
  view: { TILT: 0.7, S_FAR: 0.78 },
  // 關卡：目標 = 每一種「kinds」都做出國王。reward = 首次通關的 VP（重玩不再給，避免刷分）
  levels: [
    { kinds: [0],       reward: 30 },
    { kinds: [0, 1],    reward: 60 },
    { kinds: [0, 1, 2], reward: 100 },
  ],
  // massK 質量倍率、fric 摩擦倍率、bounce 彈性倍率：越大的杯子越重、停得越快、彈得越少
  tiers: [
    { r: 22, glyph: '♟', name: '兵',   massK: 1.0, fric: 1.00, bounce: 1.00 },
    { r: 28, glyph: '♞', name: '馬',   massK: 1.1, fric: 1.08, bounce: 0.95 },
    { r: 36, glyph: '♝', name: '象',   massK: 1.2, fric: 1.16, bounce: 0.90 },
    { r: 46, glyph: '♜', name: '城堡', massK: 1.3, fric: 1.24, bounce: 0.85 },
    { r: 58, glyph: '♛', name: '皇后', massK: 1.4, fric: 1.32, bounce: 0.80 },
    { r: 72, glyph: '♚', name: '國王', massK: 1.5, fric: 1.40, bounce: 0.75 },
  ],
  kinds: [
    { id: 'dragon',      name: '龍',     body: '#ff7a59', dark: '#c9482a', rim: '#ffc9b8' },
    { id: 'unicorn',     name: '獨角獸', body: '#b98cff', dark: '#7d4fd1', rim: '#e6d6ff' },
    { id: 'hydra',       name: '九頭蛇', body: '#5fd08a', dark: '#2f9a58', rim: '#c9f2d8' },
    { id: 'phoenix',     name: '鳳凰',   body: '#ffc23d', dark: '#d18f00', rim: '#ffe7a8' },
    { id: 'basilisk',    name: '蛇怪',   body: '#3cc7c2', dark: '#1d8f8b', rim: '#bff0ee' },
    { id: 'griffin',     name: '獅鷲',   body: '#c58a5a', dark: '#8a5832', rim: '#ecd0b6' },
    { id: 'aqrabuamelu', name: '蠍尾人', body: '#e8b86a', dark: '#b27d2c', rim: '#f8e3bd' },
  ],
};
const TOP = CONFIG.tiers.length - 1;

/* ───────── RNG（mulberry32，有種子 → 可重播、每日挑戰、自動測試）───────── */
function makeRng(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ───────── PHYSICS（純函式，只改 world，不認識分數與規則）───────── */
const Physics = (() => {
  const P = CONFIG.phys, Wd = CONFIG.world;
  function createWorld() { return { cups: [], events: [], nextId: 0, acc: 0 }; }
  function makeCup(world, kind, tier, x, y) {
    const T = CONFIG.tiers[tier], r = T.r;
    return { id: ++world.nextId, kind, tier, x, y, vx: 0, vy: 0, r, m: r * r * T.massK,
             fric: T.fric, bounce: T.bounce, held: false, pop: 0, dead: false };
  }
  const wallHit = (world, v) => { if (v > 60) world.events.push({ type: 'wall', v }); };
  function integrate(world, dt) {
    const W = Wd.W, H = Wd.H;
    for (const c of world.cups) {
      if (c.held || c.dead) continue;
      const sp = Math.hypot(c.vx, c.vy);
      if (sp > 0) {
        const sp2 = Math.max(0, sp - (P.A + P.K * sp) * c.fric * dt);
        if (sp2 < P.STOP) { c.vx = c.vy = 0; }
        else { const f = sp2 / sp; c.vx *= f; c.vy *= f; }
      }
      c.x += c.vx * dt; c.y += c.vy * dt;
      if (c.x < c.r)     { c.x = c.r;     if (c.vx < 0) { wallHit(world, -c.vx); c.vx = -c.vx * P.EW * c.bounce; } }
      if (c.x > W - c.r) { c.x = W - c.r; if (c.vx > 0) { wallHit(world, c.vx); c.vx = -c.vx * P.EW * c.bounce; } }
      if (c.y < c.r)     { c.y = c.r;     if (c.vy < 0) { wallHit(world, -c.vy); c.vy = -c.vy * P.EW * c.bounce; } }
      if (c.y > H - c.r) { c.y = H - c.r; if (c.vy > 0) { wallHit(world, c.vy); c.vy = -c.vy * P.EW * c.bounce; } }
    }
  }
  function merge(world, a, b) {
    a.dead = b.dead = true;
    const x = (a.x * a.m + b.x * b.m) / (a.m + b.m);
    const y = (a.y * a.m + b.y * b.m) / (a.m + b.m);
    if (a.tier === TOP) { world.events.push({ type: 'checkmate', kind: a.kind, x, y }); return; }
    const nc = makeCup(world, a.kind, a.tier + 1, x, y);
    nc.vx = (a.vx * a.m + b.vx * b.m) / (a.m + b.m);
    nc.vy = (a.vy * a.m + b.vy * b.m) / (a.m + b.m);
    nc.pop = 1;
    world.cups.push(nc);
    world.events.push({ type: 'merge', kind: a.kind, tier: nc.tier, x, y });
  }
  function collide(world) {
    const cups = world.cups;
    for (let i = 0; i < cups.length; i++) {
      const a = cups[i];
      if (a.dead || a.held) continue;
      for (let j = i + 1; j < cups.length; j++) {
        const b = cups[j];
        if (b.dead || b.held) continue;
        const dx = b.x - a.x, dy = b.y - a.y, rr = a.r + b.r;
        const d2 = dx * dx + dy * dy;
        if (d2 >= rr * rr) continue;
        if (a.kind === b.kind && a.tier === b.tier) { merge(world, a, b); break; }
        const d = Math.sqrt(d2) || 0.0001;
        const nx = dx / d, ny = dy / d;
        const ia = 1 / a.m, ib = 1 / b.m;
        const corr = (rr - d) / (ia + ib) * 0.8;
        a.x -= nx * corr * ia; a.y -= ny * corr * ia;
        b.x += nx * corr * ib; b.y += ny * corr * ib;
        const rvn = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
        if (rvn < 0) {
          if (-rvn > 40) world.events.push({ type: 'hit', v: -rvn, tier: Math.max(a.tier, b.tier) });
          const e = P.E * (a.bounce + b.bounce) / 2;
          const j2 = -(1 + e) * rvn / (ia + ib);
          a.vx -= j2 * nx * ia; a.vy -= j2 * ny * ia;
          b.vx += j2 * nx * ib; b.vy += j2 * ny * ib;
        }
      }
    }
  }
  function substep(world, dt) { integrate(world, dt); collide(world); }
  // 以固定步長推進；回傳前清掉已死亡的杯子
  function advance(world, dt) {
    world.acc += dt;
    while (world.acc >= P.STEP) { substep(world, P.STEP); world.acc -= P.STEP; }
    world.cups = world.cups.filter(c => !c.dead);
  }
  const isMoving = (world) => world.cups.some(c => !c.held && (c.vx || c.vy));
  const isSettled = (c) => !c.held && !c.vx && !c.vy;
  // 預測路徑（只算摩擦與撞牆，不含其他杯子）
  function predictPath(c, v) {
    const W = Wd.W, H = Wd.H, pts = [], pos = { x: c.x, y: c.y }, vel = { x: v.vx, y: v.vy }, dt = 1 / 60;
    for (let i = 0; i < 480; i++) {
      const sp = Math.hypot(vel.x, vel.y);
      const sp2 = Math.max(0, sp - (P.A + P.K * sp) * c.fric * dt);
      if (sp2 < P.STOP) break;
      const f = sp2 / sp; vel.x *= f; vel.y *= f;
      pos.x += vel.x * dt; pos.y += vel.y * dt;
      if (pos.x < c.r)     { pos.x = c.r;     vel.x = Math.abs(vel.x) * P.EW * c.bounce; }
      if (pos.x > W - c.r) { pos.x = W - c.r; vel.x = -Math.abs(vel.x) * P.EW * c.bounce; }
      if (pos.y < c.r)     { pos.y = c.r;     vel.y = Math.abs(vel.y) * P.EW * c.bounce; }
      if (pos.y > H - c.r) { pos.y = H - c.r; vel.y = -Math.abs(vel.y) * P.EW * c.bounce; }
      if (i % 3 === 0) pts.push({ x: pos.x, y: pos.y });
    }
    pts.push({ x: pos.x, y: pos.y });
    return pts;
  }
  return { createWorld, makeCup, advance, substep, isMoving, isSettled, predictPath };
})();

/* ───────── MODES（模式物件：只回答「出什麼杯」「怎樣算輸」）───────── */
const Modes = {
  classic: {
    id: 'classic', label: '經典',
    danger: 'lose',            // 杯子停在線內太久 → 輸
    assistForced: false,
    tracksBest: true,
    givesVP: true,
    pickNext(g) {              // 與原型相同的擲骰順序：先階級、再種類
      const t = g.rng(), cum = CONFIG.nextTierCum;
      let tier = cum.length; for (let i = 0; i < cum.length; i++) if (t < cum[i]) { tier = i; break; }
      return { kind: g.kinds[Math.floor(g.rng() * g.kinds.length)], tier };
    },
  },
  level: {
    id: 'level', label: 'Level',
    danger: 'lose',
    assistForced: false,
    tracksBest: false,
    givesVP: false,            // 關卡只給「首次通關獎勵」，由 app 發放
    pickNext(g) { return Modes.classic.pickNext(g); },
  },
  practice: {
    id: 'practice', label: '練習',
    danger: 'fade',            // 越線的杯子淡出消失，不會輸
    assistForced: true,
    tracksBest: false,
    givesVP: false,
    pickNext(g) { return Modes.classic.pickNext(g); },
  },
};

/* ───────── GAME（規則與狀態機；不碰 DOM）───────── */
const Game = (() => {
  const P = CONFIG.phys, R = CONFIG.rules, Wd = CONFIG.world;

  function create(opts) {
    opts = opts || {};
    const seed = opts.seed != null ? opts.seed >>> 0 : (Math.random() * 4294967296) >>> 0;
    const g = {
      seed, rng: makeRng(seed), kinds: [], nKinds: 1, kings: 0, kingKinds: [], level: null,
      mode: Modes[opts.mode || 'classic'], world: Physics.createWorld(),
      phase: 'ready',           // ready（等玩家發射）| flying（杯子在滑）| over
      score: 0, shotMerges: 0, dangerT: 0, settleT: 0,
      held: null, next: null, drag: null, assist: false,
    };
    setKinds(g, opts.kinds || Array.from({ length: Math.max(1, Math.min(CONFIG.kinds.length, opts.nKinds || 1)) }, (_, i) => i));
    restart(g);
    return g;
  }
  function restart(g, seed) {
    if (seed != null) { g.seed = seed >>> 0; g.rng = makeRng(g.seed); }
    g.world = Physics.createWorld();
    g.held = null; g.drag = null; g.score = 0; g.kings = 0; g.kingKinds = []; g.shotMerges = 0; g.dangerT = 0; g.settleT = 0;
    g.next = g.mode.pickNext(g);
    spawn(g);
  }
  function spawn(g) {
    const c = Physics.makeCup(g.world, g.next.kind, g.next.tier, Wd.SPAWN.x, Wd.SPAWN.y);
    c.held = true; g.world.cups.push(c); g.held = c;
    g.next = g.mode.pickNext(g);
    g.phase = 'ready';
  }
  function setMode(g, id) { g.mode = Modes[id]; g.level = null; restart(g); }
  function startLevel(g, idx) {
    g.mode = Modes.level; g.level = idx; setKinds(g, CONFIG.levels[idx].kinds); restart(g);
  }
  // 本局使用的生物（索引陣列）；下一局生效
  function setKinds(g, arr) {
    const k = [...new Set(arr)].filter(i => Number.isInteger(i) && i >= 0 && i < CONFIG.kinds.length).sort((a, b) => a - b);
    g.kinds = k.length ? k : [0]; g.nKinds = g.kinds.length;
  }
  // 這一局可得的 VP（練習模式為 0）
  function vp(g) {
    if (!g.mode.givesVP) return { fromScore: 0, fromKings: 0, total: 0 };
    const fromScore = Math.floor(g.score / CONFIG.vp.perScore), fromKings = g.kings * CONFIG.vp.kingBonus;
    return { fromScore, fromKings, total: fromScore + fromKings };
  }
  const assistOn = (g) => g.assist || g.mode.assistForced;

  /* ── 發射：手指速度 → 杯子速度（含用力時放大的曲線）── */
  function estimateV(g) {
    const d = g.drag;
    if (!d || d.hist.length < 2) return { vx: 0, vy: 0 };
    const a = d.hist[0], b = d.hist[d.hist.length - 1];
    const dt = Math.max((b.t - a.t) / 1000, 0.02);
    const fx = (b.x - a.x) / dt, fy = (b.y - a.y) / dt, sp = Math.hypot(fx, fy);
    if (sp < 1e-6) return { vx: 0, vy: 0 };
    const out = sp <= P.KNEE ? sp * P.GAIN : P.KNEE * P.GAIN + (sp - P.KNEE) * P.GAIN_HI;
    return { vx: fx / sp * out, vy: fy / sp * out };
  }
  function clampV(v) {
    const sp = Math.hypot(v.vx, v.vy);
    if (sp > P.VMAX) { const f = P.VMAX / sp; return { vx: v.vx * f, vy: v.vy * f }; }
    return v;
  }
  const launchV = (g) => clampV(estimateV(g));

  function beginDrag(g, wx, wy, pid, t) {
    if (g.phase !== 'ready' || !g.held || g.drag) return false;
    if (wy < Wd.LINE_Y - R.GRAB_MARGIN) return false;
    let ox = g.held.x - wx, oy = g.held.y - wy;
    const m = Math.hypot(ox, oy);
    if (m > R.GRAB_OFFSET_MAX) { ox *= R.GRAB_OFFSET_MAX / m; oy *= R.GRAB_OFFSET_MAX / m; }
    g.drag = { id: pid, ox, oy, hist: [{ t, x: g.held.x, y: g.held.y }] };
    return true;
  }
  // 回傳 'launched' | 'returned' | null
  function dragTo(g, wx, wy, pid, t) {
    const d = g.drag;
    if (!d || pid !== d.id || !g.held) return null;
    const h = g.held;
    const x = Math.max(h.r, Math.min(Wd.W - h.r, wx + d.ox));
    const y = Math.min(Wd.H - h.r, wy + d.oy);
    h.x = x; h.y = y;
    d.hist.push({ t, x, y });
    while (d.hist.length > 2 && t - d.hist[0].t > P.HIST_MS) d.hist.shift();
    if (y < Wd.LINE_Y) {                         // 越過線：決定是否發射
      const v = launchV(g);
      if (Math.hypot(v.vx, v.vy) < P.VMIN) { h.y = Wd.LINE_Y + 10; g.drag = null; return 'returned'; }
      h.vx = v.vx; h.vy = v.vy; h.held = false;
      g.held = null; g.drag = null; g.phase = 'flying'; g.shotMerges = 0; g.settleT = 0;
      return 'launched';
    }
    return null;
  }
  function endDrag(g, pid) { if (g.drag && g.drag.id === pid) g.drag = null; }

  /* ── 每幀更新。回傳這一幀發生的事件（給特效、音效、UI 用）── */
  function update(g, dt) {
    const out = [];
    if (g.phase === 'over' || g.phase === 'won') return out;
    const w = g.world;
    Physics.advance(w, dt);
    if (g.held && !w.cups.includes(g.held)) g.held = null;

  ctx.setLineDash([10, 8]);
  ctx.strokeStyle = danger ? `rgba(230,40,60,${0.6 + 0.4 * pulse})` : 'rgba(120,80,40,.6)';
  ctx.lineWidth = danger ? 4 : 2.5;
  ctx.beginPath(); ctx.moveTo(l1.sx, l1.sy); ctx.lineTo(r1.sx, r1.sy); ctx.stroke();
  ctx.setLineDash([]);
  if (danger) {
    const frac = Math.min(1, game.dangerT / CONFIG.rules.DANGER_T);
    ctx.fillStyle = 'rgba(230,40,60,.9)';
    ctx.fillRect(l1.sx, l1.sy - 6, (r1.sx - l1.sx) * frac, 6);
  }
  ctx.strokeStyle = '#8a5a34'; ctx.lineWidth = 6; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(d.sx, d.sy); ctx.lineTo(a.sx, a.sy); ctx.lineTo(b.sx, b.sy); ctx.lineTo(c.sx, c.sy); ctx.stroke();
}
function drawAssist() {
  if (!Game.assistOn(game) || !game.drag || !game.held) return;
  const v = Game.launchV(game);
  if (Math.hypot(v.vx, v.vy) < CONFIG.phys.VMIN * 0.6) return;
  const pts = Physics.predictPath(game.held, v);
  ctx.save();
  ctx.setLineDash([2, 8]); ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 4;
  ctx.beginPath();
  pts.forEach((q, i) => { const p = project(q.x, q.y); if (i) ctx.lineTo(p.sx, p.sy); else ctx.moveTo(p.sx, p.sy); });
  ctx.stroke();
  ctx.setLineDash([]);
  const e = pts[pts.length - 1], pe = project(e.x, e.y);
  ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.ellipse(pe.sx, pe.sy, game.held.r * pe.s, game.held.r * pe.s * tilt, 0, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
}

/* ───────── FX（粒子與浮動文字；由遊戲事件觸發）───────── */
let particles = [], popups = [];
function burst(sx, sy, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 80 + Math.random() * 220;
    particles.push({ x: sx, y: sy, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 120, life: 0.5 + Math.random() * 0.4, color, size: 2 + Math.random() * 3 });
  }
}
function popup(text, sx, sy) { popups.push({ text, x: sx, y: sy, life: 1.1 }); }
function handleEvents(events) {
  for (const ev of events) {
    Sfx.event(ev);
    if (ev.type === 'merge') {
      const p = project(ev.x, ev.y);
      burst(p.sx, p.sy, KINDS[ev.kind].rim, 10 + ev.tier * 3);
      popup((ev.combo > 1 ? t('fx.combo', { n: ev.combo }) + '  ' : '') + '+' + ev.gain, p.sx, p.sy - 20);
    } else if (ev.type === 'checkmate') {
      const p = project(ev.x, ev.y);
      burst(p.sx, p.sy, KINDS[ev.kind].body, 36);
      popup(t('fx.checkmate') + ' +' + ev.gain, p.sx, p.sy - 30);
    } else if (ev.type === 'fade') {
      const p = project(ev.x, ev.y); burst(p.sx, p.sy, '#ffffff', 8);
    } else if (ev.type === 'gameover') {
      newBest = game.mode.tracksBest && game.score > (save.best[game.mode.id] || 0);
      if (newBest) { save.best[game.mode.id] = game.score; Storage.save(save); }
      bankVP(); go('gameover');
    } else if (ev.type === 'levelclear') {
      lastReward = 0;
      if (!save.cleared.includes(ev.level)) { save.cleared.push(ev.level); lastReward = CONFIG.levels[ev.level].reward; save.vp += lastReward; Storage.save(save); }
      banked = true; go('clear');
    }
  }
}
function updateFx(dt) {
  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 500 * dt; p.life -= dt; }
  particles = particles.filter(p => p.life > 0);
  for (const p of popups) { p.y -= 28 * dt; p.life -= dt; }
  popups = popups.filter(p => p.life > 0);
}

function render() {
  ctx.setTransform(L.dpr, 0, 0, L.dpr, 0, 0);
  ctx.clearRect(0, 0, L.cw, L.ch);
  drawTable();
  drawAssist();
  const list = game.world.cups.slice().sort((a, b) => a.y - b.y);
  for (const c of list) drawCup(c);

  ctx.fillStyle = 'rgba(0,0,0,.28)'; rr(10, 6, 96, 46, 12); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = '12px sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(t('fx.next'), 18, 29);
  if (game.next) drawCupAt(80, 40, 16, game.next.kind, game.next.tier, { noShadow: true });

  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 2));
    ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.size, p.size);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = 'bold 18px sans-serif';
  for (const p of popups) {
    ctx.globalAlpha = Math.min(1, p.life * 1.5);
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(60,30,60,.8)'; ctx.strokeText(p.text, p.x, p.y);
    ctx.fillStyle = '#fff'; ctx.fillText(p.text, p.x, p.y);
  }
  ctx.globalAlpha = 1;
  if (game.mode.id === 'practice') {
    ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.font = '12px sans-serif'; ctx.textAlign = 'right';
    ctx.fillText(t('fx.practice'), L.cw - 12, 20);
  }
  if (game.mode.id === 'level') {                               // 關卡目標：每種生物的國王，達成後亮起
    const ks = CONFIG.levels[game.level].kinds;
    ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.font = '12px sans-serif'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.fillText(t('fx.goal'), L.cw - 12, 14);
    ks.forEach((k, i) => {
      const x = L.cw - 28 - i * 38, done = game.kingKinds.includes(k);
      ctx.globalAlpha = done ? 1 : 0.35; drawCupAt(x, 52, 13, k, TIERS.length - 1, { noShadow: true }); ctx.globalAlpha = 1;
      if (done) { ctx.fillStyle = '#fff'; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('✔', x, 66); }
    });
  }
}

/* ───────── Input（只把手指事件轉成 Game 的呼叫）───────── */
canvas.addEventListener('pointerdown', e => {
  if (flow.state !== 'playing') return;
  const w = toWorld(e);
  if (Game.beginDrag(game, w.x, w.y, e.pointerId, e.timeStamp)) { try { canvas.setPointerCapture(e.pointerId); } catch (err) {} }
});
canvas.addEventListener('pointermove', e => {
  if (!game.drag) return;
  const w = toWorld(e);
  if (Game.dragTo(game, w.x, w.y, e.pointerId, e.timeStamp) === 'launched') {
    const c = game.world.cups.reduce((a, b) => (a.id > b.id ? a : b));   // 剛發射的杯子
    Sfx.play('launch', Math.hypot(c.vx, c.vy));
  }
});
const endDrag = e => Game.endDrag(game, e.pointerId);
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

/* ───────── UI（HUD、按鈕、選單 / 暫停 / 結算覆蓋層）───────── */
const flow = Flow.create();
let newBest = false, banked = false, lastReward = 0;
function bankVP() {                       // 每局只入帳一次（結束、或中途退出 / 重來時）
  if (banked) return; banked = true;
  const v = Game.vp(game); if (v.total) { save.vp += v.total; Storage.save(save); }
}
const $ = (id) => document.getElementById(id);
const elScore = $('score'), elBest = $('best'), lblScore = $('lblScore'), lblBest = $('lblBest');
const bPause = $('bPause'), bAssist = $('bAssist'), bSound = $('bSound'), ov = $('ov');
function refreshButtons() {
  document.documentElement.lang = save.lang === 'zh' ? 'zh-Hant' : 'en';
  bAssist.textContent = t('aim', { v: game.mode.assistForced ? t('onPractice') : game.assist ? t('on') : t('off') });
  bSound.textContent = t('sound', { v: save.sound !== false ? t('on') : t('off') });
  bPause.textContent = t('pause');
  bPause.disabled = flow.state !== 'playing';
  lblScore.textContent = t('score');
  lblBest.textContent = game.mode.id === 'level' ? t('level') : t('best');
}
function refreshHud() {
  elScore.textContent = game.score;
  elBest.textContent = game.mode.id === 'level' ? game.level + 1
    : game.mode.tracksBest ? Math.max(save.best[game.mode.id] || 0, game.score) : '—';
}
const dot = (i) => `<i style="background:${KINDS[i].body}"></i>`;
const btn = (act, label, cls, sub) => `<button data-act="${act}" class="${cls || ''}">${label}${sub ? '<small>' + sub + '</small>' : ''}</button>`;
function showScreen() {
  const s = flow.state;
  ov.className = s === 'playing' ? '' : 'on ' + s;
  if (s === 'menu') ov.innerHTML = `<div class="card"><h1>${t('title')}</h1><p class="sub">${t('subtitle')}</p>
    ${btn('start:classic', t('mode.classic'), 'main', t('mode.classic.desc'))}
    ${btn('start:practice', t('mode.practice'), '', t('mode.practice.desc'))}
    ${btn('levels', t('mode.level'), '', t('mode.level.desc'))}
    ${btn('kinds', t('creatures', { n: save.active.length }), '', t('vp', { n: save.vp }))}
    <p class="best">${t('bestClassic', { n: save.best.classic || 0 })}</p>
    ${btn('lang', t('language') + ': ' + (save.lang === 'zh' ? '繁體中文' : 'English'), 'lang')}</div>`;
  else if (s === 'kinds') {
    const nextIdx = KINDS.findIndex((_, i) => !save.unlocked.includes(i));
    const rows = KINDS.map((K, i) => {
      const name = `<span>${dot(i)}${kindName(i)}</span>`, cost = CONFIG.vp.unlockCost[i];
      if (save.unlocked.includes(i)) { const on = save.active.includes(i); return `<button data-act="kind:${i}" class="row ${on ? 'on' : ''}">${name}<small>${on ? t('kinds.active') : t('kinds.add')}</small></button>`; }
      if (i === nextIdx) return `<button data-act="buy:${i}" class="row" ${save.vp < cost ? 'disabled' : ''}>${name}<small>${t('kinds.buy', { n: cost })}${save.vp < cost ? t('kinds.short', { n: cost - save.vp }) : ''}</small></button>`;
      return `<button class="row" disabled>${name}<small>${t('kinds.locked', { n: cost })}</small></button>`;
    }).join('');
    ov.innerHTML = `<div class="card"><h2>${t('kinds.title')}</h2><p class="best">${t('kinds.sub', { n: save.vp })}</p>${rows}${btn('menu', t('back'), 'main')}</div>`;
  } else if (s === 'levels') {
    const rows = CONFIG.levels.map((lv, i) => {
      const cleared = save.cleared.includes(i), open = i === 0 || save.cleared.includes(i - 1);
      const names = lv.kinds.map(k => dot(k) + kindName(k)).join('  ');
      const sub = open ? t('level.goal', { names }) + '<br>' + (cleared ? t('level.cleared') : t('level.reward', { n: lv.reward })) : t('level.locked');
      return `<button data-act="level:${i}" class="row ${open && !cleared ? 'on' : ''}" ${open ? '' : 'disabled'}><span>${cleared ? '✔ ' : ''}${t('level.n', { n: i + 1 })}</span><small>${sub}</small></button>`;
    }).join('');
    ov.innerHTML = `<div class="card"><h2>${t('levels.title')}</h2>${rows}${btn('menu', t('back'), 'main')}</div>`;
  } else if (s === 'paused') ov.innerHTML = `<div class="card"><h2>${t('paused')}</h2>
    ${btn('resume', t('resume'), 'main')}${btn('restart', t('restart'))}${btn('menu', t('menu'))}</div>`;
  else if (s === 'result') {
    const won = game.phase === 'won', v = Game.vp(game);
    let extra = '';
    if (won) extra = lastReward ? `<p class="best">${t('level.firstClear', { n: lastReward })}　${t('vpTotal', { n: save.vp })}</p>` : '';
    else if (game.mode.tracksBest) extra = `<p class="best">${newBest ? t('newBest') : t('bestIs', { n: save.best[game.mode.id] || 0 })}</p>`;
    if (v.total) extra += `<p class="best">${t('vpGain', { n: v.total, a: v.fromScore, k: v.fromKings ? t('vpKings', { n: v.fromKings }) : '' })}　${t('vpTotal', { n: save.vp })}</p>`;
    const hasNext = won && game.level + 1 < CONFIG.levels.length;
    ov.innerHTML = `<div class="card"><h2>${won ? t('level.clear') : t('gameOver')}</h2><p class="big">${game.score}</p>${extra}
      ${hasNext ? btn('next', t('level.next'), 'main') : ''}
      ${btn('restart', won ? t('level.replay') : t('retry'), hasNext ? '' : 'main')}${btn('menu', t('menu'))}</div>`;
  } else ov.innerHTML = '';
  refreshButtons();
}
function go(ev) { if (Flow.send(flow, ev)) showScreen(); }
function act(a) {
  if (a.startsWith('start:')) { Game.setKinds(game, activeKinds()); Game.setMode(game, a.slice(6)); banked = false; go('start'); }
  else if (a.startsWith('level:')) { Game.startLevel(game, +a.slice(6)); banked = false; go('start'); }
  else if (a === 'next') { Game.startLevel(game, game.level + 1); banked = false; go('restart'); }
  else if (a === 'restart') {
    bankVP();
    if (game.mode.id === 'level') Game.startLevel(game, game.level); else { Game.setKinds(game, activeKinds()); Game.restart(game); }
    banked = false; go('restart');
  }
  else if (a === 'menu') { bankVP(); go('menu'); }
  else if (a === 'lang') { save.lang = save.lang === 'zh' ? 'en' : 'zh'; Storage.save(save); showScreen(); }
  else if (a.startsWith('kind:')) {
    const i = +a.slice(5), at = save.active.indexOf(i);
    if (at >= 0) { if (save.active.length > 1) save.active.splice(at, 1); } else save.active.push(i);
    save.active.sort((x, y) => x - y); Storage.save(save); showScreen();
  } else if (a.startsWith('buy:')) {
    const i = +a.slice(4), cost = CONFIG.vp.unlockCost[i];
    if (!save.unlocked.includes(i) && save.unlocked.length === i && save.vp >= cost) { save.vp -= cost; save.unlocked.push(i); Storage.save(save); showScreen(); }
  } else go(a);
}
ov.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (el && !el.disabled) act(el.dataset.act); });
bPause.onclick = () => { if (game.drag) Game.endDrag(game, game.drag.id); go('pause'); };
bAssist.onclick = () => { game.assist = !game.assist; refreshButtons(); };
bSound.onclick = () => { save.sound = save.sound === false; Storage.save(save); refreshButtons(); };
document.addEventListener('pointerdown', () => Sfx.unlock());                       // iOS 要在使用者操作中啟動音訊
document.addEventListener('click', e => { if (e.target.closest('button')) Sfx.play('click'); });
document.addEventListener('visibilitychange', () => { if (document.hidden) { Sfx.suspend(); if (flow.state === 'playing') bPause.onclick(); } });

/* ───────── 主迴圈 ───────── */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (flow.state === 'playing') handleEvents(Game.update(game, dt));
  updateFx(dt);
  refreshHud();
  render();
  requestAnimationFrame(frame);
}
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', () => setTimeout(layout, 100));
layout(); showScreen();
requestAnimationFrame(frame);

if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {   // PWA：離線可玩（file:// 不註冊）
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

window.SC = SC; window.__game = game; window.__flow = flow; window.__act = act; window.__sfx = Sfx; window.__project = project;   // 除錯與自動測試用
})();
</script>
</body>
</html>
